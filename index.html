const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128svg(txt,h=42){txt=String(txt).replace(/[^\x20-\x7e]/g,'');const vals=[104,...[...txt].map(ch=>ch.charCodeAt(0)-32)];let ck=104;vals.slice(1).forEach((v,i)=>ck+=v*(i+1));vals.push(ck%103,106);
 let x=10,bars='';vals.forEach(v=>{const p=C128[v];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w}});return `<svg class="bc" viewBox="0 0 ${x+10} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`}
const autoCode=(a,t,c)=>String((a.codigo||('N'+String(a.id).slice(-4)))+'-'+t+(c?'-'+c.replace(/\s+/g,'').slice(0,3):'')).toUpperCase().replace(/[^A-Z0-9.\-]/g,'');
const codeOf=(a,t,c)=>a.barras?.[vk(t,c)]||autoCode(a,t,c);
function findCode(code){code=String(code||'').trim().toUpperCase();if(!code)return null;for(const a of D('articulos'))for(const {t,c} of variantes(a))if(String(codeOf(a,t,c)).toUpperCase()===code)return{a,t,c};return null}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.id==='q'){const m=findCode(t.value);if(m){e.preventDefault();e.stopImmediatePropagation();const ex=S.cart.find(x=>x.id===m.a.id&&x.t===m.t&&x.c===m.c);ex?ex.cant++:S.cart.push({id:m.a.id,t:m.t,c:m.c,cant:1});S.q='';t.value='';refreshCart();t.focus();toast(`+1 ${m.a.nombre} ${vname(m.t,m.c)}`)}}
 else if(t.id==='sq'){const m=findCode(t.value);if(m){e.preventDefault();e.stopImmediatePropagation();ACT.ingreso(m.a.id);setTimeout(()=>{const i=box.querySelector(`.vg input[data-t="${CSS.escape(m.t)}"][data-c="${CSS.escape(m.c)}"]`);if(i){i.value=1;i.focus();i.select()}},60)}}},true);
ACT.etiquetas=id=>{const l=id?[art(id)].filter(Boolean):D('articulos').filter(a=>a.activo!==false);S.cartOpen=false;LBL={ids:l.map(a=>a.id)};
 open(`<div class="mh"><h2>${ic('barcode')} Etiquetas con código de barras</h2>${xBtn}</div><p class="mute small">Cada talle y color tiene su código. Con un lector de códigos, en Ventas escaneás y se suma solo al carrito. Si la prenda ya trae un código de fábrica, escanealo en la casilla "Código" para usar ese.</p>
 <div class="f2"><label class="fl">Formato<select id="lbF"><option value="a4">Hoja A4 (3 por fila)</option><option value="rollo">Rollo de etiquetas 50 × 25 mm</option></select></label><label class="fl">Precio en la etiqueta<select id="lbP"><option value="-1">Sin precio</option>${C().listas.map((x,i)=>`<option value="${i}" ${i===0?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div>
 <div class="tw" style="max-height:50vh"><table class="t"><thead><tr><th>Producto</th><th>Talle / color</th><th>Código</th><th class="n">Cantidad</th></tr></thead><tbody>${l.flatMap(a=>variantes(a).map(({t,c})=>`<tr><td>${esc(a.nombre)}</td><td>${esc(vname(t,c))}</td><td><input data-bcode="${esc(a.id)}|${esc(vk(t,c))}" value="${esc(codeOf(a,t,c))}" style="min-width:150px"></td><td class="n"><input data-bq="${esc(a.id)}|${esc(vk(t,c))}" inputmode="numeric" value="${Math.max(0,svAll(a,t,c))}" style="width:80px;text-align:right"></td></tr>`)).join('')}</tbody></table></div>
 <div class="acts"><button class="btn" data-act="lbSave">Guardar códigos</button>${PRINT?`<button class="btn p" data-act="lbPrint">${ic('printer')} Imprimir etiquetas</button>`:'<span class="mute small">Para imprimir usá la versión de la compu.</span>'}</div>`,true)};
let LBL=null;
ACT.lbSave=async(x,b,silent)=>{const by={};box.querySelectorAll('[data-bcode]').forEach(i=>{const [id,k]=i.dataset.bcode.split(/\|(.+)/);const a=art(id);if(!a)return;const [t,c]=k.split('|');const v=i.value.trim().toUpperCase();if(v&&v!==autoCode(a,t,c||'')){(by[id]??={})[k]=v}else if(a.barras?.[k]){(by[id]??={})[k]=''}});
 for(const [id,m] of Object.entries(by)){const a=art(id);const bar={...(a.barras||{})};for(const [k,v] of Object.entries(m)){if(v)bar[k]=v;else delete bar[k]}await guard(()=>upd('articulos',id,{barras:bar}))}if(silent!==true)toast('Códigos guardados')};
ACT.lbPrint=async()=>{await ACT.lbSave(0,0,true);const f=$('#lbF').value,pl=+$('#lbP').value;const items=[];box.querySelectorAll('[data-bq]').forEach(i=>{const q=int(i.value);if(!q)return;const [id,k]=i.dataset.bq.split(/\|(.+)/);const a=art(id);const [t,c]=k.split('|');for(let n=0;n<Math.min(q,500);n++)items.push({a,t,c:c||''})});if(!items.length)return toast('Poné al menos una cantidad');
 const lab=({a,t,c})=>{const code=codeOf(a,t,c);return `<div class="lb"><b>${esc(a.nombre)}</b><span>${esc(vname(t,c))}${pl>=0?' · '+money(precioDe(a,pl)):''}</span>${code128svg(code)}<small>${esc(code)}</small></div>`};
 close();const el=$('#ticket');el.className=f==='rollo'?'lbRollo':'lbA4';el.innerHTML=items.map(lab).join('');$('#pagest').textContent=f==='rollo'?'@page{size:50mm 25mm;margin:0}':'@page{size:A4;margin:8mm}';setTimeout(()=>{try{window.print()}catch(e){}},80)};

 const ls=D('articulos').filter(a=>a.activo!==false&&(!cat||a.categoria===cat)&&(!soloS||stockTot(a)>0)).sort((a,b)=>ncmp(a.categoria||'',b.categoria||'')||ncmp(a.nombre,b.nombre));

 close();const el=$('#ticket');el.className='lpA4';el.innerHTML=`<div class="lp"><div class="lph">${c.ticket.logo?`<img src="${LOGO}" alt="">`:''}<div><b>${esc(c.negocio)} — Lista de precios ${esc(c.listas[l])}</b><br>${esc(fday(new Date()))} · ${esc(c.ticket.encabezado||'')} · WhatsApp ${esc(c.ticket.tel||'')}</div></div><table><thead><tr>${fot?'<th></th>':''}<th>Código</th><th>Producto</th>${tc?'<th>Talles y colores</th>':''}<th>Precio</th></tr></thead><tbody>${ls.map(a=>`<tr>${fot?`<td>${imgSrc(a.foto)?`<img src="${esc(imgSrc(a.foto))}">`:''}</td>`:''}<td>${esc(a.codigo||'')}</td><td>${esc(a.nombre)}${a.categoria?`<br><small>${esc(a.categoria)}</small>`:''}</td>${tc?`<td>${esc(tcs(a))}</td>`:''}<td class="n">${money(precioDe(a,l))}</td></tr>`).join('')}</tbody></table><p>Precios sujetos a cambio. Compra mínima: una curva de talles.</p></div>`;$('#pagest').textContent='@page{size:A4;margin:12mm}';setTimeout(()=>{try{window.print()}catch(e){}},120)};

ACT.presupuesto=async()=>{if(!S.cart.length)return toast('El carrito está vacío');const t=calc();const items=t.ls.map(({it,a})=>({art:a.id,codigo:a.codigo||'',nombre:a.nombre,linea:a.linea||'',t:it.t,c:it.c,cant:it.cant,precio:lineaPrecio(it,a)}));const NR=await nroNuevo('presupuestos'),nro=NR.nro;
 const p={nro,nroProv:NR.prov,dev:DEVID,fecha:new Date().toISOString(),cliente:S.cli.trim(),items,total:t.sub,unidades:t.u,lista:C().listas[S.lista],vendedor:vendedor()};const id=uid();
 if(await guard(()=>put('presupuestos',id,p))){S.cart=[];S.cli='';refreshCart();if(S.cartOpen)close();presuDone({...p,id})}};
function presuTxt(p){return [`*${C().negocio}* — Presupuesto N° ${pad5(p.nro)} · ${fday(p.fecha)}`,p.cliente?`Para: ${p.cliente}`:'','',...Object.entries((p.items||[]).reduce((o,i)=>{(o[i.nombre+'|'+i.precio]??=[]).push(i);return o},{})).map(([k,l])=>`${l[0].nombre}: ${l.map(i=>vname(i.t,i.c)+'×'+i.cant).join(', ')} → ${money(sum(l,i=>i.cant*i.precio))}`),'',`*Total: ${money(p.total)}*`,'Válido por 7 días. Precios sujetos a cambio.'].filter((l,i,a)=>l!==''||a[i-1]!=='').join('\n')}
function presuDone(p){const cl=cliente(p.cliente);const wa=cl?.tel?waLink(cl.tel,presuTxt(p)):'';open(`<h2>Presupuesto N° ${pad5(p.nro)} guardado</h2><p>${money(p.total)} · ${N(p.unidades)} prendas · no se descontó stock.</p><div class="acts">${PRINT?`<button class="btn p" data-act="printPresu" data-id="${esc(p.id)}" data-enter>${ic('printer')} Imprimir</button>`:''}<button class="btn p" data-act="presuPdf" data-id="${esc(p.id)}">${ic('wa')} Enviar PDF por WhatsApp</button>${wa?`<a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} Texto por WhatsApp</a>`:''}<button class="btn" data-act="copyPresu" data-id="${esc(p.id)}">Copiar</button><button class="btn" data-act="close">Listo</button></div>`)}
const presu=id=>D('presupuestos').find(x=>x.id===id);
ACT.presuPdf=id=>enviarPresuPdf(id);
ACT.copyPresu=id=>{const p=presu(id);if(p)copiar(presuTxt(p),'Presupuesto copiado')};
ACT.printPresu=id=>{const p=presu(id);if(!p)return;close();printHtml(ticketHtml({...p,pago:'',subtotal:p.total},'Presupuesto').replace('Documento no válido como factura','Presupuesto válido por 7 días · No válido como factura'))};
ACT.presuAVenta=id=>{const p=presu(id);if(!p)return;S.cart=(p.items||[]).filter(i=>art(i.art)).map(i=>({id:i.art,t:i.t,c:i.c,cant:N(i.cant),px:N(i.precio)}));S.cli=p.cliente||'';ACT.tab('vender');render(true);toast('Presupuesto en el carrito')};

/* ---- compras y proveedores ---- */
function saldoProv(nombre){const k=ckey(nombre);let s=0;D('compras').forEach(c=>{if(ckey(c.proveedor)!==k||c.anulada)return;s+=c.tipo==='Nota de crédito'?-N(c.total):N(c.total)});D('caja').forEach(c=>{if(c.tipo==='Pago proveedor'&&ckey(c.proveedor)===k&&!c.anulado)s-=N(c.monto)});return s}

 const NR=await nroNuevo('compras'),nro=NR.nro;const fecha=CMP.fecha===today()?new Date().toISOString():new Date(CMP.fecha+'T12:00').toISOString();const d={nro,nroProv:NR.prov,dev:DEVID,fecha,tipo:CMP.tipo,proveedor:CMP.proveedor,numero:CMP.numero,items:CMP.items,total:tot,unidades:sum(CMP.items,i=>i.cant),nota:CMP.nota,dep:CMP.dep||depMain(),vendedor:vendedor(),anulada:false};

 if(CMP.tipo==='Factura'&&CMP.actCosto){const seen={};for(const i of CMP.items){if(seen[i.art])continue;seen[i.art]=1;if(i.costo)await guard(()=>upd('articulos',i.art,{costo:i.costo}))}}

 ${cart.length?`<div class="fl">Cheques en cartera para entregar<div class="rows">${cart.map(q=>`<div><label class="swt"><input type="checkbox" data-chq="${esc(q.id)}" data-imp="${N(q.importe)}"> ${esc(q.banco||'')} N° ${esc(q.numero||'')} · vence ${fday(q.vencimiento)}</label><b>${money(q.importe)}</b></div>`).join('')}</div></div>`:''}

 if(met==='Cheque de terceros'&&!ids.length)return toast('Marcá los cheques que entregás');
 if(!await guard(()=>put('caja',uid(),{fecha:new Date().toISOString(),tipo:'Pago proveedor',proveedor:prov,monto,metodo:met,cuenta:met==='Transferencia'?g('#gpC'):'',cheques:ids,nota:g('#gpN'),vendedor:vendedor()})))return;
 for(const id of ids)await guard(()=>upd('cheques',id,{estado:'Entregado',para:prov,fechaEntrega:new Date().toISOString()}));
 if(met==='Cheque propio')await guard(()=>put('cheques',uid(),{fecha:new Date().toISOString(),tipo:'propio',estado:'Entregado',banco:g('#gqB'),numero:g('#gqN'),vencimiento:g('#gqV'),importe:monto,para:prov,emisor:C().negocio}));
 close();toast('Pago registrado')};

const CHQE=['En cartera','Depositado','Entregado','Cobrado','Rechazado'];
function chequesView(){const tp=S.chtipo||'tercero',es=S.chest||'';const l=D('cheques').filter(q=>q.tipo===tp&&(!es||q.estado===es)).sort((a,b)=>String(a.vencimiento).localeCompare(String(b.vencimiento)));const tot=sum(l,q=>q.importe);
 return `<div class="mh" style="margin-bottom:12px">${sub('chtipo',tp,[['tercero','De terceros'],['propio','Propios']])}<button class="btn p" data-act="newCheque">${ic('plus')} Nuevo cheque</button></div><div class="chipsrow"><button class="chipb ${!es?'on':''}" data-act="per" data-k="chest" data-id="">Todos</button>${CHQE.map(x=>`<button class="chipb ${es===x?'on':''}" data-act="per" data-k="chest" data-id="${x}">${x}</button>`).join('')}</div><div class="k4"><div class="kpi"><small>Cheques</small><b>${l.length}</b></div><div class="kpi"><small>Total</small><b>${money(tot)}</b></div></div>
 ${l.length?`<div class="tw"><table class="t"><thead><tr><th>Vence</th><th>Banco y N°</th><th>${tp==='tercero'?'De':'Emisor'}</th><th>Entregado a</th><th>Estado</th><th class="n">Importe</th><th></th></tr></thead><tbody>${l.map(q=>{const venc=q.vencimiento&&q.vencimiento<=today()&&q.estado==='En cartera';return `<tr><td class="${venc?'lowc':''}">${fday(q.vencimiento+'T12:00')}${venc?'<div class="small">Ya se puede cobrar</div>':''}</td><td>${esc(q.banco||'')} · ${esc(q.numero||'')}</td><td>${esc(q.de||q.emisor||'')}${q.cuit?`<div class="mute small">CUIT ${esc(q.cuit)}</div>`:''}</td><td>${esc(q.para||q.cuenta||'')}</td><td><span class="est ${q.estado==='Rechazado'?'Cancelado':q.estado==='En cartera'?'Pendiente':'Listo'}">${esc(q.estado)}</span></td><td class="n"><b>${money(q.importe)}</b></td><td><button class="btn s" data-act="chqEstado" data-id="${esc(q.id)}">Cambiar</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No hay cheques acá.</div>'}`}
ACT.newCheque=()=>open(`<div class="mh"><h2>Nuevo cheque</h2>${xBtn}</div><div class="f2"><label class="fl">Tipo<select id="qT"><option value="tercero">De terceros (te lo dieron)</option><option value="propio">Propio (lo emitís vos)</option></select></label><label class="fl">Importe<input id="qI" inputmode="numeric"></label><label class="fl">Banco<input id="qB"></label><label class="fl">Número<input id="qN"></label><label class="fl">Emisión<input id="qE" type="date" value="${today()}"></label><label class="fl">Vencimiento / fecha de cobro<input id="qV" type="date" value="${today()}"></label><label class="fl">De quién (cliente o firmante)<input id="qD" list="dlc4"><datalist id="dlc4">${D('clientes').map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist></label><label class="fl">CUIT del firmante<input id="qC"></label></div><div class="acts"><button class="btn p" data-act="saveCheque" data-enter>Guardar</button></div>`);

/* ---- cuentas bancarias ---- */
function movsCuenta(nombre){const k=ckey(nombre);const out=[];const m=(f,d,v)=>out.push({f,d,m:v});
 D('ventas').forEach(v=>{if(!v.anulada)partes(v).forEach(p=>{if(p.m==='Transferencia'&&ckey(p.cuenta)===k)m(v.fecha,'Venta N° '+pad5(v.nro),p.monto)})});
 D('caja').forEach(c=>{if(c.anulado)return;if(ckey(c.cuenta)!==k)return;if(c.tipo==='Cobro cuenta')m(c.fecha,'Pago de '+c.cliente,N(c.monto));if(c.tipo==='Pago proveedor')m(c.fecha,'Pago a '+c.proveedor,-N(c.monto));if(c.tipo==='Banco')m(c.fecha,c.nota||'Movimiento',N(c.monto))});
 D('gastos').forEach(g=>{if(g.metodo==='Transferencia'&&ckey(g.cuenta)===k)m(g.fecha,'Gasto: '+g.concepto,-N(g.monto))});
 D('cheques').forEach(q=>{if(q.estado==='Depositado'&&ckey(q.cuenta)===k)m(q.fechaEstado||q.fecha,'Cheque '+(q.banco||'')+' '+(q.numero||''),N(q.importe))});
 D('devoluciones').forEach(d=>{if(!d.anulada&&d.por==='Transferencia'&&ckey(d.cuenta)===k)m(d.fecha,'Devolución N° '+pad5(d.nro),-N(d.total))});
 return out.sort((a,b)=>String(b.f).localeCompare(String(a.f)))}
function bancosView(){const cs=C().cuentas;if(!cs.length)return `<div class="empty">${ic('bank')}<p>Cargá tus cuentas (Mercado Pago, bancos) en Configuración › Cobros y envíos.</p><button class="btn p" data-act="tab" data-id="config">Ir a Configuración</button></div>`;const sel=S.banco&&cs.some(c=>c.nombre===S.banco)?S.banco:cs[0].nombre;
 const sal=c=>N(c.inicial)+sum(movsCuenta(c.nombre),x=>x.m);const ms=movsCuenta(sel);
 return `<div class="k4">${cs.map(c=>`<button class="kpi" style="text-align:left;cursor:pointer;border:${c.nombre===sel?'2px solid var(--r)':'0'}" data-act="per" data-k="banco" data-id="${esc(c.nombre)}"><small>${esc(c.nombre)}</small><b>${money(sal(c))}</b></button>`).join('')}</div><div class="mh" style="margin-bottom:10px"><h3>Movimientos de ${esc(sel)}</h3><button class="btn s" data-act="bancoMov" data-id="${esc(sel)}">${ic('plus')} Movimiento manual</button></div>${ms.length?`<div class="panel rows">${ms.slice(0,200).map(x=>`<div><span>${fday(x.f)} · ${esc(x.d)}</span><b class="${x.m<0?'neg':'okc'}">${money(x.m)}</b></div>`).join('')}</div>`:'<p class="mute">Sin movimientos.</p>'}<p class="mute small">El saldo arranca en el "saldo inicial" de la cuenta (Configuración) y suma ventas por transferencia, pagos de clientes y cheques depositados; resta pagos a proveedores y gastos por transferencia.</p>`}
ACT.bancoMov=n=>open(`<div class="mh"><h2>Movimiento en ${esc(n)}</h2>${xBtn}</div><div class="f2"><label class="fl">Tipo<select id="bmT"><option value="1">Entrada</option><option value="-1">Salida</option></select></label><label class="fl">Monto<input id="bmM" inputmode="numeric" autofocus></label><label class="fl full">Concepto<input id="bmN" placeholder="Ej: comisión del banco, retiro a efectivo"></label></div><div class="acts"><button class="btn p" data-act="bancoMovOk" data-id="${esc(n)}" data-enter>Guardar</button></div>`);

/* ---- caja: medios de pago y cierres ---- */
function medioTabla(day){const ms={};const add2=(m,k,v)=>{(ms[m]??={ing:0,egr:0});ms[m][k]+=v};
 D('ventas').forEach(v=>{if(!v.anulada&&dkey(v.fecha)===day)partes(v).forEach(p=>add2(p.m,'ing',p.monto))});D('caja').forEach(c=>{if(c.anulado||dkey(c.fecha)!==day)return;if(c.tipo==='Cobro cuenta')add2(c.metodo,'ing',N(c.monto));if(c.tipo==='Pago proveedor')add2(c.metodo,'egr',N(c.monto));if(c.tipo==='Ingreso')add2('Efectivo','ing',N(c.monto));if(c.tipo==='Retiro')add2('Efectivo','egr',N(c.monto))});
 D('gastos').forEach(g=>{if(dkey(g.fecha)===day)add2(g.metodo||'Efectivo','egr',N(g.monto))});D('devoluciones').forEach(d=>{if(!d.anulada&&dkey(d.fecha)===day&&!d.cambio)add2(d.por,'egr',N(d.total))});D('pedidos').forEach(p=>{if(N(p.sena)&&dkey(p.fecha)===day&&p.estado!=='Cancelado')add2(p.senaMet||'Efectivo','ing',N(p.sena))});
 const r=Object.entries(ms);if(!r.length)return '';return `<div class="tw" style="margin-top:14px"><table class="t"><thead><tr><th>Medio de pago</th><th class="n">Entró</th><th class="n">Salió</th><th class="n">Neto</th></tr></thead><tbody>${r.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="n okc">${money(v.ing)}</td><td class="n neg">${money(v.egr)}</td><td class="n"><b>${money(v.ing-v.egr)}</b></td></tr>`).join('')}</tbody></table></div>`}

ACT.cerrarOk=async()=>{const v=$('#ccC').value;if(v==='')return toast('Escribí lo que contaste');const cont=num(v);const cj=cajaDia(today());const dif=cont-cj.queda;
 const por={};D('ventas').forEach(x=>{if(!x.anulada&&dkey(x.fecha)===today())partes(x).forEach(p=>por[p.m]=(por[p.m]||0)+p.monto)});
 if(!await guard(()=>put('cierres',uid(),{fecha:new Date().toISOString(),esperado:cj.queda,contado:cont,diferencia:dif,nota:$('#ccN').value.trim(),vendedor:vendedor(),ventas:por})))return;

 return `<div class="tw"><table class="t"><thead><tr><th>Producto</th><th class="n">Prendas</th><th class="n">Vendido</th><th class="n">Costo</th><th class="n">Ganancia</th><th class="n">Margen</th></tr></thead><tbody>${r.map(([k,o])=>`<tr><td><b>${esc(k)}</b>${o.sc?'<div class="lowc small">Falta cargar costo</div>':''}</td><td class="n">${o.u}</td><td class="n">${money(o.v)}</td><td class="n">${money(o.c)}</td><td class="n"><b class="${o.v-o.c<0?'neg':'okc'}">${money(o.v-o.c)}</b></td><td class="n">${o.v?Math.round((o.v-o.c)/o.v*100)+'%':'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="mute">Sin ventas.</td></tr>'}</tbody></table></div>`};
RT.comparar=()=>{const n=new Date();const ms=[];for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('es-AR',{month:'short'})+' '+String(d.getFullYear()).slice(2),t:0,u:0})}
 const dw=[0,0,0,0,0,0,0];D('ventas').forEach(v=>{if(v.anulada)return;const m=ms.find(x=>x.k===v.fecha.slice(0,7));if(m){m.t+=vtot(v);m.u+=N(v.unidades)}});ventasR().forEach(v=>dw[new Date(v.fecha).getDay()]+=vtot(v));const mx=Math.max(1,...ms.map(x=>x.t));
 const dn=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];return `<div class="panel" style="margin-bottom:14px"><h3>Vendido por mes (últimos 12 meses)</h3><div class="days" style="height:190px">${ms.map(m=>`<div class="day" title="${esc(m.l)}: ${money(m.t)} · ${m.u} prendas"><i style="height:${(m.t/mx*85).toFixed(1)}%"></i><small>${esc(m.l.split(' ')[0])}</small></div>`).join('')}</div></div><div class="cols2"><div class="panel"><h3>Mes a mes</h3><div class="rows">${ms.slice().reverse().map((m,i,a)=>{const p=a[i+1];const d=p&&p.t?Math.round((m.t-p.t)/p.t*100):null;return `<div><span>${esc(m.l)}</span><span><b>${money(m.t)}</b> ${d!=null?`<span class="${d<0?'neg':'okc'} small">${d>0?'+':''}${d}%</span>`:''}</span></div>`}).join('')}</div></div><div class="panel"><h3>Por día de la semana (período elegido)</h3>${bars(dw.map((t,i)=>[dn[i],t]).filter(x=>x[1]),money)}</div></div>`};
RT.clientes=()=>{const st={};D('ventas').forEach(v=>{if(v.anulada||!v.cliente)return;const o=st[ckey(v.cliente)]??={n:v.cliente,c:0,t:0,u:''};if(inR(v.fecha,rango(S.rper))){o.c++;o.t+=vtot(v)}if(!o.u||v.fecha>o.u)o.u=v.fecha});const dias=N(S.sinDias||60);const lim=new Date(Date.now()-dias*864e5).toISOString();
 const sin=D('clientes').filter(c=>{const o=st[ckey(c.nombre)];return !o||o.u<lim}).map(c=>({c,u:st[ckey(c.nombre)]?.u||''}));
 return `<div class="cols2"><div class="panel"><h3>Ranking de clientes (período elegido)</h3>${bars(Object.values(st).filter(o=>o.t).sort((a,b)=>b.t-a.t).slice(0,15).map(o=>[o.n+' ('+o.c+')',o.t]),money)}</div><div class="panel"><div class="mh"><h3>Clientes que no compran hace más de</h3><select id="sinDias" style="width:auto">${[30,60,90,180].map(d=>`<option ${d===dias?'selected':''} value="${d}">${d} días</option>`).join('')}</select></div><div class="rows">${sin.map(({c,u})=>{const wa=waLink(c.tel,`Hola ${c.nombre}! ¿Cómo estás? Te escribimos de ${C().negocio}: entraron modelos nuevos. ¿Te paso la lista?`);return `<div><span><b>${esc(c.nombre)}</b><br><span class="mute small">${u?'Última compra '+fday(u):'Nunca compró'}</span></span>${wa?`<a class="btn s" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} Escribirle</a>`:''}</div>`}).join('')||'<p class="mute">Todos compraron hace poco.</p>'}</div></div></div>`};
document.addEventListener('change',e=>{if(e.target.id==='sinDias'){S.sinDias=+e.target.value;render(true)}});
RT.comisiones=()=>{const c=C();const by={};ventasR().forEach(v=>{const k=v.vendedor||'—';const o=by[k]??={n:0,t:0,u:0};o.n++;o.t+=vtot(v);o.u+=N(v.unidades)});
 return `<div class="tw"><table class="t"><thead><tr><th>Vendedor</th><th class="n">Ventas</th><th class="n">Prendas</th><th class="n">Vendido</th><th class="n">Comisión %</th><th class="n">A pagar</th></tr></thead><tbody>${Object.entries(by).map(([k,o])=>{const p=N(c.comision[k]??c.usuarios.find(u=>u.nombre===k)?.comision);return `<tr><td><b>${esc(k)}</b></td><td class="n">${o.n}</td><td class="n">${o.u}</td><td class="n">${money(o.t)}</td><td class="n">${p}%</td><td class="n"><b>${money(o.t*p/100)}</b></td></tr>`}).join('')||'<tr><td colspan="6" class="mute">Sin ventas.</td></tr>'}</tbody></table></div><p class="mute small">El % de cada vendedor se pone en Configuración › Equipo.</p>`};
RT.ajustes=()=>{const vs=ventasR();const tr={};vs.forEach(v=>{if(N(v.envio))tr[v.transporte||'Envío']=(tr[v.transporte||'Envío']||0)+N(v.envio)});const pm={};vs.forEach(v=>{if(N(v.ajuste))pm[v.pago]=(pm[v.pago]||0)+N(v.ajuste)});

RT.stockr=()=>{const by={};let tc=0,tv=0,tu=0;D('articulos').forEach(a=>{const u=Math.max(0,stockTot(a));const k=a.categoria||'Sin categoría';const o=by[k]??={u:0,c:0,v:0};o.u+=u;o.c+=u*N(a.costo);o.v+=u*precioBase(a,0);tu+=u;tc+=u*N(a.costo);tv+=u*precioBase(a,0)});const mv=C().minVar;
 const rep=D('articulos').filter(a=>a.activo!==false).flatMap(a=>variantes(a).filter(({t,c})=>svAll(a,t,c)<=mv).map(({t,c})=>({a,t,c,s:svAll(a,t,c)})));

 <div class="panel"><div class="mh"><h3>Para reponer: talles y colores con ${mv} o menos</h3><button class="btn s" data-act="exp" data-id="reposicion">Bajar a Excel</button></div><div class="chips">${rep.slice(0,200).map(x=>`<span class="chip ${x.s>0?'low':'out'}">${esc(x.a.nombre)} ${esc(vname(x.t,x.c))}: ${x.s}</span>`).join('')||'<span class="mute">Nada para reponer.</span>'}</div></div>`};

/* ---- PDF simple (A4) sin librerías: texto, líneas, rectángulos y una imagen JPG ---- */
function pdfDoc(){const W=595.28,H=841.89;let ops=[];const pages=[];let img=null;
 const enc=s=>{s=String(s??'');let o='';for(const ch of s){let c=ch.codePointAt(0);const map={8364:128,8226:149,8211:150,8212:151,8220:147,8221:148,8216:145,8217:146,8230:133};if(map[c])c=map[c];else if(c>255)c=63;const h=String.fromCharCode(c);o+=h==='('||h===')'||h==='\\'?'\\'+h:h}return o};
 const col=hex=>{const n=parseInt(hex.replace('#',''),16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(x=>x.toFixed(3)).join(' ')};
 /* ancho aproximado de Helvetica para alinear a la derecha */
 const WD='278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500'.split(',').map(Number);
 const tw=(s,sz,bold)=>{let w=0;for(const ch of String(s??'')){const c=ch.charCodeAt(0);w+=(c>=32&&c<=122?WD[c-32]:556)*(bold?1.06:1)}return w*sz/1000};
 const api={W,H,
  text(x,y,s,o={}){const sz=o.size||10,f=o.bold?'F2':'F1';let xx=x;if(o.align==='right')xx=x-tw(s,sz,o.bold);else if(o.align==='center')xx=x-tw(s,sz,o.bold)/2;ops.push(`BT ${col(o.color||'#222222')} rg /${f} ${sz} Tf ${xx.toFixed(2)} ${(H-y).toFixed(2)} Td (${enc(s)}) Tj ET`)},
  line(x1,y1,x2,y2,o={}){ops.push(`${col(o.color||'#dddddd')} RG ${o.w||0.8} w ${x1.toFixed(2)} ${(H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(H-y2).toFixed(2)} l S`)},
  rect(x,y,w,h,o={}){ops.push(`${col(o.fill||'#f2f2f2')} rg ${x.toFixed(2)} ${(H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`)},
  image(jpgBytes,pw,ph,x,y,w,h){img={b:jpgBytes,pw,ph};ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(H-y-h).toFixed(2)} cm /Im1 Do Q`)},
  tw,newPage(){pages.push(ops);ops=[]},
  build(){pages.push(ops);const te=new TextEncoder();const chunks=[];let len=0;const offs=[];
   const add=x=>{const b=typeof x==='string'?latin(x):x;chunks.push(b);len+=b.length};
   const latin=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
   const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n`);if(Array.isArray(body))body.forEach(add);else add(body);add('\nendobj\n')};
   add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
   const np=pages.length;const first=6;/* 1 catálogo, 2 páginas, 3 F1, 4 F2, 5 imagen */
   const kids=pages.map((_,i)=>`${first+i*2} 0 R`).join(' ');
   obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${np} >>`);
   obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
   if(img)obj(5,[`<< /Type /XObject /Subtype /Image /Width ${img.pw} /Height ${img.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.b.length} >>\nstream\n`,img.b,'\nendstream']);else obj(5,'<< >>');
   pages.forEach((p,i)=>{const c=p.join('\n');const cb=latin(c);obj(first+i*2,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${img?' /XObject << /Im1 5 0 R >>':''} >> /Contents ${first+i*2+1} 0 R >>`);obj(first+i*2+1,[`<< /Length ${cb.length} >>\nstream\n`,cb,'\nendstream'])});
   const n=first+np*2;const xref=len;let x=`xref\n0 ${n}\n0000000000 65535 f \n`;for(let i=1;i<n;i++)x+=String(offs[i]||0).padStart(10,'0')+' 00000 n \n';add(x+`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
   const out=new Uint8Array(len);let o=0;chunks.forEach(c=>{out.set(c,o);o+=c.length});return out}};
 return api}
/* logo a JPG con fondo blanco, para meterlo en el PDF */
async function logoJpg(src,maxW=360){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/im.width),w=Math.round(im.width*k),h=Math.round(im.height*k);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const d=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]);const u=new Uint8Array(d.length);for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);r({b:u,w,h})};im.onerror=()=>r(null);im.src=src})}
async function presuPdf(p,venta=false,TT){const c=C(),T=TT||c.ticket;const P=pdfCfg(T);const d=pdfDoc();const M=42;let y=46;const R=/^#[0-9a-f]{6}$/i.test(P.color)?P.color:'#cb0b15';const TINT=tinte(R);
 if(P.logo){const lg=await logoJpg(LOGO);if(lg){const h=46,w=lg.w*h/lg.h;d.image(lg.b,lg.w,lg.h,M,y-8,w,h)}}else d.text(M,y+20,c.negocio,{size:20,bold:true,color:R});
 d.text(d.W-M,y+6,(venta?(P.titulo||'Comprobante de venta'):'Presupuesto').toUpperCase(),{size:18,bold:true,color:R,align:'right'});if(T.mNro)d.text(d.W-M,y+22,'N° '+pad5(p.nro),{size:11,align:'right'});d.text(d.W-M,y+(T.mNro?36:24),fday(p.fecha),{size:10,align:'right',color:'#666666'});
 y+=62;const datos=[String(T.encabezado||'').split('\n').map(x=>x.trim()).filter(Boolean).join(' · '),T.tel?'WhatsApp '+T.tel:'',T.ig,T.cuit?'CUIT '+T.cuit:''].filter(Boolean).join('   ·   ');if(datos&&P.datos){d.text(M,y,datos,{size:9,color:'#666666'});y+=10}
 d.line(M,y,d.W-M,y,{color:R,w:1.5});y+=22;
 if(p.cliente&&P.cli){d.text(M,y,'Para:',{size:10,color:'#666666'});d.text(M+34,y,p.cliente,{size:11,bold:true});const cl=cliente(p.cliente);if(cl?.tel&&P.tel)d.text(d.W-M,y,'Tel. '+cl.tel,{size:10,align:'right',color:'#666666'});y+=20}
 const X={n:M+8,v:M+200,q:d.W-M-170,p:d.W-M-90,t:d.W-M-8};
 const head=()=>{d.rect(M,y-12,d.W-2*M,20,{fill:TINT});d.text(X.n,y+2,'Producto',{size:9,bold:true});if(P.var)d.text(X.v,y+2,'Talle / color',{size:9,bold:true});d.text(X.q,y+2,'Cant.',{size:9,bold:true,align:'right'});if(P.pu)d.text(X.p,y+2,'Precio',{size:9,bold:true,align:'right'});d.text(X.t,y+2,'Subtotal',{size:9,bold:true,align:'right'});y+=24};
 head();const by={};(p.items||[]).forEach(i=>{const k=i.nombre+'|'+N(i.precio);(by[k]??=[]).push(i)});
 const corta=(s,w,sz)=>{s=String(s);while(s.length>3&&d.tw(s,sz)>w)s=s.slice(0,-2);return s};
 for(const l of Object.values(by)){const q=sum(l,i=>N(i.cant)),pr=N(l[0].precio);const vs=l.map(i=>vname(i.t,i.c)+(l.length>1||N(i.cant)>1?' ×'+N(i.cant):'')).join(', ');
  const lines=[];let cur='';(P.var?vs:'').split(', ').filter(Boolean).forEach(v=>{const t=cur?cur+', '+v:v;if(d.tw(t,9)>X.q-X.v-40){lines.push(cur);cur=v}else cur=t});if(cur)lines.push(cur);
  if(y+14*lines.length>d.H-120){d.newPage();y=50;head()}
  d.text(X.n,y,corta(l[0].nombre,(P.var?X.v:X.q-40)-X.n-10,10),{size:10,bold:true});lines.forEach((t,k)=>d.text(X.v,y+k*12,t,{size:9,color:'#444444'}));d.text(X.q,y,String(q),{size:10,align:'right'});if(P.pu)d.text(X.p,y,money(pr),{size:10,align:'right'});d.text(X.t,y,money(q*pr),{size:10,align:'right',bold:true});
  y+=Math.max(1,lines.length)*12+8;d.line(M,y-6,d.W-M,y-6,{color:'#eeeeee'})}
 y+=8;d.text(X.p,y,'Prendas',{size:10,align:'right',color:'#666666'});d.text(X.t,y,String(N(p.unidades)),{size:10,align:'right'});y+=22;
 if(venta){const fl=(l,v)=>{d.text(X.p,y,l,{size:10,align:'right',color:'#666666'});d.text(X.t,y,v,{size:10,align:'right'});y+=16};if(N(p.descuento)||N(p.recargo)||N(p.envio)||N(p.credito)||N(p.impuesto)||N(p.ajuste))fl('Subtotal',money(p.subtotal));if(N(p.impuesto))fl('Impuesto',money(p.impuesto));if(N(p.descuento))fl('Descuento','-'+money(p.descuento));if(N(p.recargo))fl('Recargo',money(p.recargo));if(N(p.ajuste))fl((N(p.ajuste)>0?'Recargo ':'Descuento ')+(p.pago||''),money(p.ajuste));if(N(p.credito))fl('A favor','-'+money(p.credito));if(N(p.envio))fl('Envío'+(p.transporte?' '+p.transporte:''),money(p.envio));y+=6}
 d.rect(X.p-70,y-15,X.t-X.p+78,24,{fill:R});d.text(X.p,y+2,'TOTAL',{size:12,bold:true,color:'#ffffff',align:'right'});d.text(X.t,y+2,money(p.total),{size:13,bold:true,color:'#ffffff',align:'right'});y+=40;
 const gris={size:9,color:'#666666'};const pl=s=>{d.text(M,y,s,gris);y+=14};
 if(venta){if(P.pago&&pagoTxt(p))pl('Pago: '+pagoTxt(p))}else pl(T.presuNota||`Válido por ${N(T.presuDias)||7} días. Precios sujetos a cambio sin previo aviso.`);
 if(P.alias&&T.alias)pl('Alias / CBU: '+T.alias);
 String(P.nota||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>{d.text(M,y,s,{size:10,color:'#333333'});y+=14});
 if(P.fact)pl('Documento no válido como factura');
 if(p.vendedor&&P.vend)d.text(M,y,'Atendió: '+p.vendedor,{size:9,color:'#666666'});
 d.text(d.W/2,d.H-30,[c.negocio,T.ig,T.tel].filter(Boolean).join(' · '),{size:8,color:'#999999',align:'center'});
 return new Blob([d.build()],{type:'application/pdf'})}
async function enviarPresuPdf(id){const p=D('presupuestos').find(x=>x.id===id);if(!p)return;const blob=await presuPdf(p);const name=pdfNombre(p.cliente);const file=new File([blob],name,{type:'application/pdf'});
 const txt=`Hola${p.cliente?' '+p.cliente.split(' ')[0]:''}! Te paso el presupuesto${nroCli(p.nro)} por ${money(p.total)}.`;
 return compartirPdf(blob,name,txt,p.cliente)}
async function compartirPdf(blob,name,txt,cli){const file=new File([blob],name,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:txt});return}}catch(e){if(e?.name==='AbortError')return}
 /* compu: se descarga el PDF y se abre WhatsApp para adjuntarlo */
 const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);
 const cl=cliente(cli);const wa=cl?.tel?waLink(cl.tel,txt):'https://wa.me/?text='+encodeURIComponent(txt);
 open(`<div class="mh"><h2>${ic('wa')} Enviar por WhatsApp</h2>${xBtn}</div><p>Ya se descargó <b>${esc(name)}</b>.</p><ol class="pasos"><li>Tocá <b>Abrir WhatsApp</b>${cl?.tel?' (se abre el chat de '+esc(cli)+')':''}.</li><li>En el chat tocá el <b>clip 📎</b> → <b>Documento</b> y elegí el PDF de <b>Descargas</b>.</li></ol><div class="acts"><button class="btn" data-act="close">Cerrar</button><a class="btn p" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} Abrir WhatsApp</a></div>`)}

async function enviarVentaPdf(v){const blob=await presuPdf(v,true);const name=pdfNombre(v.cliente);
 const txt=`Hola${v.cliente?' '+v.cliente.split(' ')[0]:''}! Te paso el comprobante de tu compra${nroCli(v.nro)} por ${money(v.total)}. ¡Gracias!`;return compartirPdf(blob,name,txt,v.cliente)}
ACT.ventaPdf=id=>{const v=saleById?saleById(id):D('ventas').find(x=>x.id===id);if(v)enviarVentaPdf(v)};

function pdfCfg(T=C().ticket){const x=T.pdf||{};const b=(k,d=true)=>x[k]===undefined?d:!!x[k];return{titulo:x.titulo||'Comprobante de venta',color:x.color||'#cb0b15',logo:x.logo===undefined?T.logo!==false:!!x.logo,datos:b('datos'),cli:b('cli'),tel:b('tel'),var:b('var'),pu:b('pu'),pago:b('pago'),alias:b('alias'),vend:b('vend'),fact:b('fact'),nota:x.nota||''}}
function tinte(h){const n=parseInt(h.slice(1),16);const m=v=>Math.round(v+(255-v)*.86).toString(16).padStart(2,'0');return '#'+m(n>>16&255)+m(n>>8&255)+m(n&255)}
/* el PDF se llama como el cliente; sin cliente, NayesJeans */
function pdfNombre(cli){const n=String(cli||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();return (n||'NayesJeans')+'.pdf'}
/* restaurar copia */
document.addEventListener('change',async e=>{const t=e.target;if(t.id!=='impJson'||!t.files?.[0])return;const f=t.files[0];t.value='';let d;try{d=JSON.parse(await f.text())}catch(er){return toast('Ese archivo no es una copia válida')}
 let datos=null,cfg={};if(d&&d.datos&&typeof d.datos==='object'){datos=d.datos;cfg=d.config||{}}else if(d&&Array.isArray(d.articulos)){datos={articulos:d.articulos,ventas:d.ventas||[],clientes:d.clientes||[]};cfg=d.config||{}}
 if(!datos)return toast('Ese archivo no es una copia de Nayes');
 ask('¿Restaurar esta copia?',`${NUBE?'Se suben a la nube (lo que ya está con el mismo código se reemplaza)':'Se reemplaza todo lo de esta compu por la copia'}: ${(datos.articulos||[]).length} productos, ${(datos.ventas||[]).length} ventas y ${(datos.clientes||[]).length} clientes.`,'Restaurar',async()=>{await cargarTodo(datos,cfg);render(true);toast('Copia restaurada')})});

try{const t=localStorage.getItem('nayes-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
/* compu: no dejar achicar la ventana mas que el minimo () */
(function(){const MW=1090,MH=710;if(!matchMedia('(pointer:fine)').matches)return;let t;
function fix(){const w=window.outerWidth,h=window.outerHeight;if(w<MW||h<MH){try{window.resizeTo(Math.max(w,MW),Math.max(h,MH))}catch(e){}}}
addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(fix,150)});fix()})();
themeUI();fromHash();render(true);boot();
/* listas desplegables propias en la compu (sin el azul de Windows), estilo Nayes */
(function(){if(!matchMedia('(pointer:fine)').matches)return;let pop=null,cur=null;
 const cerrar=()=>{pop?.remove();pop=null;cur=null};
 function abrir(sel){cerrar();cur=sel;const r=sel.getBoundingClientRect();pop=document.createElement('div');pop.className='sdrop';pop.setAttribute('role','listbox');
  [...sel.options].forEach((o,i)=>{if(o.hidden)return;const b=document.createElement('button');b.type='button';b.textContent=o.textContent;b.disabled=o.disabled;if(i===sel.selectedIndex)b.className='on';b.onmousedown=e=>{e.preventDefault();if(sel.selectedIndex!==i){sel.selectedIndex=i;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))}cerrar();sel.focus()};pop.appendChild(b)});
  document.body.appendChild(pop);const h=pop.offsetHeight,abajo=innerHeight-r.bottom>h+8||r.top<h;
  pop.style.minWidth=r.width+'px';pop.style.left=Math.min(r.left,innerWidth-pop.offsetWidth-8)+'px';pop.style.top=(abajo?r.bottom+2:r.top-h-2)+'px';pop.querySelector('.on')?.scrollIntoView({block:'nearest'})}
 document.addEventListener('mousedown',e=>{const s=e.target.closest?.('select');if(s&&!s.multiple&&!s.disabled&&s.size<=1){e.preventDefault();if(cur===s)cerrar();else{s.focus();abrir(s)}return}if(!e.target.closest?.('.sdrop'))cerrar()},true);
 addEventListener('keydown',e=>{if(pop&&e.key==='Escape'){e.stopImmediatePropagation();cerrar()}},true);
 addEventListener('resize',cerrar);addEventListener('scroll',e=>{if(pop&&!pop.contains(e.target))cerrar()},true);
})();
