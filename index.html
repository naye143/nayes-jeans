ACT.pedDel=i=>{pedRead();PED.items.splice(+i,1);pedOpen()};
ACT.savePed=async()=>{pedRead();if(!PED.items.length)return toast('Agregá al menos un producto');const tot=sum(PED.items,i=>N(i.precio)*N(i.cant));const id=PED.id||uid();const nuevo=!PED.id;
 const data={nro:PED.nro||nextNro('pedidos'),fecha:PED.fecha||new Date().toISOString(),cliente:PED.cliente,items:PED.items,total:tot,unidades:sum(PED.items,i=>i.cant),sena:num(PED.sena),senaMet:PED.senaMet,entrega:PED.entrega,transporte:PED.transporte,notas:PED.notas,estado:PED.estado,lista:N(PED.lista),vendedor:vendedor()};
 if(await guard(()=>put('pedidos',id,data))){if(PED.cliente&&!cliente(PED.cliente))await guard(()=>put('clientes',uid(),{nombre:PED.cliente,alta:data.fecha}));close();toast(nuevo?`Pedido N° ${pad5(data.nro)} creado`:'Pedido guardado')}};
ACT.delPed=id=>ask('¿Borrar este pedido?','No se puede deshacer.','Borrar',async()=>{if(await guard(()=>rm('pedidos',id)))toast('Pedido borrado')});
ACT.entregar=id=>{const p=D('pedidos').find(x=>x.id===id);if(!p)return;const saldo=N(p.total)-N(p.sena);
 ask('¿Entregar el pedido N° '+pad5(p.nro)+'?',`Se descuenta el stock y se registra la venta. ${saldo>0?'Cobrás el saldo de '+money(saldo)+' en el siguiente paso.':'Ya está todo pagado.'}`,'Entregar',async()=>{
  S.cart=(p.items||[]).filter(i=>art(i.art)).map(i=>({id:i.art,t:i.t,c:i.c,cant:N(i.cant),px:N(i.precio)}));S.cli=p.cliente||'';S.credito=N(p.sena);S.pedidoEnCurso=p.id;ACT.tab('vender');render(true);setTimeout(()=>ACT.cobrar(),80)})};
document.addEventListener('change',async e=>{const s=e.target.closest?.('[data-pedest]');if(!s)return;const p=D('pedidos').find(x=>x.id===s.dataset.pedest);if(p&&await guard(()=>upd('pedidos',p.id,{estado:s.value}))){toast('Estado: '+s.value);const cl=cliente(p.cliente);if(cl?.tel&&C().avisos[s.value])toast('Tocá "Avisar" para mandarle el WhatsApp')}});

/* ================= DEVOLUCIONES ================= */
let DEV={items:[],cambio:false,por:'Efectivo',cliente:'',motivo:'',venta:'',imprimir:true};
V.devoluciones=()=>{const tot=sum(DEV.items,i=>N(i.precio)*N(i.cant));const hoy=D('devoluciones').filter(d=>dkey(d.fecha)===today());
 return `${backBtn()}<h1 class="hd1">Devoluciones</h1><p class="mute" style="margin-top:-8px">Devoluciones y cambios de mercadería</p>
 <div class="panel"><div class="mh"><h3>¿Qué devuelve el cliente?</h3><div class="acts"><input id="dVen" placeholder="N° de venta (opcional)" value="${esc(DEV.venta)}" style="width:190px"><button class="btn s" data-act="devVincular">Vincular</button></div></div><div class="srch">${ic('search')}<input id="dq" placeholder="Código o nombre del producto" autocomplete="off"></div><div class="srchres" id="dres"></div>
 ${DEV.items.length?`<div class="rows">${DEV.items.map((i,k)=>`<div><span><b>${esc(i.nombre)}</b> · ${esc(vname(i.t,i.c))} × ${N(i.cant)} · ${money(i.precio)} c/u</span><span>${money(N(i.precio)*N(i.cant))} <button class="lnk" data-act="devDel" data-id="${k}">quitar</button></span></div>`).join('')}</div>`:''}</div>
 <label class="panel swt" style="margin:12px 0"><input type="checkbox" id="dCambio" ${DEV.cambio?'checked':''}> ${ic('swap')} <b>Es un cambio</b> <span class="mute">— se lleva otra mercadería (el valor queda a favor en la próxima venta)</span></label>
 <div class="panel"><div class="rows"><div><span>Devuelve</span><span>${money(tot)}</span></div><div><b>${DEV.cambio?'Queda a favor':'Se le devuelve'}</b><b class="bigt" style="font-size:24px">${money(tot)}</b></div></div>
 ${DEV.cambio?'':`<label class="fl">Devolver por<select id="dPor">${[...Object.keys(C().metodos),'Saldo a favor'].map(m=>`<option ${m===DEV.por?'selected':''}>${m}</option>`).join('')}</select></label>`}
 <label class="fl">Cliente <span class="small">(hace falta para dejarlo a favor)</span><input id="dCli" list="dlc3" value="${esc(DEV.cliente)}" autocomplete="off"><datalist id="dlc3">${D('clientes').map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist></label>
 <label class="fl">Motivo (opcional)<input id="dMot" value="${esc(DEV.motivo)}" placeholder="Ej: falla de fábrica, cambio de talle…"></label>
 <div class="mh"><label class="swt"><input type="checkbox" id="dImp" ${DEV.imprimir?'checked':''}> Imprimir el comprobante</label><button class="btn p big" data-act="devReg" ${DEV.items.length?'':'disabled'}>${DEV.cambio?'Registrar y pasar a la venta':'Registrar devolución'} · ${money(tot)}</button></div></div>
 <h3 style="margin:18px 0 8px">Devoluciones de hoy</h3>${hoy.length?`<div class="list">${hoy.map(d=>`<div class="pcard"><div class="mh"><div><b>N° ${pad5(d.nro)} · ${esc(d.cliente||'Sin cliente')}</b><div class="mute small">${fhora(d.fecha)} · ${esc(d.cambio?'Cambio':d.por)}${d.motivo?' · '+esc(d.motivo):''}${d.anulada?' · anulada':''}</div><div class="small">${grupoTxt(d.items)}</div></div><b class="price">${money(d.total)}</b></div>${d.anulada?'':`<div class="acts"><button class="btn s" data-act="printDev" data-id="${esc(d.id)}">${ic('printer')} Comprobante</button><button class="btn s d" data-act="devAnular" data-id="${esc(d.id)}">Anular</button></div>`}</div>`).join('')}</div>`:'<p class="mute">Todavía no hubo devoluciones hoy.</p>'}<p class="mute small">Anular deja todo como estaba: el stock vuelve a su lugar y la plata deja de restar.</p>`};
const devRead=()=>{const g=s=>(main.querySelector(s)?.value??'');DEV.venta=g('#dVen').trim();DEV.cambio=!!main.querySelector('#dCambio')?.checked;if(main.querySelector('#dPor'))DEV.por=g('#dPor');DEV.cliente=g('#dCli').trim();DEV.motivo=g('#dMot').trim();DEV.imprimir=!!main.querySelector('#dImp')?.checked};
ACT.devVincular=()=>{devRead();const v=D('ventas').find(x=>N(x.nro)===N(DEV.venta.replace(/\D/g,'')));if(!v)return toast('No encontré esa venta');DEV.cliente=v.cliente||DEV.cliente;DEV.por=v.pago==='Cuenta corriente'?'Saldo a favor':(v.pago||'Efectivo');S.cartOpen=false;
 open(`<div class="mh"><h2>Venta N° ${pad5(v.nro)}</h2>${xBtn}</div><p class="mute">${fdate(v.fecha)} · ${esc(v.cliente||'')} · Tocá lo que devuelve</p><div class="srchres">${(v.items||[]).map((i,k)=>`<button data-act="devFromV" data-id="${esc(v.id)}" data-k="${k}"><span><b>${esc(i.nombre)}</b> · ${esc(vname(i.t??i.talle,i.c))} × ${N(i.cant)} · ${money(i.precio)}</span></button>`).join('')}</div>`)};
ACT.devFromV=(id,b)=>{const v=saleById(id);const i=v.items[+b.dataset.k];const q=int(prompt2(i.cant));DEV.items.push({art:i.art,codigo:i.codigo,nombre:i.nombre,t:i.t??i.talle,c:i.c??'',cant:q||N(i.cant),precio:N(i.precio)});close();render(true)};
const prompt2=q=>q;
ACT.devPick=id=>{devRead();const a=art(id);if(!a)return;open(`<div class="mh"><h2>${esc(a.nombre)}</h2>${xBtn}</div><label class="fl">Precio por unidad que pagó<input id="dPx" inputmode="numeric" value="${precioDe(a)}"></label>${vgrid(a,'in')}<div class="acts"><button class="btn p" data-act="devPickOk" data-id="${esc(id)}" data-enter>Agregar</button></div>`);setTimeout(()=>box.querySelector('.vg input')?.focus(),40)};
ACT.devPickOk=id=>{const a=art(id);const px=num($('#dPx').value);for(const {t,c,q} of Object.values(leerGrid()))if(q>0)DEV.items.push({art:id,codigo:a.codigo||'',nombre:a.nombre,t,c,cant:q,precio:px});close();render(true)};
ACT.devDel=k=>{devRead();DEV.items.splice(+k,1);render(true)};
ACT.devReg=async()=>{devRead();if(!DEV.items.length)return;if((DEV.cambio||DEV.por==='Saldo a favor')&&!DEV.cliente&&!DEV.cambio)return toast('Elegí el cliente para dejarlo a favor');
 const tot=sum(DEV.items,i=>N(i.precio)*N(i.cant));const nro=nextNro('devoluciones');const d={nro,fecha:new Date().toISOString(),items:DEV.items,total:tot,unidades:sum(DEV.items,i=>i.cant),cambio:DEV.cambio,por:DEV.cambio?'Cambio':DEV.por,cliente:DEV.cliente,motivo:DEV.motivo,venta:DEV.venta,dep:depVenta(),vendedor:vendedor(),anulada:false};const id=uid();
 if(!await guard(()=>put('devoluciones',id,d)))return;await aplicarItems(DEV.items,1,'Devolución',`Devolución N° ${pad5(nro)}`,depVenta());
 if(DEV.cliente&&!cliente(DEV.cliente))await guard(()=>put('clientes',uid(),{nombre:DEV.cliente,alta:d.fecha}));
 const imp=DEV.imprimir;DEV={items:[],cambio:false,por:'Efectivo',cliente:'',motivo:'',venta:'',imprimir:imp};
 if(imp)printDev({...d,id});
 if(d.cambio){S.credito=tot;S.cli=d.cliente;ACT.tab('vender');toast('Cambio registrado: elegí lo que se lleva')}else{render(true);toast(`Devolución N° ${pad5(nro)} registrada`)}};
ACT.devAnular=id=>{const d=D('devoluciones').find(x=>x.id===id);ask('¿Anular la devolución?','El stock vuelve a como estaba y la plata deja de restar.','Anular',async()=>{if(await guard(()=>upd('devoluciones',id,{anulada:true}))){await aplicarItems(d.items,-1,'Anulación',`Devolución N° ${pad5(d.nro)}`,d.dep&&depos().includes(d.dep)?d.dep:depMain());toast('Devolución anulada')}})};
ACT.printDev=id=>{const d=D('devoluciones').find(x=>x.id===id);if(d)printDev(d)};

/* ================= PROMOCIONES ================= */
V.promociones=()=>{const l=D('promos');return `<div class="sub" style="margin-bottom:12px"><button data-act="tab" data-id="productos" aria-pressed="${false}">${ic('box')} Productos</button><button data-act="tab" data-id="promociones" aria-pressed="${true}">${ic('tag')} Promociones${D('promos').some(p=>p.activa)?' •':''}</button></div><div class="mh hd1"><div><h1>Promociones</h1><p class="mute">Listas de precio prearmadas. Activá una y todos sus productos quedan en oferta al instante.</p></div><button class="btn p" data-act="newPromo">${ic('plus')} Nueva promoción</button></div>
 ${l.length?`<div class="list">${l.map(p=>{const n=Object.keys(p.precios||{}).filter(id=>art(id)).length;return `<div class="pcard"><div class="mh"><div><b class="pname">${esc(p.nombre)}</b><div class="mute small">${n} productos${p.pct?' · '+p.pct+'% off':''}</div></div><div class="acts"><button class="sw ${p.activa?'on':''}" data-act="togglePromo" data-id="${esc(p.id)}" role="switch" aria-checked="${!!p.activa}"><i></i>${p.activa?'Activa':'Apagada'}</button><button class="ib" data-act="editPromo" data-id="${esc(p.id)}" aria-label="Editar">${ic('pencil')}</button><button class="ib" data-act="delPromo" data-id="${esc(p.id)}" aria-label="Borrar">${ic('trash')}</button></div></div></div>`}).join('')}</div>`:'<div class="empty">'+ic('tag')+'<p>Todavía no creaste promociones. Armá una para invierno, verano, fiestas, etc.</p></div>'}`};
let PRO=null;
ACT.newPromo=()=>{PRO={id:'',nombre:'',pct:20,precios:{},red:100};promoOpen()};
ACT.editPromo=id=>{const p=D('promos').find(x=>x.id===id);if(!p)return;PRO=JSON.parse(JSON.stringify({...p,red:p.red||100}));promoOpen()};
function promoOpen(){S.cartOpen=false;const l=D('articulos').slice().sort((a,b)=>ncmp(a.nombre,b.nombre));
 open(`<div class="mh"><h2>${PRO.id?'Editar promoción':'Nueva promoción'}</h2>${xBtn}</div><div class="f2"><label class="fl">Nombre<input id="prN" value="${esc(PRO.nombre)}" placeholder="Ej: Liquidación invierno" autofocus></label><label class="fl">Descuento %<input id="prP" inputmode="decimal" value="${esc(PRO.pct)}"></label></div><div class="acts"><button class="btn s" data-act="promoAll" data-id="1">Marcar todos</button><button class="btn s" data-act="promoAll" data-id="0">Desmarcar todos</button><button class="btn s" data-act="promoCalc">Recalcular con el %</button></div>
 <div class="tw" style="max-height:50vh"><table class="t"><thead><tr><th></th><th>Producto</th><th class="n">${esc(C().listas[0])}</th><th class="n">Precio promo</th></tr></thead><tbody>${l.map(a=>{const on=PRO.precios[a.id]!=null;return `<tr><td><input type="checkbox" data-prck="${esc(a.id)}" ${on?'checked':''}></td><td>${esc(a.nombre)} <span class="mute small">${esc(a.codigo||'')}</span></td><td class="n">${money(precioBase(a,0))}</td><td class="n"><input data-prpx="${esc(a.id)}" inputmode="numeric" value="${on?N(PRO.precios[a.id]):''}" style="width:110px;text-align:right"></td></tr>`}).join('')}</tbody></table></div>
 <div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="savePromo" style="flex:1">Guardar promoción</button></div>`,true)}
const promoRead=()=>{PRO.nombre=$('#prN').value.trim();PRO.pct=pnum($('#prP').value);const pr={};box.querySelectorAll('[data-prck]').forEach(c=>{if(c.checked){const id=c.dataset.prck;const v=num(box.querySelector(`[data-prpx="${CSS.escape(id)}"]`).value);const a=art(id);pr[id]=v||Math.round(precioBase(a,0)*(1-PRO.pct/100)/100)*100}});PRO.precios=pr};
ACT.promoAll=v=>{box.querySelectorAll('[data-prck]').forEach(c=>c.checked=v==='1');promoRead();promoOpen()};
ACT.promoCalc=()=>{promoRead();for(const id of Object.keys(PRO.precios)){const a=art(id);PRO.precios[id]=Math.round(precioBase(a,0)*(1-PRO.pct/100)/100)*100}promoOpen()};
ACT.savePromo=async()=>{promoRead();if(!PRO.nombre)return toast('Poné un nombre');if(!Object.keys(PRO.precios).length)return toast('Marcá al menos un producto');const id=PRO.id||uid();const old=D('promos').find(x=>x.id===id);
 if(await guard(()=>put('promos',id,{nombre:PRO.nombre,pct:PRO.pct,precios:PRO.precios,activa:old?.activa||false,creado:old?.creado||new Date().toISOString()}))){close();toast('Promoción guardada. Activala cuando quieras.')}};
ACT.togglePromo=async id=>{const p=D('promos').find(x=>x.id===id);if(p&&await guard(()=>upd('promos',id,{activa:!p.activa})))toast(p.activa?'Promoción apagada':'Promoción activa: ya se ve en Ventas')};
ACT.delPromo=id=>ask('¿Borrar la promoción?','Los precios normales no se tocan.','Borrar',async()=>{if(await guard(()=>rm('promos',id)))toast('Promoción borrada')});

/* ================= REPORTES ================= */
const bars=(rows,fmt=x=>x+' u.')=>{if(!rows.length)return '<p class="mute">Sin datos en este período.</p>';const mx=Math.max(...rows.map(r=>r[1]))||1;return `<div class="bars">${rows.map(([l,v])=>`<div class="bar"><span class="bl" title="${esc(l)}">${esc(l)}</span><span class="bt"><i style="width:${Math.max(0,v/mx*100).toFixed(1)}%"></i></span><span class="bv">${esc(fmt(v))}</span></div>`).join('')}</div>`};
const top=(o,k=8)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,k);
const add=(o,k,v)=>o[k]=(o[k]||0)+v;
const vtot=v=>N(v.total)+N(v.sena);
function ventasR(){const r=rango(S.rper);return D('ventas').filter(v=>!v.anulada&&inR(v.fecha,r))}
V.reportes=()=>{const r=rango(S.rper);const vs=ventasR();const tot=sum(vs,vtot);const por={};vs.forEach(v=>add(por,v.pago||'—',N(v.total)));
 const head=`<div class="mh hd1"><div><h1>Reportes</h1><p class="mute">${PERS.find(p=>p[0]===S.rper)?.[1]||''} · ${vs.length} ventas</p></div><button class="btn" data-act="repDia">${ic('printer')} Reporte del día</button></div>${grp('rtab',S.rtab,[['Ventas','cart',[['ventas','Resumen'],['comparar','Comparación'],['ajustes','Descuentos y envíos']]],['Productos','box',[['productos','Más vendidos'],['ganancia','Ganancia'],['stockr','Stock valorizado'],['movs','Movimientos']]],['Personas','users',[['clientes','Clientes'],['vend','Vendedores'],['comisiones','Comisiones']]]])}${S.rtab==='stockr'?'':perSel('rper',S.rper)+rangoInputs()}`;
 if(RT[S.rtab])return head+RT[S.rtab]();
 if(S.rtab==='movs'){const ms=D('movs').filter(m=>inR(m.fecha,r));const by={};ms.forEach(m=>add(by,m.tipo,N(m.unidades)));return head+`<div class="k4">${Object.entries(by).map(([k,v])=>`<div class="kpi"><small>${esc(k)}</small><b class="${v<0?'r':'g'}">${v>0?'+':''}${v} u.</b></div>`).join('')||'<p class="mute">Sin movimientos.</p>'}</div>`+(ms.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Detalle</th><th class="n">Unidades</th></tr></thead><tbody>${ms.slice(0,400).map(m=>`<tr><td>${fdate(m.fecha)}</td><td>${esc(m.tipo)}<div class="mute small">${esc(m.ref||'')}</div></td><td>${esc(m.nombre)}</td><td class="small">${Object.entries(m.cambios||{}).map(([k,v])=>{const [t,c]=k.split('|');return esc(vname(t,c))+': '+(v>0?'+':'')+v}).join(' · ')}</td><td class="n ${N(m.unidades)<0?'neg':'okc'}">${N(m.unidades)>0?'+':''}${N(m.unidades)}</td></tr>`).join('')}</tbody></table></div>`:'')}
 if(S.rtab==='vend'){const by={};vs.forEach(v=>{const k=v.vendedor||'—';const o=by[k]||(by[k]={n:0,t:0,u:0});o.n++;o.t+=N(v.total);o.u+=N(v.unidades)});return head+`<div class="tw"><table class="t"><thead><tr><th>Vendedor</th><th class="n">Ventas</th><th class="n">Prendas</th><th class="n">Total</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].t-a[1].t).map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td class="n">${o.n}</td><td class="n">${o.u}</td><td class="n"><b>${money(o.t)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="mute">Sin ventas.</td></tr>'}</tbody></table></div>`}
 if(S.rtab==='productos'){const bA={},bT={},bC={},bL={},bCl={};let gan=0,anyCost=false;vs.forEach(v=>{if(v.cliente)add(bCl,v.cliente,N(v.total));(v.items||[]).forEach(i=>{const q=N(i.cant);add(bA,i.nombre,q);add(bT,'T'+(i.t??i.talle),q);if(i.c)add(bC,i.c,q);add(bL,i.linea||'Sin línea',q);if(N(i.costo)){anyCost=true;gan+=(N(i.precio)-N(i.costo))*q}})});
  return head+`<div class="cols2"><div class="panel"><h3>Lo más vendido</h3>${bars(top(bA,10))}</div><div class="panel"><h3>Por talle</h3>${bars(Object.entries(bT).sort((a,b)=>ncmp(a[0],b[0])))}</div><div class="panel"><h3>Por color</h3>${bars(top(bC,10))}</div><div class="panel"><h3>Por línea</h3>${bars(top(bL))}</div><div class="panel"><h3>Mejores clientes</h3>${bars(top(bCl,8),money)}</div><div class="panel"><h3>Ganancia bruta</h3><b class="bigt">${anyCost?money(gan):'—'}</b><p class="mute small">${anyCost?'Precio de venta menos costo, de los productos que tienen costo cargado.':'Cargá el costo en cada producto para verla.'}</p></div></div>`}
 const days={};vs.forEach(v=>add(days,dkey(v.fecha),N(v.total)));const dl=Object.entries(days).sort();const mx=Math.max(1,...dl.map(x=>x[1]));
 const ctas={};vs.filter(v=>v.pago==='Transferencia').forEach(v=>add(ctas,v.cuenta||'Sin cuenta',N(v.total)));
 return head+`<div class="k4"><div class="kpi"><small>Total del período</small><b class="b">${money(tot)}</b><small>${vs.length} ventas</small></div><div class="kpi"><small>Prendas vendidas</small><b>${sum(vs,v=>v.unidades)} u.</b></div>${['Efectivo','Tarjeta','Transferencia','Cuenta corriente'].map(m=>`<div class="kpi"><small>${m}</small><b class="${m==='Efectivo'?'g':''}">${money(por[m]||0)}</b>${m==='Transferencia'&&Object.keys(ctas).length?`<button class="lnk small" data-act="verCtas">Ver por cuenta</button>`:''}</div>`).join('')}</div>
 ${dl.length>1?`<div class="panel" style="margin-bottom:14px"><h3>Por día</h3><div class="days">${dl.slice(-31).map(([d,t],i,arr)=>`<div class="day" title="${esc(d)}: ${money(t)}"><i style="height:${(t/mx*85).toFixed(1)}%"></i><small class="${(arr.length-1-i)%2?'odd':''}">${+d.slice(8)}</small></div>`).join('')}</div></div>`:''}
 ${vs.length?`<div class="tw"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th class="n">Prendas</th><th class="n">Total</th><th></th></tr></thead><tbody>${D('ventas').filter(v=>inR(v.fecha,r)).map(v=>`<tr class="${v.anulada?'off':''}"><td>${pad5(v.nro)}</td><td>${fdate(v.fecha)}</td><td>${esc(v.cliente||'—')}<div class="mute small">${esc(v.vendedor||'')}</div></td><td>${esc(v.pago)}${v.cuenta?`<div class="mute small">${esc(v.cuenta)}</div>`:''}${v.anulada?'<div class="neg small">Anulada</div>':''}</td><td class="n">${N(v.unidades)}</td><td class="n"><b>${money(v.total)}</b></td><td><div class="acts" style="flex-wrap:nowrap"><button class="ib" data-act="verVenta" data-id="${esc(v.id)}" title="Ver">${ic('receipt')}</button><button class="ib" data-act="print" data-id="${esc(v.id)}" title="Ticket">${ic('printer')}</button>${v.anulada?'':`<button class="ib" data-act="editVenta" data-id="${esc(v.id)}" title="Editar">${ic('pencil')}</button><button class="ib" data-act="anular" data-id="${esc(v.id)}" title="Anular">${ic('trash')}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">'+ic('chart')+'<p>No hay ventas en este período</p></div>'}`};
ACT.verCtas=()=>{const ctas={};ventasR().filter(v=>v.pago==='Transferencia').forEach(v=>add(ctas,v.cuenta||'Sin cuenta',N(v.total)));open(`<div class="mh"><h2>Transferencias por cuenta</h2>${xBtn}</div><div class="rows">${top(ctas,50).map(([k,v])=>`<div><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')}</div>`)};
ACT.verVenta=id=>{const v=saleById(id);if(!v)return;open(`<div class="mh"><h2>Venta N° ${pad5(v.nro)}</h2>${xBtn}</div><p class="mute">${fdate(v.fecha)} · ${esc(v.cliente||'Sin cliente')} · ${esc(v.pago)}${v.cuenta?' ('+esc(v.cuenta)+')':''} · ${esc(v.vendedor||'')}${v.anulada?' · ANULADA':''}</p><div class="small">${grupoTxt(v.items)}</div><div class="rows">${N(v.descuento)?`<div><span>Descuento</span><span>−${money(v.descuento)}</span></div>`:''}${N(v.credito)?`<div><span>A favor</span><span>−${money(v.credito)}</span></div>`:''}${N(v.envio)?`<div><span>Envío ${esc(v.transporte||'')}</span><span>${money(v.envio)}</span></div>`:''}<div><b class="tt">Total</b><b class="bigt">${money(v.total)}</b></div></div>${v.nota?`<p class="mute">Nota: ${esc(v.nota)}</p>`:''}<div class="acts"><button class="btn" data-act="print" data-id="${esc(v.id)}">${ic('printer')} Ticket</button><button class="btn" data-act="copyV" data-id="${esc(v.id)}">Copiar resumen</button></div>`)};
function repDiaTxt(){const vs=D('ventas').filter(v=>!v.anulada&&dkey(v.fecha)===today());const por={};vs.forEach(v=>add(por,v.pago,N(v.total)));const ctas={};vs.filter(v=>v.pago==='Transferencia').forEach(v=>add(ctas,v.cuenta||'Sin cuenta',N(v.total)));
 const dv=D('devoluciones').filter(d=>!d.anulada&&dkey(d.fecha)===today());const gs=D('gastos').filter(g=>dkey(g.fecha)===today());const cj=cajaDia(today());
 return{vs,por,ctas,dv,gs,cj,lines:[`${C().negocio} — Reporte del día ${fday(new Date())}`,'',`Ventas: ${vs.length} · Prendas: ${sum(vs,v=>v.unidades)}`,`Total vendido: ${money(sum(vs,vtot))}`,...Object.entries(por).map(([k,v])=>`  ${k}: ${money(v)}`),...Object.entries(ctas).map(([k,v])=>`    → ${k}: ${money(v)}`),`Devoluciones: ${dv.length} · ${money(sum(dv,d=>d.total))}`,`Gastos: ${money(sum(gs,g=>g.monto))}`,`Efectivo en caja: ${money(cj.queda)}`]}}
ACT.repDia=()=>{const r=repDiaTxt();open(`<div class="mh"><h2>Reporte del día</h2>${xBtn}</div><pre style="white-space:pre-wrap;font:15px/1.5 inherit;background:var(--soft);padding:14px;border-radius:14px">${esc(r.lines.join('\n'))}</pre><div class="acts">${PRINT?`<button class="btn p" data-act="printRep">${ic('printer')} Imprimir</button>`:''}<button class="btn" data-act="copyRep">Copiar</button></div>`)};
ACT.copyRep=()=>copiar(repDiaTxt().lines.join('\n'),'Reporte copiado');
ACT.printRep=()=>{close();printHtml(`<div class="tk"><div class="tkn">${esc(C().negocio)}</div><div class="tkc">Reporte del día</div><div class="tkl"></div>${repDiaTxt().lines.slice(2).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`)};

/* ================= GASTOS / FINANZAS ================= */
function cajaMovs(){const out=[];D('ventas').forEach(v=>{if(!v.anulada&&v.pago==='Efectivo')out.push({f:v.fecha,m:N(v.total),d:'Venta N° '+pad5(v.nro)})});
 D('caja').forEach(c=>{if(c.anulado)return;if(c.tipo==='Cobro cuenta'&&c.metodo==='Efectivo')out.push({f:c.fecha,m:N(c.monto),d:'Pago de '+c.cliente});if(c.tipo==='Ingreso')out.push({f:c.fecha,m:N(c.monto),d:'Ingreso: '+(c.nota||'')});if(c.tipo==='Retiro')out.push({f:c.fecha,m:-N(c.monto),d:'Retiro: '+(c.nota||'')})});
 D('pedidos').forEach(p=>{if(N(p.sena)&&p.senaMet==='Efectivo'&&p.estado!=='Cancelado')out.push({f:p.fecha,m:N(p.sena),d:'Seña pedido N° '+pad5(p.nro)})});
 D('devoluciones').forEach(d=>{if(!d.anulada&&d.por==='Efectivo')out.push({f:d.fecha,m:-N(d.total),d:'Devolución N° '+pad5(d.nro)})});
 D('gastos').forEach(g=>{if(g.metodo==='Efectivo')out.push({f:g.fecha,m:-N(g.monto),d:'Gasto: '+g.concepto})});
 D('caja').forEach(c=>{if(c.anulado)return;if(c.tipo==='Ajuste arqueo')out.push({f:c.fecha,m:N(c.monto),d:'Diferencia de arqueo'});if(c.tipo==='Pago proveedor'&&c.metodo==='Efectivo')out.push({f:c.fecha,m:-N(c.monto),d:'Pago a '+c.proveedor})});
 D('cheques').forEach(q=>{if(q.estado==='Cobrado'&&q.tipo==='tercero')out.push({f:q.fechaEstado||q.fecha,m:N(q.importe),d:'Cheque cobrado'})});return out}
function cajaDia(day){const ms=cajaMovs();const ini=sum(ms.filter(m=>dkey(m.f)<day),m=>m.m);const hoy=ms.filter(m=>dkey(m.f)===day);return{ini,ent:sum(hoy.filter(m=>m.m>0),m=>m.m),sal:sum(hoy.filter(m=>m.m<0),m=>-m.m),queda:ini+sum(hoy,m=>m.m),hoy}}
V.gastos=()=>{const day=S.gday;const head=`${backBtn()}<div class="mh hd1"><div><h1>Finanzas</h1><p class="mute">Gastos, caja y utilidad neta</p></div>${S.gtab==='dia'?`<div class="acts"><button class="ib" data-act="gday" data-id="-1" aria-label="Día anterior">${ic('back')}</button><input type="date" id="gdayIn" value="${esc(day)}" style="width:auto"><button class="ib" data-act="gday" data-id="1" aria-label="Día siguiente" ${day>=today()?'disabled':''}>${ic('chev')}</button></div>`:''}</div>${grp('gtab',S.gtab,[['Caja','wallet',[['dia','Caja del día'],['cierres','Cierres']]],['Gastos y ganancia','chart',[['gastos','Gastos'],['util','Utilidad neta']]],['Banco','bank',[['bancos','Cuentas'],['cheques','Cheques']]]])}`;
 if(GT[S.gtab])return head+GT[S.gtab]();
 if(S.gtab==='gastos'){const r=rango(S.rper);const gs=D('gastos').filter(g=>inR(g.fecha,r));const by={};gs.forEach(g=>add(by,g.cat||'Otros',N(g.monto)));return head+perSel('rper',S.rper)+rangoInputs()+`<div class="k4"><div class="kpi"><small>Total gastos</small><b class="r">${money(sum(gs,g=>g.monto))}</b></div>${top(by,6).map(([k,v])=>`<div class="kpi"><small>${esc(k)}</small><b>${money(v)}</b></div>`).join('')}</div><button class="btn p" data-act="newGasto" style="margin-bottom:12px">${ic('plus')} Anotar gasto</button>${gs.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Pago</th><th class="n">Monto</th><th></th></tr></thead><tbody>${gs.map(g=>`<tr><td>${fday(g.fecha)}</td><td>${esc(g.concepto)}</td><td>${esc(g.cat||'')}</td><td>${esc(g.metodo||'')}</td><td class="n neg"><b>${money(g.monto)}</b></td><td><button class="ib" data-act="delGasto" data-id="${esc(g.id)}" aria-label="Borrar">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="mute">No hay gastos en este período.</p>'}`}
 if(S.gtab==='util'){const r=rango(S.rper);const vs=ventasR();const ing=sum(vs,vtot);const costo=sum(vs,v=>sum(v.items||[],i=>N(i.costo)*N(i.cant)));const dv=sum(D('devoluciones').filter(d=>!d.anulada&&!d.cambio&&inR(d.fecha,r)),d=>d.total);const gs=sum(D('gastos').filter(g=>inR(g.fecha,r)),g=>g.monto);const neto=ing-dv-costo-gs;
  return head+perSel('rper',S.rper)+rangoInputs()+`<div class="panel"><div class="rows"><div><span>+ Ventas</span><b>${money(ing)}</b></div><div><span>− Devoluciones</span><b class="neg">${money(dv)}</b></div><div><span>− Costo de la mercadería vendida</span><b class="neg">${money(costo)}</b></div><div><span>− Gastos</span><b class="neg">${money(gs)}</b></div><div><b class="tt">= Utilidad neta</b><b class="bigt ${neto<0?'neg':'okc'}">${money(neto)}</b></div></div>${costo?'':'<p class="mute small">Para que sea exacta, cargá el costo de cada producto.</p>'}</div>`}
 const vs=D('ventas').filter(v=>!v.anulada&&dkey(v.fecha)===day);const ing=sum(vs,vtot);const gs=D('gastos').filter(g=>dkey(g.fecha)===day);const gt=sum(gs,g=>g.monto);const cj=cajaDia(day);
 return head+`<h3 style="margin-bottom:10px">${day===today()?'Hoy — ':''}${new Date(day+'T12:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="k4"><div class="kpi"><small>Ventas del día</small><b class="b">${money(ing)}</b></div><div class="kpi"><small>Gastos del día</small><b class="r">${money(gt)}</b></div><div class="kpi"><small>Neto del día</small><b class="${ing-gt<0?'r':'g'}">${money(ing-gt)}</b></div></div>
 <div class="cols2"><div class="panel"><h3>Resumen del día</h3><div class="rows"><div><span>+ Ventas</span><span>${money(ing)}</span></div><div><span>− Gastos pagados</span><span class="neg">${money(gt)}</span></div><div><b>= Neto del día</b><b>${money(ing-gt)}</b></div></div></div>
 <div class="panel"><div class="mh"><h3>${ic('cash')} Efectivo en caja</h3><div class="acts"><button class="btn s" data-act="cajaMov" data-id="Ingreso">Ingresar efectivo</button><button class="btn s" data-act="cajaMov" data-id="Retiro">Retirar de caja</button>${day===today()?`<button class="btn s p" data-act="cerrarCaja">${ic('lock')} Cerrar caja</button>`:''}</div></div><div class="rows"><div><span>Efectivo inicial</span><span>${money(cj.ini)}</span></div><div><span>+ Entró en efectivo</span><span>${money(cj.ent)}</span></div><div><span>− Salió en efectivo</span><span class="neg">${money(cj.sal)}</span></div><div><b class="tt">= Queda en caja</b><b class="bigt okc">${money(cj.queda)}</b></div></div>${cj.hoy.length?`<details><summary class="lnk">Ver movimientos</summary><div class="rows">${cj.hoy.map(m=>`<div><span>${fhora(m.f)} · ${esc(m.d)}</span><b class="${m.m<0?'neg':''}">${money(m.m)}</b></div>`).join('')}</div></details>`:''}</div></div>
 ${medioTabla(day)}<button class="btn p" data-act="newGasto" style="margin:14px 0">${ic('plus')} Anotar gasto de este día</button>${gs.length?`<div class="rows panel">${gs.map(g=>`<div><span>${esc(g.concepto)} <span class="mute small">${esc(g.cat||'')} · ${esc(g.metodo||'')}</span></span><span><b class="neg">${money(g.monto)}</b> <button class="lnk" data-act="delGasto" data-id="${esc(g.id)}">borrar</button></span></div>`).join('')}</div>`:''}`};
ACT.gday=d=>{const t=new Date(S.gday+'T12:00');t.setDate(t.getDate()+(+d));const k=dkey(t);if(k<=today()){S.gday=k;render(true)}};
ACT.newGasto=()=>{const c=C();open(`<div class="mh"><h2>Anotar gasto</h2>${xBtn}</div><div class="f2"><label class="fl full">Concepto<input id="gC" placeholder="Ej: Luz, flete, taller" autofocus></label><label class="fl">Monto<input id="gM" inputmode="numeric" placeholder="0"></label><label class="fl">Categoría<select id="gCat">${c.gcats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="fl">Cómo se pagó<select id="gMet">${Object.keys(c.metodos).map(m=>`<option>${m}</option>`).join('')}</select></label><label class="fl">Cuenta (si fue transferencia)<select id="gCta"><option value="">—</option>${c.cuentas.map(q=>`<option>${esc(q.nombre)}</option>`).join('')}</select></label><label class="fl">Fecha<input id="gF" type="date" value="${S.tab==='gastos'&&S.gtab==='dia'?S.gday:today()}"></label></div><div class="acts"><button class="btn p" data-act="saveGasto" data-enter>Guardar</button></div>`)};
ACT.saveGasto=async()=>{const m=num($('#gM').value);const con=$('#gC').value.trim();if(!con||!m)return toast('Poné concepto y monto');const f=$('#gF').value||today();const fecha=f===today()?new Date().toISOString():new Date(f+'T12:00').toISOString();
 if(await guard(()=>put('gastos',uid(),{fecha,concepto:con,monto:m,cat:$('#gCat').value,metodo:$('#gMet').value,cuenta:$('#gMet').value==='Transferencia'?$('#gCta').value:'',vendedor:vendedor()}))){close();toast('Gasto anotado')}};
ACT.delGasto=id=>ask('¿Borrar este gasto?','','Borrar',async()=>{if(await guard(()=>rm('gastos',id)))toast('Gasto borrado')});
ACT.cajaMov=t=>open(`<div class="mh"><h2>${t==='Ingreso'?'Ingresar efectivo':'Retirar de caja'}</h2>${xBtn}</div><div class="f2"><label class="fl">Monto<input id="cjM" inputmode="numeric" autofocus></label><label class="fl">Motivo<input id="cjN" placeholder="${t==='Ingreso'?'Ej: cambio inicial':'Ej: retiro para depósito'}"></label></div><div class="acts"><button class="btn p" data-act="saveCaja" data-id="${t}" data-enter>Guardar</button></div>`);
ACT.saveCaja=async t=>{const m=num($('#cjM').value);if(!m)return toast('Poné el monto');if(await guard(()=>put('caja',uid(),{fecha:new Date().toISOString(),tipo:t,monto:m,nota:$('#cjN').value.trim(),vendedor:vendedor()}))){close();toast(t==='Ingreso'?'Efectivo ingresado':'Retiro anotado')}};

 <div class="panel"><h3>Impuesto</h3><label class="swt"><input type="checkbox" id="cImpOn" ${c.impuesto.on?'checked':''}> Sumar impuesto en cada venta</label><label class="fl">Porcentaje<input id="cImpP" inputmode="decimal" value="${N(c.impuesto.pct)}"></label><h3>Talles rápidos</h3><p class="mute small">Aparecen como botones al cargar un producto.</p>${rowsF('pre',c.presets,['Nombre','Talles'])}<h3 style="margin-top:10px">Modelos y su código</h3><p class="mute small">El código arma el código del producto (BER1, BER2…).</p>${rowsF('mod',c.modelos,['Código','Nombre'])}</div></div><button class="btn p big" data-act="saveCfg" data-id="general" style="margin-top:14px">Guardar cambios</button>`;
 if(S.ctab==='cobros')body=`<h3 style="margin-bottom:8px">Métodos de pago: recargos o descuentos</h3><div class="cols2">${Object.entries(c.metodos).map(([k,m])=>`<div class="panel"><div class="mh"><b>${k}</b><label class="swt"><input type="checkbox" data-mon="${k}" ${m.on?'checked':''}> Activo</label></div><label class="fl">Ajuste de precio<select data-maj="${k}">${[['ninguno','Ninguno'],['recargo','Recargo'],['descuento','Descuento']].map(([v,t])=>`<option value="${v}" ${m.aj===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="fl">Porcentaje<input data-mpct="${k}" inputmode="decimal" value="${N(m.pct)}"></label></div>`).join('')}<div class="panel"><b>Cobro en dólares</b><label class="swt"><input type="checkbox" id="cUsd" ${c.usd.on?'checked':''}> Al cobrar en efectivo se puede recibir dólares (el vuelto se da en pesos)</label><label class="fl">Cotización: 1 USD =<input id="cUsdC" inputmode="numeric" value="${N(c.usd.cot)}"></label></div></div>
 <div class="panel" style="margin-top:14px"><div class="mh"><div><h3>Cuentas para transferencias</h3><p class="mute small">Al cobrar por transferencia elegís a cuál entró la plata, y el reporte la separa por cuenta.</p></div><button class="btn s" data-act="cuentaEdit">${ic('plus')} Nueva</button></div><div class="rows">${c.cuentas.map((q,i)=>`<div><span><b>${esc(q.nombre)}</b><br><span class="mute small">${esc([q.banco,q.titular,q.alias].filter(Boolean).join(' · '))}</span></span><span class="acts"><button class="sw ${q.activa!==false?'on':''}" data-act="cuentaToggle" data-id="${i}"><i></i>${q.activa!==false?'Activa':'Inactiva'}</button><button class="ib" data-act="cuentaEdit" data-id="${i}" aria-label="Editar">${ic('pencil')}</button><button class="ib" data-act="cuentaDel" data-id="${i}" aria-label="Borrar">${ic('trash')}</button></span></div>`).join('')||'<p class="mute">Todavía no cargaste cuentas.</p>'}</div></div>
 <div class="panel" style="margin-top:14px"><h3>Métodos de transporte</h3><p class="mute small">Costo fijo opcional, se suma al total de la venta.</p>${rowsF('tr',c.transportes,['Transporte','Costo'])}</div><button class="btn p big" data-act="saveCfg" data-id="cobros" style="margin-top:14px">Guardar cambios</button>`;
 if(S.ctab==='tickets'){setTimeout(tkPrev,30);body=`<div class="cols2"><div class="panel" id="tkForm"><h3>Ticket</h3>
 <div class="f2"><label class="fl">Papel<select id="tAn"><option value="58" ${T.ancho==='58'?'selected':''}>Ticketera 58 mm</option><option value="80" ${T.ancho==='80'?'selected':''}>Ticketera 80 mm</option><option value="A4" ${T.ancho==='A4'?'selected':''}>Hoja A4 / PDF</option></select></label><label class="fl">Tamaño de letra<select id="tLetra">${[['chica','Chica'],['normal','Normal'],['grande','Grande']].map(([v,l])=>`<option value="${v}" ${T.letra===v?'selected':''}>${l}</option>`).join('')}</select></label></div>

 ${rows.map(r=>`<div class="tkb">${esc(r.n)}</div>${r.v&&T.agrupar==='modelo'?r.v.map(x=>`<div>&nbsp;${esc(x)}</div>`).join(''):''}${R('&nbsp;'+r.q+(T.mPu!==false?' x '+money(r.p):' u.'),money(r.q*r.p))}`).join('')}<div class="tkl"></div>${T.mPrendas!==false?R('Prendas',N(v.unidades)):''}
 ${N(v.impuesto)||N(v.descuento)||N(v.credito)||N(v.envio)||N(v.ajuste)?R('Subtotal',money(v.subtotal)):''}${N(v.impuesto)?R('Impuesto',money(v.impuesto)):''}${N(v.descuento)?R('Descuento','-'+money(v.descuento)):''}${N(v.credito)?R('A favor','-'+money(v.credito)):''}${N(v.envio)?R('Envío',money(v.envio)):''}${N(v.ajuste)?R((N(v.ajuste)>0?'Recargo':'Descuento')+' '+esc(v.pago),money(v.ajuste)):''}

function parseCSV(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':(first.includes('\t')?'\t':',');const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
 if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
async function importar(file){const msg=t=>{const m=$('#impMsg');if(m)m.textContent=t};const rows=parseCSV(await file.text());if(rows.length<2)return toast('El archivo está vacío');
 const h=rows[0].map(x=>x.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));const ix=(...ks)=>h.findIndex(x=>ks.includes(x));const iN=ix('nombre','producto','descripcion');if(iN<0)return toast('Falta la columna "nombre"');
 const iC=ix('codigo','cod','sku'),iP=[ix('precio','precio 1','p1'),ix('precio2','precio 2','p2'),ix('precio3','precio 3','p3'),ix('precio4','precio 4','p4')],iCo=ix('costo'),iT=ix('talles'),iCol=ix('colores','color'),iL=ix('linea'),iS=ix('stock','stock total');
 let nuevos=0,act=0;const body=rows.slice(1,2001);
 for(let r=0;r<body.length;r++){const row=body[r];const v=i=>i<0?'':String(row[i]??'').trim();const nombre=v(iN);if(!nombre)continue;const codigo=v(iC).toUpperCase();
  const ex=D('articulos').find(a=>(codigo&&String(a.codigo).toUpperCase()===codigo)||(!codigo&&ckey(a.nombre)===ckey(nombre)));const f={nombre};if(codigo)f.codigo=codigo;
  const pr=iP.map(i=>num(v(i)));if(pr.some(Boolean)){f.precios=pr;f.precio=pr[0]}if(v(iCo))f.costo=num(v(iCo));if(v(iT))f.talles=v(iT).split(/[\s/,|]+/).filter(Boolean);if(v(iCol))f.colores=v(iCol).toUpperCase().split(/[\s/,|]+/).filter(Boolean);if(v(iL))f.linea=/teen/i.test(v(iL))?'Teens':/kid/i.test(v(iL))?'Kids':v(iL);
  msg(`Cargando ${r+1} de ${body.length}…`);
  if(ex){if(await guard(()=>upd('articulos',ex.id,f)))act++}
  else{const st={};if(iS>=0&&v(iS)!==''){const ts=f.talles||['U'];st[vk(ts[0],(f.colores||[])[0]||'')]=sint(v(iS))}if(await guard(()=>put('articulos',uid(),{precios:[0,0,0,0],precio:0,talles:['U'],colores:[],stock:st,foto:'',activo:true,creado:new Date().toISOString(),...f})))nuevos++}}
 msg(`Listo: ${nuevos} productos nuevos y ${act} actualizados.`);toast('Importación terminada')}
async function procesarFoto(file){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
 const mx=assets?900:760,k=Math.min(1,mx/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
 if(assets){try{const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));const a=await assets.upload(blob);if(a?.id)return 'a:'+a.id}catch(e){}}
 return cv.toDataURL('image/jpeg',.76)}finally{URL.revokeObjectURL(url)}}

document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.id==='q'){const m=findCode(t.value);if(m){e.preventDefault();e.stopImmediatePropagation();const ex=S.cart.find(x=>x.id===m.a.id&&x.t===m.t&&x.c===m.c);ex?ex.cant++:S.cart.push({id:m.a.id,t:m.t,c:m.c,cant:1});S.q='';t.value='';refreshCart();t.focus();toast(`+1 ${m.a.nombre} ${vname(m.t,m.c)}`)}}
 else if(t.id==='sq'){const m=findCode(t.value);if(m){e.preventDefault();e.stopImmediatePropagation();ACT.ingreso(m.a.id);setTimeout(()=>{const i=box.querySelector(`.vg input[data-t="${CSS.escape(m.t)}"][data-c="${CSS.escape(m.c)}"]`);if(i){i.value=1;i.focus();i.select()}},60)}}},true);
ACT.etiquetas=id=>{const l=id?[art(id)].filter(Boolean):D('articulos').filter(a=>a.activo!==false);S.cartOpen=false;LBL={ids:l.map(a=>a.id)};
 open(`<div class="mh"><h2>${ic('barcode')} Etiquetas con código de barras</h2>${xBtn}</div><p class="mute small">Cada talle y color tiene su código. Con un lector de códigos, en Ventas escaneás y se suma solo al carrito. Si la prenda ya trae un código de fábrica, escanealo en la casilla "Código" para usar ese.</p>
 <div class="f2"><label class="fl">Formato<select id="lbF"><option value="a4">Hoja A4 (3 por fila)</option><option value="rollo">Rollo de etiquetas 50 × 25 mm</option></select></label><label class="fl">Precio en la etiqueta<select id="lbP"><option value="-1">Sin precio</option>${C().listas.map((x,i)=>`<option value="${i}" ${i===0?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div>
 <div class="tw" style="max-height:50vh"><table class="t"><thead><tr><th>Producto</th><th>Talle / color</th><th>Código</th><th class="n">Cantidad</th></tr></thead><tbody>${l.flatMap(a=>variantes(a).map(({t,c})=>`<tr><td>${esc(a.nombre)}</td><td>${esc(vname(t,c))}</td><td><input data-bcode="${esc(a.id)}|${esc(vk(t,c))}" value="${esc(codeOf(a,t,c))}" style="min-width:150px"></td><td class="n"><input data-bq="${esc(a.id)}|${esc(vk(t,c))}" inputmode="numeric" value="${Math.max(0,svAll(a,t,c))}" style="width:80px;text-align:right"></td></tr>`)).join('')}</tbody></table></div>
 <div class="acts"><button class="btn" data-act="lbSave">Guardar códigos</button>${PRINT?`<button class="btn p" data-act="lbPrint">${ic('printer')} Imprimir etiquetas</button>`:'<span class="mute small">Para imprimir usá la versión de la compu.</span>'}</div>`,true)};
let LBL=null;
ACT.lbSave=async(x,b,silent)=>{const by={};box.querySelectorAll('[data-bcode]').forEach(i=>{const [id,k]=i.dataset.bcode.split(/\|(.+)/);const a=art(id);if(!a)return;const [t,c]=k.split('|');const v=i.value.trim().toUpperCase();if(v&&v!==autoCode(a,t,c||'')){(by[id]??={})[k]=v}else if(a.barras?.[k]){(by[id]??={})[k]=''}});
 for(const [id,m] of Object.entries(by)){const a=art(id);const bar={...(a.barras||{})};for(const [k,v] of Object.entries(m)){if(v)bar[k]=v;else delete bar[k]}await guard(()=>upd('articulos',id,{barras:bar}))}if(silent!==true)toast('Códigos guardados')};
ACT.lbPrint=async()=>{await ACT.lbSave(0,0,true);const f=$('#lbF').value,pl=+$('#lbP').value;const items=[];box.querySelectorAll('[data-bq]').forEach(i=>{const q=int(i.value);if(!q)return;const [id,k]=i.dataset.bq.split(/\|(.+)/);const a=art(id);const [t,c]=k.split('|');for(let n=0;n<Math.min(q,500);n++)items.push({a,t,c:c||''})});if(!items.length)return toast('Poné al menos una cantidad');
 const lab=({a,t,c})=>{const code=codeOf(a,t,c);return `<div class="lb"><b>${esc(a.nombre)}</b><span>${esc(vname(t,c))}${pl>=0?' · '+money(precioDe(a,pl)):''}</span>${code128svg(code)}<small>${esc(code)}</small></div>`};
 close();const el=$('#ticket');el.className=f==='rollo'?'lbRollo':'lbA4';el.innerHTML=items.map(lab).join('');$('#pagest').textContent=f==='rollo'?'@page{size:50mm 25mm;margin:0}':'@page{size:A4;margin:8mm}';setTimeout(()=>{try{window.print()}catch(e){}},80)};

 open(`<div class="mh"><h2>Lista de precios</h2>${xBtn}</div><div class="f2"><label class="fl">Lista<select id="lpL">${c.listas.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select></label><label class="fl">Categoría<select id="lpC"><option value="">Todas</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="swt"><input type="checkbox" id="lpS" checked> Solo productos con stock</label><label class="swt"><input type="checkbox" id="lpT" checked> Mostrar talles y colores</label>${PRINT?'<label class="swt"><input type="checkbox" id="lpF"> Con fotos</label>':''}</div><div class="acts">${PRINT?`<button class="btn p" data-act="lpGo" data-id="print">${ic('printer')} Imprimir / PDF</button>`:''}<button class="btn" data-act="lpGo" data-id="csv">${ic('file')} Excel</button><button class="btn" data-act="lpGo" data-id="wa">Copiar para WhatsApp</button></div>`)};
ACT.lpGo=k=>{const l=+$('#lpL').value,cat=$('#lpC').value,soloS=$('#lpS').checked,tc=$('#lpT').checked,fot=!!$('#lpF')?.checked;const c=C();
 const ls=D('articulos').filter(a=>a.activo!==false&&(!cat||a.categoria===cat)&&(!soloS||stockTot(a)>0)).sort((a,b)=>ncmp(a.categoria||'',b.categoria||'')||ncmp(a.nombre,b.nombre));
 const tcs=a=>{const ts=talles(a).filter(t=>!soloS||sum(colores(a).length?colores(a):[''],cc=>svAll(a,t,cc))>0);return 'T'+ts.join(' ')+(colores(a).length?' · '+colores(a).join(', '):'')};
 if(k==='csv')return bajar(`lista-precios-${c.listas[l]}-${today()}.csv`,csv([['codigo','producto','categoria',c.listas[l],'talles y colores'],...ls.map(a=>[a.codigo,a.nombre,a.categoria||'',precioDe(a,l),tcs(a)])]));
 if(k==='wa')return copiar([`*${c.negocio} — Lista de precios ${c.listas[l]} · ${fday(new Date())}*`,'',...ls.map(a=>`• ${a.nombre}: ${money(precioDe(a,l))}${tc?' ('+tcs(a)+')':''}`),'','Compra mínima: una curva de talles.'].join('\n'),'Lista copiada');
 close();const el=$('#ticket');el.className='lpA4';el.innerHTML=`<div class="lp"><div class="lph">${c.ticket.logo?`<img src="${LOGO}" alt="">`:''}<div><b>${esc(c.negocio)} — Lista de precios ${esc(c.listas[l])}</b><br>${esc(fday(new Date()))} · ${esc(c.ticket.encabezado||'')} · WhatsApp ${esc(c.ticket.tel||'')}</div></div><table><thead><tr>${fot?'<th></th>':''}<th>Código</th><th>Producto</th>${tc?'<th>Talles y colores</th>':''}<th>Precio</th></tr></thead><tbody>${ls.map(a=>`<tr>${fot?`<td>${imgSrc(a.foto)?`<img src="${esc(imgSrc(a.foto))}">`:''}</td>`:''}<td>${esc(a.codigo||'')}</td><td>${esc(a.nombre)}${a.categoria?`<br><small>${esc(a.categoria)}</small>`:''}</td>${tc?`<td>${esc(tcs(a))}</td>`:''}<td class="n">${money(precioDe(a,l))}</td></tr>`).join('')}</tbody></table><p>Precios sujetos a cambio. Compra mínima: una curva de talles.</p></div>`;$('#pagest').textContent='@page{size:A4;margin:12mm}';setTimeout(()=>{try{window.print()}catch(e){}},120)};

ACT.presupuesto=async()=>{if(!S.cart.length)return toast('El carrito está vacío');const t=calc();const items=t.ls.map(({it,a})=>({art:a.id,codigo:a.codigo||'',nombre:a.nombre,linea:a.linea||'',t:it.t,c:it.c,cant:it.cant,precio:lineaPrecio(it,a)}));const nro=nextNro('presupuestos');
 const p={nro,fecha:new Date().toISOString(),cliente:S.cli.trim(),items,total:t.sub,unidades:t.u,lista:C().listas[S.lista],vendedor:vendedor()};const id=uid();
 if(await guard(()=>put('presupuestos',id,p))){S.cart=[];S.cli='';refreshCart();if(S.cartOpen)close();presuDone({...p,id})}};
function presuTxt(p){return [`*${C().negocio}* — Presupuesto N° ${pad5(p.nro)} · ${fday(p.fecha)}`,p.cliente?`Para: ${p.cliente}`:'','',...Object.entries((p.items||[]).reduce((o,i)=>{(o[i.nombre+'|'+i.precio]??=[]).push(i);return o},{})).map(([k,l])=>`${l[0].nombre}: ${l.map(i=>vname(i.t,i.c)+'×'+i.cant).join(', ')} → ${money(sum(l,i=>i.cant*i.precio))}`),'',`*Total: ${money(p.total)}*`,'Válido por 7 días. Precios sujetos a cambio.'].filter((l,i,a)=>l!==''||a[i-1]!=='').join('\n')}
function presuDone(p){const cl=cliente(p.cliente);const wa=cl?.tel?waLink(cl.tel,presuTxt(p)):'';open(`<h2>Presupuesto N° ${pad5(p.nro)} guardado</h2><p>${money(p.total)} · ${N(p.unidades)} prendas · no se descontó stock.</p><div class="acts">${PRINT?`<button class="btn p" data-act="printPresu" data-id="${esc(p.id)}" data-enter>${ic('printer')} Imprimir</button>`:''}<button class="btn p" data-act="presuPdf" data-id="${esc(p.id)}">${ic('wa')} Enviar PDF por WhatsApp</button>${wa?`<a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} Texto por WhatsApp</a>`:''}<button class="btn" data-act="copyPresu" data-id="${esc(p.id)}">Copiar</button><button class="btn" data-act="close">Listo</button></div>`)}
const presu=id=>D('presupuestos').find(x=>x.id===id);
ACT.presuPdf=id=>enviarPresuPdf(id);
ACT.copyPresu=id=>{const p=presu(id);if(p)copiar(presuTxt(p),'Presupuesto copiado')};
ACT.printPresu=id=>{const p=presu(id);if(!p)return;close();printHtml(ticketHtml({...p,pago:'',subtotal:p.total},'Presupuesto').replace('Documento no válido como factura','Presupuesto válido por 7 días · No válido como factura'))};
ACT.presuAVenta=id=>{const p=presu(id);if(!p)return;S.cart=(p.items||[]).filter(i=>art(i.art)).map(i=>({id:i.art,t:i.t,c:i.c,cant:N(i.cant),px:N(i.precio)}));S.cli=p.cliente||'';ACT.tab('vender');render(true);toast('Presupuesto en el carrito')};

function presuView(){const l=D('presupuestos');return l.length?`<div class="list">${l.map(p=>`<div class="pcard"><div class="mh"><div><b class="pname">N° ${pad5(p.nro)} · ${esc(p.cliente||'Sin cliente')}</b><div class="mute small">${fdate(p.fecha)} · ${N(p.unidades)} prendas · ${esc(p.lista||'')}</div></div><b class="price">${money(p.total)}</b></div><div class="small">${grupoTxt(p.items)}</div><div class="acts"><button class="btn s p" data-act="presuAVenta" data-id="${esc(p.id)}">Pasar a venta</button><button class="btn s" data-act="presuPdf" data-id="${esc(p.id)}">${ic('wa')} PDF</button><button class="btn s" data-act="copyPresu" data-id="${esc(p.id)}">Copiar</button>${PRINT?`<button class="btn s" data-act="printPresu" data-id="${esc(p.id)}">${ic('printer')}</button>`:''}<button class="ib" data-act="delPresu" data-id="${esc(p.id)}" aria-label="Borrar">${ic('trash')}</button></div></div>`).join('')}</div>`:'<div class="empty">No hay presupuestos. Armalos desde el carrito de Ventas con el botón "Presupuesto".</div>'}

/* ---- compras y proveedores ---- */
function saldoProv(nombre){const k=ckey(nombre);let s=0;D('compras').forEach(c=>{if(ckey(c.proveedor)!==k||c.anulada)return;s+=c.tipo==='Nota de crédito'?-N(c.total):N(c.total)});D('caja').forEach(c=>{if(c.tipo==='Pago proveedor'&&ckey(c.proveedor)===k&&!c.anulado)s-=N(c.monto)});return s}
V.compras=()=>{const t=S.ctab2||'comp';const head=`${backBtn()}<div class="mh hd1"><div><h1>Compras</h1><p class="mute">Taller, telas, avíos y proveedores</p></div><div class="acts"><button class="btn p" data-act="newCompra" data-id="Factura">${ic('plus')} Nueva compra</button><button class="btn" data-act="newPago">${ic('cash')} Nuevo pago</button><button class="btn s" data-act="newCompra" data-id="Nota de crédito">Nota de crédito</button><button class="btn s" data-act="newCompra" data-id="Nota de débito">Nota de débito</button></div></div>${sub('ctab2',t,[['comp','Comprobantes'],['prov','Proveedores'],['saldos','Saldos'],['pagos','Pagos']])}`;
 if(t==='prov'){const l=D('proveedores');return head+`<button class="btn p" data-act="editProv" style="margin-bottom:12px">${ic('plus')} Nuevo proveedor</button>`+(l.length?`<div class="list">${l.map(p=>`<div class="pcard"><div class="mh"><div><b class="pname">${esc(p.nombre)}</b><div class="mute small">${[p.rubro,p.cuit?'CUIT '+p.cuit:'',p.tel].filter(Boolean).map(esc).join(' · ')}</div></div><div class="acts"><span class="chip ${saldoProv(p.nombre)>0?'out':''}">Le debés ${money(Math.max(0,saldoProv(p.nombre)))}</span><button class="ib" data-act="editProv" data-id="${esc(p.id)}" aria-label="Editar">${ic('pencil')}</button></div></div></div>`).join('')}</div>`:'<div class="empty">Todavía no cargaste proveedores (talleres, telas, avíos…).</div>')}
 if(t==='saldos'){const l=D('proveedores').map(p=>({p,s:saldoProv(p.nombre)})).sort((a,b)=>b.s-a.s);return head+`<div class="k4"><div class="kpi"><small>Total que debés a proveedores</small><b class="r">${money(sum(l,x=>Math.max(0,x.s)))}</b></div></div><div class="tw"><table class="t"><thead><tr><th>Proveedor</th><th class="n">Saldo</th><th></th></tr></thead><tbody>${l.map(({p,s})=>`<tr><td><b>${esc(p.nombre)}</b></td><td class="n ${s>0?'neg':'okc'}"><b>${s>0?'Debés '+money(s):s<0?'A favor '+money(-s):money(0)}</b></td><td><button class="btn s" data-act="newPago" data-id="${esc(p.nombre)}">Pagar</button></td></tr>`).join('')||'<tr><td class="mute" colspan="3">Sin proveedores.</td></tr>'}</tbody></table></div>`}
 if(t==='pagos'){const l=D('caja').filter(c=>c.tipo==='Pago proveedor');return head+(l.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Proveedor</th><th>Cómo</th><th class="n">Monto</th><th></th></tr></thead><tbody>${l.map(c=>`<tr class="${c.anulado?'off':''}"><td>${fdate(c.fecha)}</td><td>${esc(c.proveedor)}</td><td>${esc(c.metodo)}${c.cuenta?' · '+esc(c.cuenta):''}${c.anulado?' · anulado':''}</td><td class="n"><b>${money(c.monto)}</b></td><td>${c.anulado?'':`<button class="ib" data-act="anularPago" data-id="${esc(c.id)}" aria-label="Anular">${ic('trash')}</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mute">No hay pagos.</p>')}
 const l=D('compras');return head+(l.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Proveedor</th><th>N°</th><th class="n">Prendas</th><th class="n">Total</th><th></th></tr></thead><tbody>${l.map(c=>`<tr class="${c.anulada?'off':''}"><td>${fday(c.fecha)}</td><td>${esc(c.tipo)}${c.anulada?'<div class="neg small">Anulada</div>':''}</td><td>${esc(c.proveedor)}</td><td>${esc(c.numero||pad5(c.nro))}</td><td class="n">${N(c.unidades)||''}</td><td class="n"><b>${c.tipo==='Nota de crédito'?'−':''}${money(c.total)}</b></td><td><div class="acts" style="flex-wrap:nowrap"><button class="ib" data-act="verCompra" data-id="${esc(c.id)}" title="Ver">${ic('receipt')}</button>${c.anulada?'':`<button class="ib" data-act="anularCompra" data-id="${esc(c.id)}" title="Anular">${ic('trash')}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${ic('truck')}<p>Todavía no cargaste compras. Cuando entra mercadería del taller, cargala acá: suma al stock y queda lo que le debés.</p></div>`)};
ACT.editProv=id=>{const p=D('proveedores').find(x=>x.id===id)||{};open(`<div class="mh"><h2>${id?'Editar proveedor':'Nuevo proveedor'}</h2>${xBtn}</div><div class="f2"><label class="fl full">Nombre *<input id="vN" value="${esc(p.nombre||'')}" autofocus></label><label class="fl">Rubro<input id="vR" value="${esc(p.rubro||'')}" placeholder="Taller, telas, avíos…"></label><label class="fl">WhatsApp<input id="vT" value="${esc(p.tel||'')}"></label><label class="fl">CUIT<input id="vC" value="${esc(p.cuit||'')}"></label><label class="fl">Alias / CBU<input id="vA" value="${esc(p.alias||'')}"></label><label class="fl full">Nota<input id="vO" value="${esc(p.nota||'')}"></label></div><div class="acts"><button class="btn p" data-act="saveProv" data-id="${esc(id)}" data-enter>Guardar</button>${id?`<button class="btn d" data-act="delProv" data-id="${esc(id)}">Borrar</button>`:''}</div>`)};

 ${CMP.tipo==='Nota de débito'||(CMP.tipo==='Nota de crédito'&&!CMP.items.length)?`<label class="fl">Monto<input id="kM" inputmode="numeric" value="${esc(CMP.monto)}"></label>`:''}

 <div class="rows"><div><b class="tt">Total</b><b class="bigt">${money(tot)}</b></div></div><div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn p big" data-act="saveCompra" style="flex:1">Guardar</button></div>`,true)}

 const nro=nextNro('compras');const fecha=CMP.fecha===today()?new Date().toISOString():new Date(CMP.fecha+'T12:00').toISOString();const d={nro,fecha,tipo:CMP.tipo,proveedor:CMP.proveedor,numero:CMP.numero,items:CMP.items,total:tot,unidades:sum(CMP.items,i=>i.cant),nota:CMP.nota,dep:CMP.dep||depMain(),vendedor:vendedor(),anulada:false};

/* ---- cuentas bancarias ---- */
function movsCuenta(nombre){const k=ckey(nombre);const out=[];const m=(f,d,v)=>out.push({f,d,m:v});
 D('ventas').forEach(v=>{if(!v.anulada&&v.pago==='Transferencia'&&ckey(v.cuenta)===k)m(v.fecha,'Venta N° '+pad5(v.nro),N(v.total))});
 D('caja').forEach(c=>{if(c.anulado)return;if(ckey(c.cuenta)!==k)return;if(c.tipo==='Cobro cuenta')m(c.fecha,'Pago de '+c.cliente,N(c.monto));if(c.tipo==='Pago proveedor')m(c.fecha,'Pago a '+c.proveedor,-N(c.monto));if(c.tipo==='Banco')m(c.fecha,c.nota||'Movimiento',N(c.monto))});
 D('gastos').forEach(g=>{if(g.metodo==='Transferencia'&&ckey(g.cuenta)===k)m(g.fecha,'Gasto: '+g.concepto,-N(g.monto))});
 D('cheques').forEach(q=>{if(q.estado==='Depositado'&&ckey(q.cuenta)===k)m(q.fechaEstado||q.fecha,'Cheque '+(q.banco||'')+' '+(q.numero||''),N(q.importe))});
 D('devoluciones').forEach(d=>{if(!d.anulada&&d.por==='Transferencia'&&ckey(d.cuenta)===k)m(d.fecha,'Devolución N° '+pad5(d.nro),-N(d.total))});
 return out.sort((a,b)=>String(b.f).localeCompare(String(a.f)))}
function bancosView(){const cs=C().cuentas;if(!cs.length)return `<div class="empty">${ic('bank')}<p>Cargá tus cuentas (Mercado Pago, bancos) en Configuración › Cobros y envíos.</p><button class="btn p" data-act="tab" data-id="config">Ir a Configuración</button></div>`;const sel=S.banco&&cs.some(c=>c.nombre===S.banco)?S.banco:cs[0].nombre;
 const sal=c=>N(c.inicial)+sum(movsCuenta(c.nombre),x=>x.m);const ms=movsCuenta(sel);
 return `<div class="k4">${cs.map(c=>`<button class="kpi" style="text-align:left;cursor:pointer;border:${c.nombre===sel?'2px solid var(--r)':'0'}" data-act="per" data-k="banco" data-id="${esc(c.nombre)}"><small>${esc(c.nombre)}</small><b>${money(sal(c))}</b></button>`).join('')}</div><div class="mh" style="margin-bottom:10px"><h3>Movimientos de ${esc(sel)}</h3><button class="btn s" data-act="bancoMov" data-id="${esc(sel)}">${ic('plus')} Movimiento manual</button></div>${ms.length?`<div class="panel rows">${ms.slice(0,200).map(x=>`<div><span>${fday(x.f)} · ${esc(x.d)}</span><b class="${x.m<0?'neg':'okc'}">${money(x.m)}</b></div>`).join('')}</div>`:'<p class="mute">Sin movimientos.</p>'}<p class="mute small">El saldo arranca en el "saldo inicial" de la cuenta (Configuración) y suma ventas por transferencia, pagos de clientes y cheques depositados; resta pagos a proveedores y gastos por transferencia.</p>`}
ACT.bancoMov=n=>open(`<div class="mh"><h2>Movimiento en ${esc(n)}</h2>${xBtn}</div><div class="f2"><label class="fl">Tipo<select id="bmT"><option value="1">Entrada</option><option value="-1">Salida</option></select></label><label class="fl">Monto<input id="bmM" inputmode="numeric" autofocus></label><label class="fl full">Concepto<input id="bmN" placeholder="Ej: comisión del banco, retiro a efectivo"></label></div><div class="acts"><button class="btn p" data-act="bancoMovOk" data-id="${esc(n)}" data-enter>Guardar</button></div>`);

/* ---- caja: medios de pago y cierres ---- */
function medioTabla(day){const ms={};const add2=(m,k,v)=>{(ms[m]??={ing:0,egr:0});ms[m][k]+=v};
 D('ventas').forEach(v=>{if(!v.anulada&&dkey(v.fecha)===day)add2(v.pago||'—','ing',N(v.total))});D('caja').forEach(c=>{if(c.anulado||dkey(c.fecha)!==day)return;if(c.tipo==='Cobro cuenta')add2(c.metodo,'ing',N(c.monto));if(c.tipo==='Pago proveedor')add2(c.metodo,'egr',N(c.monto));if(c.tipo==='Ingreso')add2('Efectivo','ing',N(c.monto));if(c.tipo==='Retiro')add2('Efectivo','egr',N(c.monto))});
 D('gastos').forEach(g=>{if(dkey(g.fecha)===day)add2(g.metodo||'Efectivo','egr',N(g.monto))});D('devoluciones').forEach(d=>{if(!d.anulada&&dkey(d.fecha)===day&&!d.cambio)add2(d.por,'egr',N(d.total))});D('pedidos').forEach(p=>{if(N(p.sena)&&dkey(p.fecha)===day&&p.estado!=='Cancelado')add2(p.senaMet||'Efectivo','ing',N(p.sena))});
 const r=Object.entries(ms);if(!r.length)return '';return `<div class="tw" style="margin-top:14px"><table class="t"><thead><tr><th>Medio de pago</th><th class="n">Entró</th><th class="n">Salió</th><th class="n">Neto</th></tr></thead><tbody>${r.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="n okc">${money(v.ing)}</td><td class="n neg">${money(v.egr)}</td><td class="n"><b>${money(v.ing-v.egr)}</b></td></tr>`).join('')}</tbody></table></div>`}
ACT.cerrarCaja=()=>{const cj=cajaDia(today());open(`<div class="mh"><h2>Cerrar caja de hoy</h2>${xBtn}</div><p>Contá la plata que hay en el cajón y escribila. La app la compara con lo que debería haber.</p><div class="rows"><div><span>Debería haber en efectivo</span><b class="bigt">${money(cj.queda)}</b></div></div><div class="f2"><label class="fl">Lo que contaste<input id="ccC" inputmode="numeric" autofocus></label><label class="fl">Nota<input id="ccN" placeholder="Opcional"></label></div><div id="ccD"></div><div class="acts"><button class="btn p" data-act="cerrarOk" data-enter>Cerrar caja</button></div>`)};
document.addEventListener('input',e=>{if(e.target.id==='ccC'){const d=num(e.target.value)-cajaDia(today()).queda;$('#ccD').innerHTML=e.target.value?`<div class="${d===0?'vuelto':'note'}">${d===0?'Perfecto: coincide':d>0?'Sobran '+money(d):'Faltan '+money(-d)}</div>`:''}});
ACT.cerrarOk=async()=>{const v=$('#ccC').value;if(v==='')return toast('Escribí lo que contaste');const cont=num(v);const cj=cajaDia(today());const dif=cont-cj.queda;
 const por={};D('ventas').forEach(x=>{if(!x.anulada&&dkey(x.fecha)===today())por[x.pago]=(por[x.pago]||0)+N(x.total)});
 if(!await guard(()=>put('cierres',uid(),{fecha:new Date().toISOString(),esperado:cj.queda,contado:cont,diferencia:dif,nota:$('#ccN').value.trim(),vendedor:vendedor(),ventas:por})))return;
 if(dif)await guard(()=>put('caja',uid(),{fecha:new Date().toISOString(),tipo:'Ajuste arqueo',monto:dif,nota:'Diferencia al cerrar caja',vendedor:vendedor()}));close();toast(dif?`Caja cerrada con ${dif>0?'sobrante':'faltante'} de ${money(Math.abs(dif))}`:'Caja cerrada: coincide')};
function cierresView(){const l=D('cierres');return `<button class="btn p" data-act="cerrarCaja" style="margin-bottom:12px">${ic('lock')} Cerrar caja de hoy</button>`+(l.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Quién</th><th class="n">Debía haber</th><th class="n">Contado</th><th class="n">Diferencia</th><th>Nota</th></tr></thead><tbody>${l.map(c=>`<tr><td>${fdate(c.fecha)}</td><td>${esc(c.vendedor||'')}</td><td class="n">${money(c.esperado)}</td><td class="n"><b>${money(c.contado)}</b></td><td class="n ${N(c.diferencia)<0?'neg':N(c.diferencia)>0?'okc':''}">${money(c.diferencia)}</td><td class="small">${esc(c.nota||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mute">Todavía no cerraste ninguna caja.</p>')}
const GT={cierres:cierresView,bancos:bancosView,cheques:chequesView};

/* ---- reportes extra ---- */
const RT={};
RT.ganancia=()=>{const by={};ventasR().forEach(v=>{const f=N(v.subtotal)?(N(v.total)-N(v.envio)-N(v.impuesto))/N(v.subtotal):1;(v.items||[]).forEach(i=>{const o=by[i.nombre]??={u:0,v:0,c:0,sc:false};o.u+=N(i.cant);o.v+=N(i.precio)*N(i.cant)*f;o.c+=N(i.costo)*N(i.cant);if(!N(i.costo))o.sc=true})});const r=Object.entries(by).sort((a,b)=>(b[1].v-b[1].c)-(a[1].v-a[1].c));

/* ---- PDF simple (A4) sin librerías: texto, líneas, rectángulos y una imagen JPG ---- */
function pdfDoc(){const W=595.28,H=841.89;let ops=[];const pages=[];let img=null;
 const enc=s=>{s=String(s??'');let o='';for(const ch of s){let c=ch.codePointAt(0);const map={8364:128,8226:149,8211:150,8212:151,8220:147,8221:148,8216:145,8217:146,8230:133};if(map[c])c=map[c];else if(c>255)c=63;const h=String.fromCharCode(c);o+=h==='('||h===')'||h==='\\'?'\\'+h:h}return o};
 const col=hex=>{const n=parseInt(hex.replace('#',''),16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(x=>x.toFixed(3)).join(' ')};
 /* ancho aproximado de Helvetica para alinear a la derecha */
 const WD='278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500'.split(',').map(Number);
 const tw=(s,sz,bold)=>{let w=0;for(const ch of String(s??'')){const c=ch.charCodeAt(0);w+=(c>=32&&c<=122?WD[c-32]:556)*(bold?1.06:1)}return w*sz/1000};
 const api={W,H,
  text(x,y,s,o={}){const sz=o.size||10,f=o.bold?'F2':'F1';let xx=x;if(o.align==='right')xx=x-tw(s,sz,o.bold);else if(o.align==='center')xx=x-tw(s,sz,o.bold)/2;ops.push(`BT ${col(o.color||'#222222')} rg /${f} ${sz} Tf ${xx.toFixed(2)} ${(H-y).toFixed(2)} Td (${enc(s)}) Tj ET`)},
  line(x1,y1,x2,y2,o={}){ops.push(`${col(o.color||'#dddddd')} RG ${o.w||0.8} w ${x1.toFixed(2)} ${(H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(H-y2).toFixed(2)} l S`)},
  rect(x,y,w,h,o={}){ops.push(`${col(o.fill||'#f2f2f2')} rg ${x.toFixed(2)} ${(H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`)},
  image(jpgBytes,pw,ph,x,y,w,h){img={b:jpgBytes,pw,ph};ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(H-y-h).toFixed(2)} cm /Im1 Do Q`)},
  tw,newPage(){pages.push(ops);ops=[]},
  build(){pages.push(ops);const te=new TextEncoder();const chunks=[];let len=0;const offs=[];
   const add=x=>{const b=typeof x==='string'?latin(x):x;chunks.push(b);len+=b.length};
   const latin=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
   const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n`);if(Array.isArray(body))body.forEach(add);else add(body);add('\nendobj\n')};
   add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
   const np=pages.length;const first=6;/* 1 catálogo, 2 páginas, 3 F1, 4 F2, 5 imagen */
   const kids=pages.map((_,i)=>`${first+i*2} 0 R`).join(' ');
   obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${np} >>`);
   obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
   if(img)obj(5,[`<< /Type /XObject /Subtype /Image /Width ${img.pw} /Height ${img.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.b.length} >>\nstream\n`,img.b,'\nendstream']);else obj(5,'<< >>');
   pages.forEach((p,i)=>{const c=p.join('\n');const cb=latin(c);obj(first+i*2,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${img?' /XObject << /Im1 5 0 R >>':''} >> /Contents ${first+i*2+1} 0 R >>`);obj(first+i*2+1,[`<< /Length ${cb.length} >>\nstream\n`,cb,'\nendstream'])});
   const n=first+np*2;const xref=len;let x=`xref\n0 ${n}\n0000000000 65535 f \n`;for(let i=1;i<n;i++)x+=String(offs[i]||0).padStart(10,'0')+' 00000 n \n';add(x+`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
   const out=new Uint8Array(len);let o=0;chunks.forEach(c=>{out.set(c,o);o+=c.length});return out}};
 return api}
/* logo a JPG con fondo blanco, para meterlo en el PDF */
async function logoJpg(src,maxW=360){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/im.width),w=Math.round(im.width*k),h=Math.round(im.height*k);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const d=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]);const u=new Uint8Array(d.length);for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);r({b:u,w,h})};im.onerror=()=>r(null);im.src=src})}
async function presuPdf(p){const c=C(),T=c.ticket;const d=pdfDoc();const M=42;let y=46;const R='#cb0b15';
 if(T.logo!==false){const lg=await logoJpg(LOGO);if(lg){const h=46,w=lg.w*h/lg.h;d.image(lg.b,lg.w,lg.h,M,y-8,w,h)}}else d.text(M,y+20,c.negocio,{size:20,bold:true,color:R});
 d.text(d.W-M,y+6,'PRESUPUESTO',{size:18,bold:true,color:R,align:'right'});d.text(d.W-M,y+22,'N° '+pad5(p.nro),{size:11,align:'right'});d.text(d.W-M,y+36,fday(p.fecha),{size:10,align:'right',color:'#666666'});
 y+=62;const datos=[String(T.encabezado||'').split('\n').map(x=>x.trim()).filter(Boolean).join(' · '),T.tel?'WhatsApp '+T.tel:'',T.ig,T.cuit?'CUIT '+T.cuit:''].filter(Boolean).join('   ·   ');if(datos){d.text(M,y,datos,{size:9,color:'#666666'});y+=10}
 d.line(M,y,d.W-M,y,{color:R,w:1.5});y+=22;
 if(p.cliente){d.text(M,y,'Para:',{size:10,color:'#666666'});d.text(M+34,y,p.cliente,{size:11,bold:true});const cl=cliente(p.cliente);if(cl?.tel)d.text(d.W-M,y,'Tel. '+cl.tel,{size:10,align:'right',color:'#666666'});y+=20}
 const X={n:M+8,v:M+200,q:d.W-M-170,p:d.W-M-90,t:d.W-M-8};
 const head=()=>{d.rect(M,y-12,d.W-2*M,20,{fill:'#f6e3e4'});d.text(X.n,y+2,'Producto',{size:9,bold:true});d.text(X.v,y+2,'Talle / color',{size:9,bold:true});d.text(X.q,y+2,'Cant.',{size:9,bold:true,align:'right'});d.text(X.p,y+2,'Precio',{size:9,bold:true,align:'right'});d.text(X.t,y+2,'Subtotal',{size:9,bold:true,align:'right'});y+=24};
 head();const by={};(p.items||[]).forEach(i=>{const k=i.nombre+'|'+N(i.precio);(by[k]??=[]).push(i)});
 const corta=(s,w,sz)=>{s=String(s);while(s.length>3&&d.tw(s,sz)>w)s=s.slice(0,-2);return s};
 for(const l of Object.values(by)){const q=sum(l,i=>N(i.cant)),pr=N(l[0].precio);const vs=l.map(i=>vname(i.t,i.c)+(l.length>1||N(i.cant)>1?' ×'+N(i.cant):'')).join(', ');
  const lines=[];let cur='';vs.split(', ').forEach(v=>{const t=cur?cur+', '+v:v;if(d.tw(t,9)>X.q-X.v-40){lines.push(cur);cur=v}else cur=t});if(cur)lines.push(cur);
  if(y+14*lines.length>d.H-120){d.newPage();y=50;head()}
  d.text(X.n,y,corta(l[0].nombre,X.v-X.n-10,10),{size:10,bold:true});lines.forEach((t,k)=>d.text(X.v,y+k*12,t,{size:9,color:'#444444'}));d.text(X.q,y,String(q),{size:10,align:'right'});d.text(X.p,y,money(pr),{size:10,align:'right'});d.text(X.t,y,money(q*pr),{size:10,align:'right',bold:true});
  y+=Math.max(1,lines.length)*12+8;d.line(M,y-6,d.W-M,y-6,{color:'#eeeeee'})}
 y+=8;d.text(X.p,y,'Prendas',{size:10,align:'right',color:'#666666'});d.text(X.t,y,String(N(p.unidades)),{size:10,align:'right'});y+=22;
 d.rect(X.p-70,y-15,X.t-X.p+78,24,{fill:R});d.text(X.p,y+2,'TOTAL',{size:12,bold:true,color:'#ffffff',align:'right'});d.text(X.t,y+2,money(p.total),{size:13,bold:true,color:'#ffffff',align:'right'});y+=40;
 const nota=T.presuNota||`Válido por ${N(T.presuDias)||7} días. Precios sujetos a cambio sin previo aviso.`;d.text(M,y,nota,{size:9,color:'#666666'});y+=14;if(T.alias){d.text(M,y,'Alias / CBU: '+T.alias,{size:9,color:'#666666'});y+=14}
 if(p.vendedor)d.text(M,y,'Atendió: '+p.vendedor,{size:9,color:'#666666'});
 d.text(d.W/2,d.H-30,[c.negocio,T.ig,T.tel].filter(Boolean).join(' · '),{size:8,color:'#999999',align:'center'});
 return new Blob([d.build()],{type:'application/pdf'})}
async function enviarPresuPdf(id){const p=D('presupuestos').find(x=>x.id===id);if(!p)return;const blob=await presuPdf(p);const name=`Presupuesto-${pad5(p.nro)}-${(p.cliente||C().negocio).replace(/[^\wáéíóúñ ]/gi,'').trim().replace(/\s+/g,'-')}.pdf`;const file=new File([blob],name,{type:'application/pdf'});
 const txt=`Hola${p.cliente?' '+p.cliente.split(' ')[0]:''}! Te paso el presupuesto N° ${pad5(p.nro)} por ${money(p.total)}.`;
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:txt});return}}catch(e){if(e?.name==='AbortError')return}
 /* compu: se descarga el PDF y se abre WhatsApp para adjuntarlo */
 const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);
 const cl=cliente(p.cliente);const wa=cl?.tel?waLink(cl.tel,txt):'https://wa.me/?text='+encodeURIComponent(txt);
 open(`<div class="mh"><h2>${ic('wa')} Enviar por WhatsApp</h2>${xBtn}</div><p>Ya se descargó <b>${esc(name)}</b>.</p><ol class="pasos"><li>Tocá <b>Abrir WhatsApp</b>${cl?.tel?' (se abre el chat de '+esc(p.cliente)+')':''}.</li><li>En el chat tocá el <b>clip 📎</b> → <b>Documento</b> y elegí el PDF de <b>Descargas</b>.</li></ol><div class="acts"><button class="btn" data-act="close">Cerrar</button><a class="btn p" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} Abrir WhatsApp</a></div>`)}
/* restaurar copia */
document.addEventListener('change',async e=>{const t=e.target;if(t.id!=='impJson'||!t.files?.[0])return;const f=t.files[0];t.value='';let d;try{d=JSON.parse(await f.text())}catch(er){return toast('Ese archivo no es una copia válida')}
 let datos=null,cfg={};if(d&&d.datos&&typeof d.datos==='object'){datos=d.datos;cfg=d.config||{}}else if(d&&Array.isArray(d.articulos)){datos={articulos:d.articulos,ventas:d.ventas||[],clientes:d.clientes||[]};cfg=d.config||{}}
 if(!datos)return toast('Ese archivo no es una copia de Nayes');
 ask('¿Restaurar esta copia?',`${NUBE?'Se suben a la nube (lo que ya está con el mismo código se reemplaza)':'Se reemplaza todo lo de esta compu por la copia'}: ${(datos.articulos||[]).length} productos, ${(datos.ventas||[]).length} ventas y ${(datos.clientes||[]).length} clientes.`,'Restaurar',async()=>{await cargarTodo(datos,cfg);render(true);toast('Copia restaurada')})});

try{const t=localStorage.getItem('nayes-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
themeUI();fromHash();render(true);boot();
