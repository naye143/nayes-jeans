<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nayes Jeans · Stock y ventas</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#cb0b15"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

/* VOICE: mostrador mayorista, práctico, alegre como la marca
   IDEA: app de caja con barra inferior, como la que ya usan, en rojo y blanco Nayes
   PICTURE: la grilla de prendas con foto y las tarjetas de producto
   COLOUR and TYPE: rojo Nayes #cb0b15 + blanco; Fredoka redondeada + Nunito
   LAYOUT: barra superior con logo, contenido, barra de pestañas abajo; pedido al costado en compu */
:root{color-scheme:light;--ld0:#7a0610;--ld1:#9fe0b8;--ld2:#f2828a;--ld3:#e8f0ff;--ld4:#2457c5;--r:#cb0b15;--bg:#f2f3f6;--card:#fff;--ink:#1f1a1c;--mute:#6b6468;--line:#e6e2e4;--soft:#f4eff0;--r2:#cb0b15;--rs:#fdecec;--ok:#16803f;--oks:#e8f7ee;--warn:#c25a00;--warns:#fff4e8;--bad:#d1242f}:root[data-theme=dark]{color-scheme:dark;--ld0:#ff8a90;--ld1:#2f6b45;--ld2:#ef4049;--ld3:#1b2a4a;--ld4:#8fb2ff;--bg:#121012;--card:#1d191b;--ink:#f3eced;--mute:#b4a9ac;--line:#342c2f;--soft:#2a2326;--r2:#ef4049;--rs:#3a1518;--ok:#4cc77d;--oks:#16301f;--warn:#ffa257;--warns:#3a2610;--bad:#ff7a80}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--ld0:#ff8a90;--ld1:#2f6b45;--ld2:#ef4049;--ld3:#1b2a4a;--ld4:#8fb2ff;--bg:#121012;--card:#1d191b;--ink:#f3eced;--mute:#b4a9ac;--line:#342c2f;--soft:#2a2326;--r2:#ef4049;--rs:#3a1518;--ok:#4cc77d;--oks:#16301f;--warn:#ffa257;--warns:#3a2610;--bad:#ff7a80}}

*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,"Arial Rounded MT Bold","Segoe UI",sans-serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:34px}h2{font-size:25px}h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;min-height:46px;width:100%}
textarea{min-height:110px}
:focus-visible{outline:3px solid var(--ld0);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.mute{color:var(--mute)}.small{font-size:14px}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.topin{max-width:1240px;margin:auto;padding:8px max(3vw,14px);display:flex;align-items:center;gap:12px}
.topin img{height:46px;width:auto;display:block;background:#fff;border-radius:10px;padding:2px 4px}
.topin .sp{flex:1}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--mute)}
.ib:hover{background:var(--soft)}
.conn{height:40px;padding:0 12px;border-radius:14px;display:flex;align-items:center;gap:6px;background:var(--oks);color:var(--ok);font-weight:700;font-size:14px;white-space:nowrap}
.conn.no{background:var(--rs);color:var(--bad)}
/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:220px;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:9px 4px 8px;cursor:pointer;color:var(--mute);font-weight:700;font-size:14px;min-height:60px}
.tabs button .ic{width:26px;height:26px}
.tabs button[aria-current=page]{color:var(--r2)}
main{max-width:1240px;margin:auto;padding:18px max(3vw,14px) 120px}
body.conplayer main{padding-bottom:190px}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;color:inherit}
.btn.p{background:var(--r);border-color:var(--r);color:#fff}
.btn.d{color:var(--bad)}
.btn.s{min-height:38px;padding:6px 13px;font-size:15px;border-radius:12px}
.btn.big{min-height:54px;font-size:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hd1{margin-bottom:14px}
.hd1 p{margin:4px 0 0}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--r2);font-weight:800;cursor:pointer;padding:6px 0;margin-bottom:6px;min-height:44px}
/* búsqueda y chips */
.bar1{display:flex;gap:10px;margin-bottom:12px}
.lsel{width:auto;flex:none;color:var(--r2);font-weight:800}
.srch{flex:1;position:relative}
.srch .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.srch input{padding-left:44px}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chipb{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 16px;border-radius:14px;border:0;background:var(--soft);font-weight:700;cursor:pointer;white-space:nowrap}
.chipb.on{background:var(--r);color:#fff}
.chipb.warnb{background:var(--warns);color:var(--warn)}.chipb.warnb.on{background:var(--warn);color:#fff}
.chipb .ic{width:18px;height:18px}
.cnt{background:color-mix(in srgb,currentColor 18%,transparent);border-radius:999px;padding:0 8px;font-size:14px}
.sortw{display:flex;align-items:center;gap:6px;width:auto}
.sortw select,.chipsrow select{width:auto;min-height:42px}
@media(max-width:600px){.chipsrow select{flex:1 1 140px}.sortw{flex:1 1 100%}.sortw select{flex:1}}
/* vender */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--r)}
.card:focus-visible{outline:3px solid var(--ld0)}
.ph{aspect-ratio:4/5;background:var(--soft);display:grid;place-items:center;color:var(--r);overflow:hidden;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:42%;opacity:.4}
.cb{padding:10px 12px 12px;display:grid;gap:1px}
.code{font:600 14px Fredoka,"Arial Rounded MT Bold",sans-serif;color:var(--mute)}
.cb b{font-weight:700;line-height:1.2}
.cb small{color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.price{color:var(--r2);font:600 19px Fredoka,"Arial Rounded MT Bold",sans-serif;white-space:nowrap}
.st{font-size:14px;color:var(--ok);font-weight:700;white-space:nowrap}
.st.low{color:var(--warn)}.st.out{color:var(--bad)}
.cart{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;position:sticky;top:84px;display:grid;gap:10px;max-height:calc(100vh - 200px);overflow:auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.qty{display:flex;align-items:center;gap:4px}
.qty b{min-width:26px;text-align:center}
.qty button{width:38px;height:38px;border-radius:12px;border:0;background:var(--soft);cursor:pointer;font-weight:800;font-size:17px}
.tot{display:grid;gap:3px}.tot div{display:flex;justify-content:space-between;gap:10px}
.bigt{font:600 32px/1.1 Fredoka,"Arial Rounded MT Bold",sans-serif;white-space:nowrap;color:var(--r2)}
.cartbar{position:fixed;left:12px;right:12px;bottom:72px;z-index:25;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:16px}
body.conplayer .cartbar{bottom:142px}
/* productos */
.tbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tb{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:8px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:17px;cursor:pointer;white-space:nowrap}
.tb.ok{border-color:var(--ld1);color:var(--ok)}
.tb.pri{background:var(--r);border-color:var(--r);color:#fff}
.warn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warns);color:var(--warn);border:1.5px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:18px;padding:12px 16px;margin-bottom:14px;font-size:17px}
.warn b{flex:1}
.lnk{border:0;background:none;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer;min-height:40px}
.fbox{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.fbox .chipsrow:last-child{margin-bottom:0}
.list{display:grid;gap:12px}
.pcard{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:grid;gap:12px}
.pcard.off{opacity:.65}
.ptop{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:start}
.pth{width:62px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;color:var(--r)}
.pth img{width:100%;height:100%;object-fit:cover}.pth svg{width:50%;opacity:.4}
.pin{display:grid;gap:1px}
.pname{font:600 21px/1.15 Fredoka,"Arial Rounded MT Bold",sans-serif}
.pprice{color:var(--r2);font:600 21px Fredoka,"Arial Rounded MT Bold",sans-serif}
.picons{display:flex}
.pbot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.pst{color:var(--mute);font-weight:600}.pst b{color:var(--ok)}.pst b.lowc{color:var(--warn)}.pst b.neg{color:var(--bad)}
.tchips{display:flex;gap:5px;flex-wrap:wrap}
.tc{display:grid;justify-items:center;min-width:38px;padding:3px 6px;border-radius:12px;background:var(--soft);font-weight:800;font-size:14px;line-height:1.15}
.tc small{font-weight:600;font-size:13px;color:var(--mute)}
.tc.low{background:var(--warns);color:var(--warn)}.tc.low small{color:var(--warn)}
.tc.out{background:var(--rs);color:var(--bad)}.tc.out small{color:var(--bad)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);flex:none}
.pact{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib.sm{width:40px;height:40px;background:var(--soft);color:var(--ink)}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--mute);min-height:40px}
.sw i{width:42px;height:24px;border-radius:12px;border:2.5px solid currentColor;position:relative}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:currentColor;transition:left .15s}
.sw.on{color:var(--ok)}.sw.on i::after{left:20px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,5,6,.55);display:none;z-index:50;align-items:flex-end;justify-content:center;padding:10px}
#modal.on{display:flex}
.box{background:var(--bg);border-radius:24px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:18px;display:grid;gap:14px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:24px;flex:none}
.pk{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:start}
.ph.r{border-radius:16px}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tl{display:grid;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.tl span{font:600 20px Fredoka,"Arial Rounded MT Bold",sans-serif}
.tl small{color:var(--mute);font-size:13px}
.tl input{text-align:center;padding:6px;min-height:42px}
.tl input:disabled{opacity:.4}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fl{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--mute)}
.fl.full{grid-column:1/-1}
.chk{display:flex;gap:10px;align-items:center;font-weight:700}
.chk input{width:22px;min-height:22px;accent-color:var(--r)}
.panel{background:var(--card);border-radius:22px;padding:16px;display:grid;gap:12px;align-content:start;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
/* reportes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi small{color:var(--mute);font-size:14px;font-weight:700}
.kpi b{display:block;font:600 clamp(24px,3vw,30px)/1.15 Fredoka,"Arial Rounded MT Bold",sans-serif;white-space:nowrap}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:15px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--r2);border-radius:7px}
.bv{font-weight:700;white-space:nowrap;text-align:right}
.days{display:flex;align-items:flex-end;gap:4px;height:160px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.day i{width:100%;background:var(--ld2);border-radius:5px 5px 0 0;min-height:2px;display:block}
.day small{font-size:13px;color:var(--mute)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{min-height:42px;padding:6px 15px;border-radius:14px;border:0;background:var(--soft);cursor:pointer;font-weight:700}
.seg button[aria-pressed=true]{background:var(--r);color:#fff}
/* ventas */
.sale{background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sale.an{opacity:.55}.sale.an .bigt{text-decoration:line-through}
.sale summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;list-style:none;align-items:center}
.sale summary::-webkit-details-marker{display:none}
.sd{margin-top:10px;display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:10px}
/* más */
.menu{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.menu button{width:100%;display:flex;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--line);background:none;padding:16px;cursor:pointer;text-align:left;font-weight:700;font-size:17px;min-height:64px}
.menu button:last-child{border-bottom:0}
.menu .mi{width:42px;height:42px;border-radius:14px;background:var(--rs);color:var(--r2);display:grid;place-items:center;flex:none}
.menu .mt{flex:1;display:grid}.menu .mt small{font-weight:600;color:var(--mute);font-size:14px}
.note{background:var(--rs);border:1px solid color-mix(in srgb,var(--r) 40%,transparent);padding:10px 14px;border-radius:16px;margin-bottom:14px}
.empty{text-align:center;padding:44px 16px;color:var(--mute);display:grid;gap:12px;justify-items:center;background:var(--card);border-radius:22px}
.empty svg{width:60px;color:var(--r);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:14px;padding:2px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chip.low{background:var(--warns);color:var(--warn);font-weight:700}.chip.out{background:var(--rs);color:var(--bad);font-weight:700}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;display:none;max-width:90vw;font-weight:700}
code{background:var(--soft);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere;font-size:14px}
/* reproductor */
.player{position:fixed;left:0;right:0;bottom:61px;z-index:24;background:var(--r);color:#fff;display:flex;align-items:center;gap:10px;padding:8px max(3vw,14px)}
.player[hidden]{display:none}
.pb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:16px;flex:none}
.pb.main{background:#fff;color:var(--r)}
.pinf{flex:1;display:grid;gap:2px}.pinf b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;gap:8px;align-items:center}.pr input{min-height:20px;padding:0;accent-color:#fff;border:0;background:none}.pr small{white-space:nowrap;font-size:13px;opacity:.9}
.player .btn.s{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}.player .btn.s[aria-pressed=true]{background:#fff;color:var(--r)}
.vol{display:flex;align-items:center;gap:6px;font-size:14px}.vol input{width:90px;min-height:20px;padding:0;accent-color:#fff;border:0;background:none}
/* ticket */
#ticket{display:none}
.tk{font:12px/1.35 "Courier New",Courier,monospace;color:#000;background:#fff;padding:2mm 1mm}
.w58 .tk{width:48mm}.w80 .tk{width:72mm}.wA4 .tk{width:90mm;font-size:13px}
.tklogo{display:block;width:60%;margin:0 auto 4px;filter:grayscale(1) contrast(1.4)}
.tkn{text-align:center;font-weight:700;font-size:16px}
.tkc{text-align:center}.tks{font-size:10px;margin-top:4px}
.tkl{border-top:1px dashed #000;margin:4px 0}
.tkr{display:flex;justify-content:space-between;gap:6px}
.tkb{font-weight:700;margin-top:2px}
.tkt{font-weight:700;font-size:15px;margin:3px 0}
@media print{body>*:not(#ticket){display:none!important}#ticket{display:block!important}body{background:#fff}}
@media(max-width:900px){.pos{grid-template-columns:minmax(0,1fr)}.pos>aside{display:none}.cartbar.on{display:flex}}
@media(min-width:700px){#modal{align-items:center}}
@media(max-width:600px){h1{font-size:30px}.f2{grid-template-columns:minmax(0,1fr)}.pk{grid-template-columns:110px minmax(0,1fr)}.day small.odd{visibility:hidden}.bar{grid-template-columns:minmax(0,7em) minmax(0,1fr) auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tb{font-size:16px;padding:8px 14px}.vol,#mShuf{display:none}.conn span{display:none}.pname,.pprice{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* --- v3: navegación tipo Deam, tablas, grillas talle x color --- */
.topin{gap:8px}
.navd{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.navd button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--mute);font-weight:700;font-size:15px;padding:8px 10px;border-radius:12px;cursor:pointer;min-height:42px;white-space:nowrap}
.navd button .lb{display:none}
.navd button[aria-current=page]{background:var(--rs);color:var(--r2)}
.navd button[aria-current=page] .lb{display:inline}
.navd button:hover{background:var(--soft)}
.vend{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:12px;padding:0 12px;height:40px;font-weight:700;cursor:pointer;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.navd,.vend{display:none}}
@media(min-width:901px){.tabs{display:none}main{padding-bottom:40px}body.conplayer main{padding-bottom:110px}.player{bottom:0}body.conplayer .cartbar{bottom:80px}#toast{bottom:40px}}
.tabs button{font-size:13px}
/* POS */
.pos{grid-template-columns:minmax(0,1fr) 400px}
.lastv{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:grid;gap:2px;margin-bottom:12px}
.lastv .bigt{font-size:28px;color:var(--ink)}
.lbl{font-size:13px;font-weight:800;color:var(--mute);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.lbl .ic{width:16px;height:16px}
.cartw{display:grid;gap:10px}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.vch{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.vc{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:10px;padding:2px 4px 2px 8px;font-size:14px;font-weight:700}
.vc button{border:0;background:none;cursor:pointer;width:26px;height:26px;border-radius:8px;font-weight:800}
.vc button:hover{background:var(--line)}
.pl{display:grid;gap:0;margin-top:4px}
.pl span{font-size:13px;color:var(--mute);white-space:nowrap}
.pl span.on{color:var(--r2);font-weight:800;font-size:15px}
.ofe{text-decoration:line-through;color:var(--mute);font-size:13px;margin-left:4px}
.addb{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center}
.addb.no{background:#9aa0a6}
.card{position:relative}
.sinst{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);color:#333;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700}
.card.kb{outline:3px solid var(--ld0)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font:700 12px ui-monospace,Consolas,monospace;background:var(--card);color:var(--mute);margin-left:4px;white-space:nowrap}
/* grilla talle x color */
.vg{border-collapse:separate;border-spacing:6px;margin:0 auto}
.vg th{font:600 16px Fredoka,"Arial Rounded MT Bold",sans-serif;padding:2px 4px;text-align:center}
.vg td{text-align:center;vertical-align:top}
.vg input{width:78px;text-align:center;padding:6px;min-height:42px}
.vg small{display:block;font-size:13px;color:var(--mute)}
.vg small.neg{color:var(--bad)}
.vgw{overflow-x:auto;max-width:100%}
.hint{font-size:13px;color:var(--mute)}
/* tablas */
.tw{background:var(--card);border-radius:22px;overflow:auto;box-shadow:0 1px 3px rgba(0,0,0,.05)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:13px;font-weight:800;color:var(--mute);padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t .pth{width:44px}
table.t input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--r)}
.neg{color:var(--bad)!important}.lowc{color:var(--warn)!important}.okc{color:var(--ok)!important}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots .dot{width:20px;height:20px}
.dotl{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);font-size:11px;font-weight:800;border:1px solid var(--line)}
.tg{display:flex;gap:4px;flex-wrap:wrap}.tg span{background:var(--soft);border-radius:8px;padding:0 7px;font-size:13px;font-weight:700}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--rs);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-weight:700}
@media(max-width:900px){.only-d{display:none!important}}
@media(min-width:901px){.only-m{display:none!important}}
/* chips input */
.chin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:6px 8px;background:var(--card)}
.chin input{border:0;min-height:34px;flex:1 1 120px;padding:4px;background:transparent}
.chin input:focus{outline:none}
.chi{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:10px;padding:3px 4px 3px 10px;font-weight:700}
.chi button{border:0;background:none;cursor:pointer;width:24px;height:24px;border-radius:8px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px dashed var(--line);background:none;border-radius:10px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:14px;min-height:34px}
/* pestañas internas */
.sub{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:16px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.sub button{border:0;background:none;padding:8px 14px;border-radius:12px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:40px;color:var(--mute)}
.sub button[aria-pressed=true]{background:var(--card);color:var(--r2);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.k4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.k4 .kpi b.g{color:var(--ok)}.k4 .kpi b.r{color:var(--bad)}.k4 .kpi b.b{color:var(--r2)}
.rows{display:grid}.rows>div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.rows>div:last-child{border-bottom:0}
.rows .tt{font-weight:800;font-size:18px}
.est{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.est.Pendiente{background:var(--warns);color:var(--warn)}.est.En{background:var(--ld3);color:var(--ld4)}.est.Listo{background:var(--oks);color:var(--ok)}.est.Entregado{background:var(--soft);color:var(--mute)}.est.Cancelado{background:var(--rs);color:var(--bad)}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pay button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 8px;font-weight:800;cursor:pointer;min-height:56px}
.pay button[aria-pressed=true]{border-color:var(--r);background:var(--rs);color:var(--r2)}
.vuelto{background:var(--oks);color:var(--ok);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:800;font-size:20px}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.help h3{font-size:14px;color:var(--mute);text-transform:none;margin-bottom:6px}
.help div>div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}
.box.wide{max-width:920px}
.srchres{display:grid;gap:6px;max-height:300px;overflow:auto}
.srchres button{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px;cursor:pointer;text-align:left;min-height:52px}
.srchres .pth{width:36px;flex:none}
.swt{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.swt input{width:20px;min-height:20px;accent-color:var(--r)}
@media(max-width:900px){.pos{grid-template-columns:minmax(0,1fr)}}
.vg .dot,.vg .dotl{display:inline-block;width:18px;height:18px;vertical-align:middle}.chi .dot,.chi .dotl{width:18px;height:18px}
.sub{flex-wrap:wrap;width:auto}.sub button{flex:none}

.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

.empty .btn svg{width:20px;color:inherit;opacity:1}
/* categorías de reportes/finanzas: primero el grupo, abajo sus opciones */
.grp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px;margin:6px 0 10px}
.grp button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;min-height:52px;padding:8px 10px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.grp button svg{width:20px;height:20px;flex:none;color:var(--mute)}
.grp button[aria-pressed=true]{background:var(--r);border-color:var(--r);color:#fff}
.grp button[aria-pressed=true] svg{color:#fff}
.grp+.sub{margin-top:0}
.persel{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;margin:4px 0 12px;font-weight:700;color:var(--mute)}
.persel svg{width:18px;height:18px}
.persel select{border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink);min-height:40px;padding:0 6px;width:auto}
@media(max-width:600px){.grp button{flex-direction:column;gap:4px;font-size:13px;min-height:60px}}
.updbar{position:sticky;top:62px;z-index:19;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--rs);border-bottom:1px solid var(--r);padding:10px max(3vw,14px)}
.updbar .ub-ic svg{width:26px;height:26px;color:var(--r2)}
.updbar .ub-t{flex:1 1 220px;display:flex;flex-direction:column;gap:2px}.updbar .ub-t span{color:var(--mute);font-size:14px}
.updbar .acts{margin:0}
.pasos{padding-left:22px;line-height:1.6;margin:10px 0}.pasos li{margin-bottom:4px}.novs{padding-left:20px;line-height:1.5}
/* pantalla de entrar */
body.enlogin>*:not(#login):not(#toast){display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}

const wErr=e=>{console.error(e);toast(e?.code==='permission-denied'?'No tenés permiso para guardar. Volvé a entrar con tu usuario.':'No se pudo guardar en la nube. Probá de nuevo.')};
const track=p=>{pendW++;connUI();p.catch(wErr).finally(()=>{pendW--;connUI()})};
const deep=(o,p)=>{for(const k in p){if(p[k]&&typeof p[k]==='object'&&!Array.isArray(p[k])&&o[k]&&typeof o[k]==='object')deep(o[k],p[k]);else o[k]=p[k]}};
/* se aplica al toque en pantalla y después se sube a la nube */
async function put(c,id,data){const o={...limpio(data),id};const a=S.d[c];const i=a.findIndex(x=>x.id===id);i<0?a.unshift(o):a[i]=o;ordenar(c);track(db.collection(c).doc(id).set(sinId(o)));render(true)}
const hojas=(o,p=[],out=[])=>{for(const k in o){const v=o[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(Object.keys(v).length)hojas(v,[...p,k],out)}else out.push([[...p,k],v])}return out};
async function upd(c,id,data){const l=hojas(sinId(limpio(data)));if(!l.length)return;const FP=firebase.firestore.FieldPath;const args=[];l.forEach(([p,v])=>args.push(new FP(...p),v));const o=S.d[c].find(x=>x.id===id);if(o)deep(o,limpio(data));track(db.collection(c).doc(id).update(...args));render(true)}
async function rm(c,id){S.d[c]=S.d[c].filter(x=>x.id!==id);track(db.collection(c).doc(id).delete());render(true)}
async function saveCfgData(d){S.cfg=limpio(d);track(db.doc('config/general').set(S.cfg));render(true)}
async function guard(fn){try{await fn();return true}catch(e){console.error(e);toast('No se pudo guardar. Probá de nuevo.');return false}}
async function cargarTodo(datos,cfg){let b=db.batch(),n=0;const flush=async()=>{if(n){const p=b.commit();track(p);b=db.batch();n=0;if(navigator.onLine)await p.catch(()=>{})}};
 for(const c of COLS)for(const o of (datos[c]||[])){if(!o||!o.id)continue;b.set(db.collection(c).doc(String(o.id)),sinId(limpio(o)));if(++n>=400)await flush()}
 await flush();await saveCfgData(cfg||{})}

 COLS.forEach(c=>{let q=db.collection(c);if(FECHA.includes(c))q=q.orderBy('fecha','desc').limit(2000);q.onSnapshot(s=>{S.d[c]=s.docs.map(d=>({...d.data(),id:d.id}));ordenar(c);if(c==='articulos'&&!S.loaded){clearTimeout(t);S.loaded=true}render()},err)})}

/* movimientos de stock */
async function moverStock(a,cambios,tipo,ref,nota,dep=depVenta()){/* cambios: {key:delta} */
 const st={};let u=0;const m=mapDep(a,dep);
 if(esSimple(dep)){/* se junta todo por color: la clave es U|color y los talles viejos de ese color quedan en 0 */
  const dc={};for(const [k,dq] of Object.entries(cambios)){if(!dq)continue;const c=colorDe(k);dc[c]=(dc[c]||0)+dq}cambios={};
  for(const [c,dq] of Object.entries(dc)){let nv=totColor(a,c,dep)+dq;if(!C().negativo&&nv<0)nv=0;Object.keys(m).forEach(k=>{if(colorDe(k)===c)st[k]=0});st[vk('U',c)]=nv;cambios[vk('U',c)]=dq;u+=dq}}
 else for(const [k,dq] of Object.entries(cambios)){if(!dq)continue;let nv=N(m[k])+dq;if(!C().negativo&&nv<0)nv=0;st[k]=nv;u+=dq}
 if(!Object.keys(st).length)return true;
 if(!await guard(()=>upd('articulos',a.id,dep===depMain()?{stock:st}:{sd:{[dep]:st}})))return false;
 await guard(()=>put('movs',uid(),{fecha:new Date().toISOString(),tipo,art:a.id,codigo:a.codigo||'',nombre:a.nombre||'',cambios,unidades:u,ref:ref||'',nota:nota||'',dep,vendedor:vendedor()}));return true}
async function aplicarItems(items,signo,tipo,ref,dep=depVenta()){const by={};items.forEach(i=>{(by[i.art]??={});const k=vk(i.t,i.c);by[i.art][k]=(by[i.art][k]||0)+signo*N(i.cant)});
 for(const [aid,ch] of Object.entries(by)){const a=art(aid);if(a)await moverStock(a,ch,tipo,ref,'',dep)}}

 const rec=PAY.usd?pnum(PAY.recibido)*N(c.usd.cot):num(PAY.recibido);return{t,sub,imp,desc,credito,envio,aj,total,vuelto:PAY.metodo==='Efectivo'&&rec?rec-total:null,rec}}

function ctaCte(nombre){const k=ckey(nombre);let debe=0,haber=0;const mov=[];
 D('ventas').forEach(v=>{if(!v.anulada&&ckey(v.cliente)===k&&v.pago==='Cuenta corriente'){debe+=N(v.total);mov.push({f:v.fecha,d:`Venta N° ${pad5(v.nro)}`,m:N(v.total)})}});
 D('pedidos').forEach(p=>{if(ckey(p.cliente)===k&&p.estado!=='Cancelado'&&p.aCuenta){const s=N(p.total)-N(p.sena);if(s>0){debe+=s;mov.push({f:p.fecha,d:`Pedido N° ${pad5(p.nro)}`,m:s})}}});
 D('caja').forEach(c=>{if(c.tipo==='Cobro cuenta'&&ckey(c.cliente)===k&&!c.anulado){haber+=N(c.monto);mov.push({f:c.fecha,d:'Pago ('+(c.metodo||'')+')',m:-N(c.monto)})}});
 D('devoluciones').forEach(d=>{if(!d.anulada&&ckey(d.cliente)===k&&d.por==='Saldo a favor'){haber+=N(d.total);mov.push({f:d.fecha,d:`Devolución N° ${pad5(d.nro)}`,m:-N(d.total)})}});
 mov.sort((a,b)=>String(b.f).localeCompare(String(a.f)));return{saldo:debe-haber,mov}}
V.clientes=()=>{const st={};D('ventas').forEach(v=>{if(v.anulada||!v.cliente)return;const k=ckey(v.cliente);const o=st[k]||(st[k]={t:0,n:0,u:''});o.t+=N(v.total);o.n++;if(!o.u||v.fecha>o.u)o.u=v.fecha});
 const q=S.cq.trim().toLowerCase();let cl=D('clientes').filter(c=>!q||[c.nombre,c.cuit,c.razon,c.tel].some(x=>String(x||'').toLowerCase().includes(q))).map(c=>({c,s:st[ckey(c.nombre)]||{t:0,n:0,u:''},cc:ctaCte(c.nombre).saldo,pp:D('pedidos').filter(p=>ckey(p.cliente)===ckey(c.nombre)&&!['Entregado','Cancelado'].includes(p.estado)).length}));
 if(S.cf==='debe')cl=cl.filter(x=>x.cc>0);if(S.cf==='ped')cl=cl.filter(x=>x.pp>0);
 cl.sort({az:(a,b)=>ncmp(a.c.nombre,b.c.nombre),compras:(a,b)=>b.s.n-a.s.n,total:(a,b)=>b.s.t-a.s.t,antig:(a,b)=>String(a.c.alta||'').localeCompare(String(b.c.alta||'')),rec:(a,b)=>String(b.s.u).localeCompare(String(a.s.u))}[S.corder]);
 return `${backBtn()}<div class="mh hd1"><div><h1>Clientes</h1><p class="mute">${D('clientes').length} clientes</p></div><button class="btn p" data-act="editCli">${ic('plus')} Nuevo cliente</button></div>
 <div class="chipsrow"><div class="srch" style="flex:1 1 260px">${ic('search')}<input id="cq" type="search" placeholder="Buscar por nombre, CUIT, razón social o WhatsApp…" value="${esc(S.cq)}"></div><label class="sortw">${ic('sort')}<select data-f="corder" aria-label="Ordenar">${[['az','Alfabético (A-Z)'],['compras','Cantidad de compras'],['total','Más compran ($)'],['antig','Antigüedad'],['rec','Compras recientes']].map(([k,t])=>`<option value="${k}" ${S.corder===k?'selected':''}>${t}</option>`).join('')}</select></label></div>
 <div class="chipsrow"><button class="chipb ${S.cf==='debe'?'on':''}" data-act="cf" data-id="debe">${ic('wallet')} Deben dinero</button><button class="chipb ${S.cf==='ped'?'on':''}" data-act="cf" data-id="ped">${ic('clip')} Tienen pedidos abiertos</button></div>
 ${cl.length?`<div class="list">${cl.map(({c,s,cc,pp})=>{const wa=waLink(c.tel,'Hola '+c.nombre+'!');return `<div class="pcard"><div class="mh"><div><b class="pname">${esc(c.nombre)}</b><div class="mute small">${[c.razon,c.cuit?'CUIT '+c.cuit:'',c.zona,c.tel].filter(Boolean).map(esc).join(' · ')}</div></div><div class="acts">${wa?`<a class="btn s" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} WhatsApp</a>`:''}<button class="btn s" data-act="verCli" data-id="${esc(c.id)}">Cuenta</button><button class="ib" data-act="editCli" data-id="${esc(c.id)}" aria-label="Editar">${ic('pencil')}</button></div></div><div class="chips"><span class="chip">${s.n} compras</span><span class="chip">${money(s.t)}</span>${s.u?`<span class="chip">Última: ${fday(s.u)}</span>`:''}${cc>0?`<span class="chip out">Debe ${money(cc)}</span>`:cc<0?`<span class="chip" style="color:var(--ok)">A favor ${money(-cc)}</span>`:''}${pp?`<span class="chip low">${pp} pedidos abiertos</span>`:''}</div>${c.nota?`<div class="mute small">${esc(c.nota)}</div>`:''}</div>`}).join('')}</div>`:'<div class="empty"><h2>Sin clientes</h2><p>Se agregan solos cuando ponés un nombre nuevo en una venta, o cargalos acá.</p></div>'}`};
ACT.cf=id=>{S.cf=S.cf===id?'':id;render(true)};
ACT.editCli=id=>{const c=D('clientes').find(x=>x.id===id)||{};S.cartOpen=false;open(`<div class="mh"><h2>${id?'Editar cliente':'Nuevo cliente'}</h2>${xBtn}</div><div class="f2"><label class="fl full">Nombre *<input id="kNom" value="${esc(c.nombre||'')}" autofocus></label><label class="fl">WhatsApp<input id="kTel" inputmode="tel" value="${esc(c.tel||'')}" placeholder="11 2345 6789"></label><label class="fl">Localidad o zona<input id="kZon" value="${esc(c.zona||'')}"></label><label class="fl">CUIT<input id="kCuit" value="${esc(c.cuit||'')}"></label><label class="fl">Razón social<input id="kRaz" value="${esc(c.razon||'')}"></label><label class="fl full">Nota<input id="kNot" value="${esc(c.nota||'')}" placeholder="Ej: manda por transporte"></label></div><div class="acts"><button class="btn p" data-act="saveCli" data-id="${esc(id)}" data-enter>Guardar</button>${id?`<button class="btn d" data-act="delCli" data-id="${esc(id)}">Borrar</button>`:''}</div>`)};
ACT.saveCli=async id=>{const g=s=>(box.querySelector(s)?.value||'').trim();const nombre=g('#kNom');if(!nombre)return toast('Poné el nombre');const old=D('clientes').find(x=>x.id===id);if(!id&&cliente(nombre))return toast('Ya existe un cliente con ese nombre');
 if(await guard(()=>put('clientes',id||uid(),{nombre,tel:g('#kTel'),zona:g('#kZon'),cuit:g('#kCuit'),razon:g('#kRaz'),nota:g('#kNot'),alta:old?.alta||new Date().toISOString()}))){close();toast('Cliente guardado')}};
ACT.delCli=id=>ask('¿Borrar cliente?','Sus ventas anteriores quedan guardadas.','Borrar',async()=>{if(await guard(()=>rm('clientes',id)))toast('Cliente borrado')});
ACT.verCli=id=>{const c=D('clientes').find(x=>x.id===id);if(!c)return;const cc=ctaCte(c.nombre);const vs=D('ventas').filter(v=>ckey(v.cliente)===ckey(c.nombre)).slice(0,30);S.cartOpen=false;
 open(`<div class="mh"><div><h2>${esc(c.nombre)}</h2><span class="mute small">${esc(c.tel||'')}</span></div>${xBtn}</div><div class="k4"><div class="kpi"><small>Saldo cuenta corriente</small><b class="${cc.saldo>0?'r':'g'}">${cc.saldo>0?'Debe '+money(cc.saldo):cc.saldo<0?'A favor '+money(-cc.saldo):money(0)}</b></div></div>
 <div class="panel"><h3>Registrar un pago</h3><div class="f2"><label class="fl">Monto<input id="ccM" inputmode="numeric" placeholder="0"></label><label class="fl">Cómo pagó<select id="ccMet">${Object.keys(C().metodos).map(m=>`<option>${m}</option>`).join('')}</select></label><label class="fl">Cuenta (si fue transferencia)<select id="ccCta"><option value="">—</option>${C().cuentas.map(q=>`<option>${esc(q.nombre)}</option>`).join('')}</select></label></div><button class="btn p" data-act="ccPago" data-id="${esc(id)}">Registrar pago</button></div>
 ${cc.mov.length?`<h3>Movimientos de la cuenta</h3><div class="rows">${cc.mov.slice(0,40).map(m=>`<div><span>${fday(m.f)} · ${esc(m.d)}</span><b class="${m.m>0?'neg':'okc'}">${m.m>0?'':'−'}${money(Math.abs(m.m))}</b></div>`).join('')}</div>`:''}
 <h3>Últimas compras</h3>${vs.length?`<div class="rows">${vs.map(v=>`<div><span>${fday(v.fecha)} · N° ${pad5(v.nro)} · ${N(v.unidades)} prendas · ${esc(v.pago)}${v.anulada?' · anulada':''}</span><b>${money(v.total)}</b></div>`).join('')}</div>`:'<p class="mute">Sin compras.</p>'}`,true)};
ACT.ccPago=async id=>{const c=D('clientes').find(x=>x.id===id);const m=num($('#ccM').value);if(!m)return toast('Poné el monto');if(await guard(()=>put('caja',uid(),{fecha:new Date().toISOString(),tipo:'Cobro cuenta',cliente:c.nombre,monto:m,metodo:$('#ccMet').value,cuenta:$('#ccMet').value==='Transferencia'?$('#ccCta').value:'',vendedor:vendedor()}))){toast('Pago registrado');ACT.verCli(id)}};

V.pedidos=()=>{const q=S.oq.trim().toLowerCase();const l=D('pedidos').filter(p=>(S.of==='Todos'||p.estado===S.of)&&(!q||[p.cliente,p.notas,...(p.items||[]).map(i=>i.nombre)].some(x=>String(x||'').toLowerCase().includes(q))));
 return `${backBtn()}<div class="mh hd1"><div><h1>Pedidos</h1><p class="mute">${D('pedidos').length} en total</p></div><button class="btn p" data-act="newPed">${ic('plus')} Nuevo pedido</button></div>
 ${sub('ptab',S.ptab||'ped',[['ped','Pedidos'],['pre','Presupuestos']])}${S.ptab==='pre'?presuView():`<div class="srch" style="margin-bottom:12px">${ic('search')}<input id="oq" type="search" placeholder="Buscar por nombre, cliente o notas…" value="${esc(S.oq)}"></div>${sub('of',S.of,[['Todos','Todos'],...ESTADOS.map(e=>[e,e])])}
 ${l.length?`<div class="list">${l.map(p=>{const saldo=N(p.total)-N(p.sena);const cl=cliente(p.cliente);const msg=avisoTxt(p);const wa=cl?.tel&&msg?waLink(cl.tel,msg):'';return `<div class="pcard"><div class="mh"><div><b class="pname">N° ${pad5(p.nro)} · ${esc(p.cliente||'Sin cliente')}</b><div class="mute small">${fdate(p.fecha)}${p.entrega?' · Entrega '+fday(p.entrega):''}${p.transporte?' · '+esc(p.transporte):''} · ${N(p.unidades)} prendas</div></div><span class="est ${esc(p.estado.split(' ')[0])}">${esc(p.estado)}</span></div>
 <div class="small">${grupoTxt(p.items)}</div>${p.notas?`<div class="mute small">${esc(p.notas)}</div>`:''}<div class="tot"><div><span>Total ${money(p.total)}${N(p.sena)?' · Seña '+money(p.sena):''}</span><b class="${saldo>0?'neg':''}">${saldo>0?'Saldo '+money(saldo):'Pagado'}</b></div></div>
 <div class="acts"><select data-pedest="${esc(p.id)}" aria-label="Estado" style="width:auto">${ESTADOS.map(e=>`<option ${e===p.estado?'selected':''}>${e}</option>`).join('')}</select>${!['Entregado','Cancelado'].includes(p.estado)?`<button class="btn s p" data-act="entregar" data-id="${esc(p.id)}">Entregar y cobrar</button>`:''}${wa?`<a class="btn s" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} Avisar</a>`:''}<button class="btn s" data-act="printPed" data-id="${esc(p.id)}">${ic('printer')}</button><button class="ib" data-act="editPed" data-id="${esc(p.id)}" aria-label="Editar">${ic('pencil')}</button><button class="ib" data-act="delPed" data-id="${esc(p.id)}" aria-label="Borrar">${ic('trash')}</button></div></div>`}).join('')}</div>`:'<div class="empty">No hay pedidos.</div>'}`}`};
const grupoTxt=items=>{const g={};(items||[]).forEach(i=>{(g[i.nombre]??=[]).push(vname(i.t,i.c)+'×'+N(i.cant))});return Object.entries(g).map(([n,v])=>`<b>${esc(n)}</b>: ${esc(v.join(', '))}`).join('<br>')};
const avisoTxt=p=>{const t=C().avisos[p.estado];return t?t.replace(/\{cliente\}/g,p.cliente||'').replace(/\{nro\}/g,pad5(p.nro)).replace(/\{saldo\}/g,money(N(p.total)-N(p.sena))).replace(/\{total\}/g,money(p.total)):''};
let PED=null;
ACT.newPed=()=>{PED={id:'',cliente:'',items:[],sena:'',senaMet:'Efectivo',estado:'Pendiente',entrega:'',transporte:'',notas:'',aCuenta:false,lista:S.lista};pedOpen()};
ACT.editPed=id=>{const p=D('pedidos').find(x=>x.id===id);if(!p)return;PED=JSON.parse(JSON.stringify({...p,sena:p.sena||''}));pedOpen()};
function pedOpen(){const c=C();const tot=sum(PED.items,i=>N(i.precio)*N(i.cant));S.cartOpen=false;
 open(`<div class="mh"><h2>${PED.id?'Editar pedido N° '+pad5(PED.nro):'Nuevo pedido'}</h2>${xBtn}</div><div class="f2"><label class="fl">Cliente<input id="pCli" list="dlc2" value="${esc(PED.cliente)}" autocomplete="off"><datalist id="dlc2">${D('clientes').map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist></label><label class="fl">Lista de precios<select id="pLis">${c.listas.map((l,i)=>`<option value="${i}" ${i===N(PED.lista)?'selected':''}>${esc(l)}</option>`).join('')}</select></label></div>
 <div class="fl">Productos<div class="srch">${ic('search')}<input id="pq2" placeholder="Buscar producto para agregar…" autocomplete="off"></div><div class="srchres" id="pres"></div></div>
 <div class="rows">${PED.items.length?grupos(PED.items.map((it,i)=>({it:{...it,id:it.art,px:it.precio},a:art(it.art)||{id:it.art,nombre:it.nombre}}))).map(g=>`<div><span><b>${esc(g.a.nombre)}</b> · ${money(g.it.px)} c/u<br><span class="vch">${g.ps.map(({it,i})=>`<span class="vc">${esc(vname(it.t,it.c))} ×${it.cant}<button data-act="pedDel" data-id="${i}" aria-label="Quitar">✕</button></span>`).join('')}</span></span><b>${money(sum(g.ps,p=>p.it.cant)*g.it.px)}</b></div>`).join(''):'<p class="mute">Todavía no agregaste productos.</p>'}<div><b class="tt">Total</b><b class="bigt">${money(tot)}</b></div></div>
 <div class="f2"><label class="fl">Seña / pagó a cuenta<input id="pSena" inputmode="numeric" value="${esc(PED.sena)}" placeholder="0"></label><label class="fl">Cómo pagó la seña<select id="pSM">${Object.keys(c.metodos).map(m=>`<option ${m===PED.senaMet?'selected':''}>${m}</option>`).join('')}</select></label><label class="fl">Fecha de entrega<input id="pEnt" type="date" value="${esc(PED.entrega)}"></label><label class="fl">Transporte<select id="pTr"><option value="">—</option>${c.transportes.map(t=>`<option ${t.n===PED.transporte?'selected':''}>${esc(t.n)}</option>`).join('')}</select></label><label class="fl">Estado<select id="pEst">${ESTADOS.map(e=>`<option ${e===PED.estado?'selected':''}>${e}</option>`).join('')}</select></label><label class="fl full">Notas<input id="pNot" value="${esc(PED.notas)}"></label></div>
 <div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn p big" data-act="savePed" style="flex:1">Guardar pedido</button></div>`,true)}
const pedRead=()=>{const g=s=>(box.querySelector(s)?.value??'').trim();PED.cliente=g('#pCli');PED.lista=+g('#pLis')||0;PED.sena=g('#pSena');PED.senaMet=g('#pSM');PED.entrega=g('#pEnt');PED.transporte=g('#pTr');PED.estado=g('#pEst')||PED.estado;PED.notas=g('#pNot')};
ACT.pedAdd=id=>{pedRead();const a=art(id);if(!a)return;const back=JSON.stringify(PED);open(`<div class="mh"><h2>${esc(a.nombre)}</h2><button class="x" data-act="pedBack">×</button></div>${vgrid(a,'in')}<div class="acts"><button class="btn" data-act="curva">+1 a cada talle</button><button class="btn p" data-act="pedAddOk" data-id="${esc(id)}" data-enter>Agregar al pedido</button></div>`);setTimeout(()=>box.querySelector('.vg input')?.focus(),40)};
ACT.pedBack=()=>pedOpen();
ACT.pedAddOk=id=>{const a=art(id);const g=leerGrid();const p=precioDe(a,N(PED.lista));for(const {t,c,q} of Object.values(g)){if(q<=0)continue;const ex=PED.items.find(x=>x.art===id&&x.t===t&&x.c===c);ex?ex.cant+=q:PED.items.push({art:id,codigo:a.codigo||'',nombre:a.nombre,linea:a.linea||'',t,c,cant:q,precio:p,costo:N(a.costo)})}pedOpen()};
ACT.pedDel=i=>{pedRead();PED.items.splice(+i,1);pedOpen()};
ACT.savePed=async()=>{pedRead();if(!PED.items.length)return toast('Agregá al menos un producto');const tot=sum(PED.items,i=>N(i.precio)*N(i.cant));const id=PED.id||uid();const nuevo=!PED.id;
 const data={nro:PED.nro||nextNro('pedidos'),fecha:PED.fecha||new Date().toISOString(),cliente:PED.cliente,items:PED.items,total:tot,unidades:sum(PED.items,i=>i.cant),sena:num(PED.sena),senaMet:PED.senaMet,entrega:PED.entrega,transporte:PED.transporte,notas:PED.notas,estado:PED.estado,lista:N(PED.lista),vendedor:vendedor()};
 if(await guard(()=>put('pedidos',id,data))){if(PED.cliente&&!cliente(PED.cliente))await guard(()=>put('clientes',uid(),{nombre:PED.cliente,alta:data.fecha}));close();toast(nuevo?`Pedido N° ${pad5(data.nro)} creado`:'Pedido guardado')}};
ACT.delPed=id=>ask('¿Borrar este pedido?','No se puede deshacer.','Borrar',async()=>{if(await guard(()=>rm('pedidos',id)))toast('Pedido borrado')});
ACT.entregar=id=>{const p=D('pedidos').find(x=>x.id===id);if(!p)return;const saldo=N(p.total)-N(p.sena);
 ask('¿Entregar el pedido N° '+pad5(p.nro)+'?',`Se descuenta el stock y se registra la venta. ${saldo>0?'Cobrás el saldo de '+money(saldo)+' en el siguiente paso.':'Ya está todo pagado.'}`,'Entregar',async()=>{
  S.cart=(p.items||[]).filter(i=>art(i.art)).map(i=>({id:i.art,t:i.t,c:i.c,cant:N(i.cant),px:N(i.precio)}));S.cli=p.cliente||'';S.credito=N(p.sena);S.pedidoEnCurso=p.id;ACT.tab('vender');render(true);setTimeout(()=>ACT.cobrar(),80)})};
document.addEventListener('change',async e=>{const s=e.target.closest?.('[data-pedest]');if(!s)return;const p=D('pedidos').find(x=>x.id===s.dataset.pedest);if(p&&await guard(()=>upd('pedidos',p.id,{estado:s.value}))){toast('Estado: '+s.value);const cl=cliente(p.cliente);if(cl?.tel&&C().avisos[s.value])toast('Tocá "Avisar" para mandarle el WhatsApp')}});

 open(`<div class="mh"><h2>Venta N° ${pad5(v.nro)}</h2>${xBtn}</div><p class="mute">${fdate(v.fecha)} · ${esc(v.cliente||'')} · Tocá lo que devuelve</p><div class="srchres">${(v.items||[]).map((i,k)=>`<button data-act="devFromV" data-id="${esc(v.id)}" data-k="${k}"><span><b>${esc(i.nombre)}</b> · ${esc(vname(i.t??i.talle,i.c))} × ${N(i.cant)} · ${money(i.precio)}</span></button>`).join('')}</div>`)};
ACT.devFromV=(id,b)=>{const v=saleById(id);const i=v.items[+b.dataset.k];const q=int(prompt2(i.cant));DEV.items.push({art:i.art,codigo:i.codigo,nombre:i.nombre,t:i.t??i.talle,c:i.c??'',cant:q||N(i.cant),precio:N(i.precio)});close();render(true)};

ACT.devPickOk=id=>{const a=art(id);const px=num($('#dPx').value);for(const {t,c,q} of Object.values(leerGrid()))if(q>0)DEV.items.push({art:id,codigo:a.codigo||'',nombre:a.nombre,t,c,cant:q,precio:px});close();render(true)};
ACT.devDel=k=>{devRead();DEV.items.splice(+k,1);render(true)};
ACT.devReg=async()=>{devRead();if(!DEV.items.length)return;if((DEV.cambio||DEV.por==='Saldo a favor')&&!DEV.cliente&&!DEV.cambio)return toast('Elegí el cliente para dejarlo a favor');
 const tot=sum(DEV.items,i=>N(i.precio)*N(i.cant));const nro=nextNro('devoluciones');const d={nro,fecha:new Date().toISOString(),items:DEV.items,total:tot,unidades:sum(DEV.items,i=>i.cant),cambio:DEV.cambio,por:DEV.cambio?'Cambio':DEV.por,cliente:DEV.cliente,motivo:DEV.motivo,venta:DEV.venta,dep:depVenta(),vendedor:vendedor(),anulada:false};const id=uid();
 if(!await guard(()=>put('devoluciones',id,d)))return;await aplicarItems(DEV.items,1,'Devolución',`Devolución N° ${pad5(nro)}`,depVenta());
 if(DEV.cliente&&!cliente(DEV.cliente))await guard(()=>put('clientes',uid(),{nombre:DEV.cliente,alta:d.fecha}));
 const imp=DEV.imprimir;DEV={items:[],cambio:false,por:'Efectivo',cliente:'',motivo:'',venta:'',imprimir:imp};
 if(imp)printDev({...d,id});
 if(d.cambio){S.credito=tot;S.cli=d.cliente;ACT.tab('vender');toast('Cambio registrado: elegí lo que se lleva')}else{render(true);toast(`Devolución N° ${pad5(nro)} registrada`)}};

ACT.printDev=id=>{const d=D('devoluciones').find(x=>x.id===id);if(d)printDev(d)};

 <div class="tw" style="max-height:50vh"><table class="t"><thead><tr><th></th><th>Producto</th><th class="n">${esc(C().listas[0])}</th><th class="n">Precio promo</th></tr></thead><tbody>${l.map(a=>{const on=PRO.precios[a.id]!=null;return `<tr><td><input type="checkbox" data-prck="${esc(a.id)}" ${on?'checked':''}></td><td>${esc(a.nombre)} <span class="mute small">${esc(a.codigo||'')}</span></td><td class="n">${money(precioBase(a,0))}</td><td class="n"><input data-prpx="${esc(a.id)}" inputmode="numeric" value="${on?N(PRO.precios[a.id]):''}" style="width:110px;text-align:right"></td></tr>`}).join('')}</tbody></table></div>

 if(await guard(()=>put('promos',id,{nombre:PRO.nombre,pct:PRO.pct,precios:PRO.precios,activa:old?.activa||false,creado:old?.creado||new Date().toISOString()}))){close();toast('Promoción guardada. Activala cuando quieras.')}};
ACT.togglePromo=async id=>{const p=D('promos').find(x=>x.id===id);if(p&&await guard(()=>upd('promos',id,{activa:!p.activa})))toast(p.activa?'Promoción apagada':'Promoción activa: ya se ve en Ventas')};

/* ================= REPORTES ================= */
const bars=(rows,fmt=x=>x+' u.')=>{if(!rows.length)return '<p class="mute">Sin datos en este período.</p>';const mx=Math.max(...rows.map(r=>r[1]))||1;return `<div class="bars">${rows.map(([l,v])=>`<div class="bar"><span class="bl" title="${esc(l)}">${esc(l)}</span><span class="bt"><i style="width:${Math.max(0,v/mx*100).toFixed(1)}%"></i></span><span class="bv">${esc(fmt(v))}</span></div>`).join('')}</div>`};
const top=(o,k=8)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,k);
const add=(o,k,v)=>o[k]=(o[k]||0)+v;
const vtot=v=>N(v.total)+N(v.sena);
function ventasR(){const r=rango(S.rper);return D('ventas').filter(v=>!v.anulada&&inR(v.fecha,r))}
V.reportes=()=>{const r=rango(S.rper);const vs=ventasR();const tot=sum(vs,vtot);const por={};vs.forEach(v=>add(por,v.pago||'—',N(v.total)));
 const head=`<div class="mh hd1"><div><h1>Reportes</h1><p class="mute">${PERS.find(p=>p[0]===S.rper)?.[1]||''} · ${vs.length} ventas</p></div><button class="btn" data-act="repDia">${ic('printer')} Reporte del día</button></div>${grp('rtab',S.rtab,[['Ventas','cart',[['ventas','Resumen'],['comparar','Comparación'],['ajustes','Descuentos y envíos']]],['Productos','box',[['productos','Más vendidos'],['ganancia','Ganancia'],['stockr','Stock valorizado'],['movs','Movimientos']]],['Personas','users',[['clientes','Clientes'],['vend','Vendedores'],['comisiones','Comisiones']]]])}${S.rtab==='stockr'?'':perSel('rper',S.rper)+rangoInputs()}`;
 if(RT[S.rtab])return head+RT[S.rtab]();
 if(S.rtab==='movs'){const ms=D('movs').filter(m=>inR(m.fecha,r));const by={};ms.forEach(m=>add(by,m.tipo,N(m.unidades)));return head+`<div class="k4">${Object.entries(by).map(([k,v])=>`<div class="kpi"><small>${esc(k)}</small><b class="${v<0?'r':'g'}">${v>0?'+':''}${v} u.</b></div>`).join('')||'<p class="mute">Sin movimientos.</p>'}</div>`+(ms.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Detalle</th><th class="n">Unidades</th></tr></thead><tbody>${ms.slice(0,400).map(m=>`<tr><td>${fdate(m.fecha)}</td><td>${esc(m.tipo)}<div class="mute small">${esc(m.ref||'')}</div></td><td>${esc(m.nombre)}</td><td class="small">${Object.entries(m.cambios||{}).map(([k,v])=>{const [t,c]=k.split('|');return esc(vname(t,c))+': '+(v>0?'+':'')+v}).join(' · ')}</td><td class="n ${N(m.unidades)<0?'neg':'okc'}">${N(m.unidades)>0?'+':''}${N(m.unidades)}</td></tr>`).join('')}</tbody></table></div>`:'')}
 if(S.rtab==='vend'){const by={};vs.forEach(v=>{const k=v.vendedor||'—';const o=by[k]||(by[k]={n:0,t:0,u:0});o.n++;o.t+=N(v.total);o.u+=N(v.unidades)});return head+`<div class="tw"><table class="t"><thead><tr><th>Vendedor</th><th class="n">Ventas</th><th class="n">Prendas</th><th class="n">Total</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].t-a[1].t).map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td class="n">${o.n}</td><td class="n">${o.u}</td><td class="n"><b>${money(o.t)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="mute">Sin ventas.</td></tr>'}</tbody></table></div>`}
 if(S.rtab==='productos'){const bA={},bT={},bC={},bL={},bCl={};let gan=0,anyCost=false;vs.forEach(v=>{if(v.cliente)add(bCl,v.cliente,N(v.total));(v.items||[]).forEach(i=>{const q=N(i.cant);add(bA,i.nombre,q);add(bT,'T'+(i.t??i.talle),q);if(i.c)add(bC,i.c,q);add(bL,i.linea||'Sin línea',q);if(N(i.costo)){anyCost=true;gan+=(N(i.precio)-N(i.costo))*q}})});
  return head+`<div class="cols2"><div class="panel"><h3>Lo más vendido</h3>${bars(top(bA,10))}</div><div class="panel"><h3>Por talle</h3>${bars(Object.entries(bT).sort((a,b)=>ncmp(a[0],b[0])))}</div><div class="panel"><h3>Por color</h3>${bars(top(bC,10))}</div><div class="panel"><h3>Por línea</h3>${bars(top(bL))}</div><div class="panel"><h3>Mejores clientes</h3>${bars(top(bCl,8),money)}</div><div class="panel"><h3>Ganancia bruta</h3><b class="bigt">${anyCost?money(gan):'—'}</b><p class="mute small">${anyCost?'Precio de venta menos costo, de los productos que tienen costo cargado.':'Cargá el costo en cada producto para verla.'}</p></div></div>`}
 const days={};vs.forEach(v=>add(days,dkey(v.fecha),N(v.total)));const dl=Object.entries(days).sort();const mx=Math.max(1,...dl.map(x=>x[1]));
 const ctas={};vs.filter(v=>v.pago==='Transferencia').forEach(v=>add(ctas,v.cuenta||'Sin cuenta',N(v.total)));
 return head+`<div class="k4"><div class="kpi"><small>Total del período</small><b class="b">${money(tot)}</b><small>${vs.length} ventas</small></div><div class="kpi"><small>Prendas vendidas</small><b>${sum(vs,v=>v.unidades)} u.</b></div>${['Efectivo','Tarjeta','Transferencia','Cuenta corriente'].map(m=>`<div class="kpi"><small>${m}</small><b class="${m==='Efectivo'?'g':''}">${money(por[m]||0)}</b>${m==='Transferencia'&&Object.keys(ctas).length?`<button class="lnk small" data-act="verCtas">Ver por cuenta</button>`:''}</div>`).join('')}</div>
 ${dl.length>1?`<div class="panel" style="margin-bottom:14px"><h3>Por día</h3><div class="days">${dl.slice(-31).map(([d,t],i,arr)=>`<div class="day" title="${esc(d)}: ${money(t)}"><i style="height:${(t/mx*85).toFixed(1)}%"></i><small class="${(arr.length-1-i)%2?'odd':''}">${+d.slice(8)}</small></div>`).join('')}</div></div>`:''}
 ${vs.length?`<div class="tw"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th class="n">Prendas</th><th class="n">Total</th><th></th></tr></thead><tbody>${D('ventas').filter(v=>inR(v.fecha,r)).map(v=>`<tr class="${v.anulada?'off':''}"><td>${pad5(v.nro)}</td><td>${fdate(v.fecha)}</td><td>${esc(v.cliente||'—')}<div class="mute small">${esc(v.vendedor||'')}</div></td><td>${esc(v.pago)}${v.cuenta?`<div class="mute small">${esc(v.cuenta)}</div>`:''}${v.anulada?'<div class="neg small">Anulada</div>':''}</td><td class="n">${N(v.unidades)}</td><td class="n"><b>${money(v.total)}</b></td><td><div class="acts" style="flex-wrap:nowrap"><button class="ib" data-act="verVenta" data-id="${esc(v.id)}" title="Ver">${ic('receipt')}</button><button class="ib" data-act="print" data-id="${esc(v.id)}" title="Ticket">${ic('printer')}</button>${v.anulada?'':`<button class="ib" data-act="editVenta" data-id="${esc(v.id)}" title="Editar">${ic('pencil')}</button><button class="ib" data-act="anular" data-id="${esc(v.id)}" title="Anular">${ic('trash')}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">'+ic('chart')+'<p>No hay ventas en este período</p></div>'}`};
ACT.verCtas=()=>{const ctas={};ventasR().filter(v=>v.pago==='Transferencia').forEach(v=>add(ctas,v.cuenta||'Sin cuenta',N(v.total)));open(`<div class="mh"><h2>Transferencias por cuenta</h2>${xBtn}</div><div class="rows">${top(ctas,50).map(([k,v])=>`<div><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')}</div>`)};
ACT.verVenta=id=>{const v=saleById(id);if(!v)return;open(`<div class="mh"><h2>Venta N° ${pad5(v.nro)}</h2>${xBtn}</div><p class="mute">${fdate(v.fecha)} · ${esc(v.cliente||'Sin cliente')} · ${esc(v.pago)}${v.cuenta?' ('+esc(v.cuenta)+')':''} · ${esc(v.vendedor||'')}${v.anulada?' · ANULADA':''}</p><div class="small">${grupoTxt(v.items)}</div><div class="rows">${N(v.descuento)?`<div><span>Descuento</span><span>−${money(v.descuento)}</span></div>`:''}${N(v.credito)?`<div><span>A favor</span><span>−${money(v.credito)}</span></div>`:''}${N(v.envio)?`<div><span>Envío ${esc(v.transporte||'')}</span><span>${money(v.envio)}</span></div>`:''}<div><b class="tt">Total</b><b class="bigt">${money(v.total)}</b></div></div>${v.nota?`<p class="mute">Nota: ${esc(v.nota)}</p>`:''}<div class="acts"><button class="btn" data-act="print" data-id="${esc(v.id)}">${ic('printer')} Ticket</button><button class="btn" data-act="copyV" data-id="${esc(v.id)}">Copiar resumen</button></div>`)};
function repDiaTxt(){const vs=D('ventas').filter(v=>!v.anulada&&dkey(v.fecha)===today());const por={};vs.forEach(v=>add(por,v.pago,N(v.total)));const ctas={};vs.filter(v=>v.pago==='Transferencia').forEach(v=>add(ctas,v.cuenta||'Sin cuenta',N(v.total)));
 const dv=D('devoluciones').filter(d=>!d.anulada&&dkey(d.fecha)===today());const gs=D('gastos').filter(g=>dkey(g.fecha)===today());const cj=cajaDia(today());
 return{vs,por,ctas,dv,gs,cj,lines:[`${C().negocio} — Reporte del día ${fday(new Date())}`,'',`Ventas: ${vs.length} · Prendas: ${sum(vs,v=>v.unidades)}`,`Total vendido: ${money(sum(vs,vtot))}`,...Object.entries(por).map(([k,v])=>`  ${k}: ${money(v)}`),...Object.entries(ctas).map(([k,v])=>`    → ${k}: ${money(v)}`),`Devoluciones: ${dv.length} · ${money(sum(dv,d=>d.total))}`,`Gastos: ${money(sum(gs,g=>g.monto))}`,`Efectivo en caja: ${money(cj.queda)}`]}}
ACT.repDia=()=>{const r=repDiaTxt();open(`<div class="mh"><h2>Reporte del día</h2>${xBtn}</div><pre style="white-space:pre-wrap;font:15px/1.5 inherit;background:var(--soft);padding:14px;border-radius:14px">${esc(r.lines.join('\n'))}</pre><div class="acts">${PRINT?`<button class="btn p" data-act="printRep">${ic('printer')} Imprimir</button>`:''}<button class="btn" data-act="copyRep">Copiar</button></div>`)};
ACT.copyRep=()=>copiar(repDiaTxt().lines.join('\n'),'Reporte copiado');
ACT.printRep=()=>{close();printHtml(`<div class="tk"><div class="tkn">${esc(C().negocio)}</div><div class="tkc">Reporte del día</div><div class="tkl"></div>${repDiaTxt().lines.slice(2).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`)};

/* ================= GASTOS / FINANZAS ================= */
function cajaMovs(){const out=[];D('ventas').forEach(v=>{if(!v.anulada&&v.pago==='Efectivo')out.push({f:v.fecha,m:N(v.total),d:'Venta N° '+pad5(v.nro)})});
 D('caja').forEach(c=>{if(c.anulado)return;if(c.tipo==='Cobro cuenta'&&c.metodo==='Efectivo')out.push({f:c.fecha,m:N(c.monto),d:'Pago de '+c.cliente});if(c.tipo==='Ingreso')out.push({f:c.fecha,m:N(c.monto),d:'Ingreso: '+(c.nota||'')});if(c.tipo==='Retiro')out.push({f:c.fecha,m:-N(c.monto),d:'Retiro: '+(c.nota||'')})});
 D('pedidos').forEach(p=>{if(N(p.sena)&&p.senaMet==='Efectivo'&&p.estado!=='Cancelado')out.push({f:p.fecha,m:N(p.sena),d:'Seña pedido N° '+pad5(p.nro)})});
 D('devoluciones').forEach(d=>{if(!d.anulada&&d.por==='Efectivo')out.push({f:d.fecha,m:-N(d.total),d:'Devolución N° '+pad5(d.nro)})});
 D('gastos').forEach(g=>{if(g.metodo==='Efectivo')out.push({f:g.fecha,m:-N(g.monto),d:'Gasto: '+g.concepto})});
 D('caja').forEach(c=>{if(c.anulado)return;if(c.tipo==='Ajuste arqueo')out.push({f:c.fecha,m:N(c.monto),d:'Diferencia de arqueo'});if(c.tipo==='Pago proveedor'&&c.metodo==='Efectivo')out.push({f:c.fecha,m:-N(c.monto),d:'Pago a '+c.proveedor})});
 D('cheques').forEach(q=>{if(q.estado==='Cobrado'&&q.tipo==='tercero')out.push({f:q.fechaEstado||q.fecha,m:N(q.importe),d:'Cheque cobrado'})});return out}
function cajaDia(day){const ms=cajaMovs();const ini=sum(ms.filter(m=>dkey(m.f)<day),m=>m.m);const hoy=ms.filter(m=>dkey(m.f)===day);return{ini,ent:sum(hoy.filter(m=>m.m>0),m=>m.m),sal:sum(hoy.filter(m=>m.m<0),m=>-m.m),queda:ini+sum(hoy,m=>m.m),hoy}}
V.gastos=()=>{const day=S.gday;const head=`${backBtn()}<div class="mh hd1"><div><h1>Finanzas</h1><p class="mute">Gastos, caja y utilidad neta</p></div>${S.gtab==='dia'?`<div class="acts"><button class="ib" data-act="gday" data-id="-1" aria-label="Día anterior">${ic('back')}</button><input type="date" id="gdayIn" value="${esc(day)}" style="width:auto"><button class="ib" data-act="gday" data-id="1" aria-label="Día siguiente" ${day>=today()?'disabled':''}>${ic('chev')}</button></div>`:''}</div>${grp('gtab',S.gtab,[['Caja','wallet',[['dia','Caja del día'],['cierres','Cierres']]],['Gastos y ganancia','chart',[['gastos','Gastos'],['util','Utilidad neta']]],['Banco','bank',[['bancos','Cuentas'],['cheques','Cheques']]]])}`;
 if(GT[S.gtab])return head+GT[S.gtab]();
 if(S.gtab==='gastos'){const r=rango(S.rper);const gs=D('gastos').filter(g=>inR(g.fecha,r));const by={};gs.forEach(g=>add(by,g.cat||'Otros',N(g.monto)));return head+perSel('rper',S.rper)+rangoInputs()+`<div class="k4"><div class="kpi"><small>Total gastos</small><b class="r">${money(sum(gs,g=>g.monto))}</b></div>${top(by,6).map(([k,v])=>`<div class="kpi"><small>${esc(k)}</small><b>${money(v)}</b></div>`).join('')}</div><button class="btn p" data-act="newGasto" style="margin-bottom:12px">${ic('plus')} Anotar gasto</button>${gs.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Pago</th><th class="n">Monto</th><th></th></tr></thead><tbody>${gs.map(g=>`<tr><td>${fday(g.fecha)}</td><td>${esc(g.concepto)}</td><td>${esc(g.cat||'')}</td><td>${esc(g.metodo||'')}</td><td class="n neg"><b>${money(g.monto)}</b></td><td><button class="ib" data-act="delGasto" data-id="${esc(g.id)}" aria-label="Borrar">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="mute">No hay gastos en este período.</p>'}`}
 if(S.gtab==='util'){const r=rango(S.rper);const vs=ventasR();const ing=sum(vs,vtot);const costo=sum(vs,v=>sum(v.items||[],i=>N(i.costo)*N(i.cant)));const dv=sum(D('devoluciones').filter(d=>!d.anulada&&!d.cambio&&inR(d.fecha,r)),d=>d.total);const gs=sum(D('gastos').filter(g=>inR(g.fecha,r)),g=>g.monto);const neto=ing-dv-costo-gs;
  return head+perSel('rper',S.rper)+rangoInputs()+`<div class="panel"><div class="rows"><div><span>+ Ventas</span><b>${money(ing)}</b></div><div><span>− Devoluciones</span><b class="neg">${money(dv)}</b></div><div><span>− Costo de la mercadería vendida</span><b class="neg">${money(costo)}</b></div><div><span>− Gastos</span><b class="neg">${money(gs)}</b></div><div><b class="tt">= Utilidad neta</b><b class="bigt ${neto<0?'neg':'okc'}">${money(neto)}</b></div></div>${costo?'':'<p class="mute small">Para que sea exacta, cargá el costo de cada producto.</p>'}</div>`}
 const vs=D('ventas').filter(v=>!v.anulada&&dkey(v.fecha)===day);const ing=sum(vs,vtot);const gs=D('gastos').filter(g=>dkey(g.fecha)===day);const gt=sum(gs,g=>g.monto);const cj=cajaDia(day);
 return head+`<h3 style="margin-bottom:10px">${day===today()?'Hoy — ':''}${new Date(day+'T12:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="k4"><div class="kpi"><small>Ventas del día</small><b class="b">${money(ing)}</b></div><div class="kpi"><small>Gastos del día</small><b class="r">${money(gt)}</b></div><div class="kpi"><small>Neto del día</small><b class="${ing-gt<0?'r':'g'}">${money(ing-gt)}</b></div></div>
 <div class="cols2"><div class="panel"><h3>Resumen del día</h3><div class="rows"><div><span>+ Ventas</span><span>${money(ing)}</span></div><div><span>− Gastos pagados</span><span class="neg">${money(gt)}</span></div><div><b>= Neto del día</b><b>${money(ing-gt)}</b></div></div></div>
 <div class="panel"><div class="mh"><h3>${ic('cash')} Efectivo en caja</h3><div class="acts"><button class="btn s" data-act="cajaMov" data-id="Ingreso">Ingresar efectivo</button><button class="btn s" data-act="cajaMov" data-id="Retiro">Retirar de caja</button>${day===today()?`<button class="btn s p" data-act="cerrarCaja">${ic('lock')} Cerrar caja</button>`:''}</div></div><div class="rows"><div><span>Efectivo inicial</span><span>${money(cj.ini)}</span></div><div><span>+ Entró en efectivo</span><span>${money(cj.ent)}</span></div><div><span>− Salió en efectivo</span><span class="neg">${money(cj.sal)}</span></div><div><b class="tt">= Queda en caja</b><b class="bigt okc">${money(cj.queda)}</b></div></div>${cj.hoy.length?`<details><summary class="lnk">Ver movimientos</summary><div class="rows">${cj.hoy.map(m=>`<div><span>${fhora(m.f)} · ${esc(m.d)}</span><b class="${m.m<0?'neg':''}">${money(m.m)}</b></div>`).join('')}</div></details>`:''}</div></div>
 ${medioTabla(day)}<button class="btn p" data-act="newGasto" style="margin:14px 0">${ic('plus')} Anotar gasto de este día</button>${gs.length?`<div class="rows panel">${gs.map(g=>`<div><span>${esc(g.concepto)} <span class="mute small">${esc(g.cat||'')} · ${esc(g.metodo||'')}</span></span><span><b class="neg">${money(g.monto)}</b> <button class="lnk" data-act="delGasto" data-id="${esc(g.id)}">borrar</button></span></div>`).join('')}</div>`:''}`};
ACT.gday=d=>{const t=new Date(S.gday+'T12:00');t.setDate(t.getDate()+(+d));const k=dkey(t);if(k<=today()){S.gday=k;render(true)}};
ACT.newGasto=()=>{const c=C();open(`<div class="mh"><h2>Anotar gasto</h2>${xBtn}</div><div class="f2"><label class="fl full">Concepto<input id="gC" placeholder="Ej: Luz, flete, taller" autofocus></label><label class="fl">Monto<input id="gM" inputmode="numeric" placeholder="0"></label><label class="fl">Categoría<select id="gCat">${c.gcats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="fl">Cómo se pagó<select id="gMet">${Object.keys(c.metodos).map(m=>`<option>${m}</option>`).join('')}</select></label><label class="fl">Cuenta (si fue transferencia)<select id="gCta"><option value="">—</option>${c.cuentas.map(q=>`<option>${esc(q.nombre)}</option>`).join('')}</select></label><label class="fl">Fecha<input id="gF" type="date" value="${S.tab==='gastos'&&S.gtab==='dia'?S.gday:today()}"></label></div><div class="acts"><button class="btn p" data-act="saveGasto" data-enter>Guardar</button></div>`)};
ACT.saveGasto=async()=>{const m=num($('#gM').value);const con=$('#gC').value.trim();if(!con||!m)return toast('Poné concepto y monto');const f=$('#gF').value||today();const fecha=f===today()?new Date().toISOString():new Date(f+'T12:00').toISOString();
 if(await guard(()=>put('gastos',uid(),{fecha,concepto:con,monto:m,cat:$('#gCat').value,metodo:$('#gMet').value,cuenta:$('#gMet').value==='Transferencia'?$('#gCta').value:'',vendedor:vendedor()}))){close();toast('Gasto anotado')}};
ACT.delGasto=id=>ask('¿Borrar este gasto?','','Borrar',async()=>{if(await guard(()=>rm('gastos',id)))toast('Gasto borrado')});
ACT.cajaMov=t=>open(`<div class="mh"><h2>${t==='Ingreso'?'Ingresar efectivo':'Retirar de caja'}</h2>${xBtn}</div><div class="f2"><label class="fl">Monto<input id="cjM" inputmode="numeric" autofocus></label><label class="fl">Motivo<input id="cjN" placeholder="${t==='Ingreso'?'Ej: cambio inicial':'Ej: retiro para depósito'}"></label></div><div class="acts"><button class="btn p" data-act="saveCaja" data-id="${t}" data-enter>Guardar</button></div>`);
ACT.saveCaja=async t=>{const m=num($('#cjM').value);if(!m)return toast('Poné el monto');if(await guard(()=>put('caja',uid(),{fecha:new Date().toISOString(),tipo:t,monto:m,nota:$('#cjN').value.trim(),vendedor:vendedor()}))){close();toast(t==='Ingreso'?'Efectivo ingresado':'Retiro anotado')}};
