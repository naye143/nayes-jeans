V.config=()=>{const c=C();const T=c.ticket;const tabs=[['general','General'],['cobros','Cobros y envíos'],['tickets','Tickets e impresora'],['equipo','Equipo'],['datos','Excel y copias'],['factura','Facturación']];let body='';
 if(S.ctab==='general')body=`<div class="cols2"><div class="panel"><h3>Negocio</h3><label class="fl">Nombre<input id="cNeg" value="${esc(c.negocio)}"></label><div class="fl">Nombres de las 4 listas de precios<div class="f2">${c.listas.map((l,i)=>`<input id="cL${i}" value="${esc(l)}" placeholder="Precio ${i+1}" aria-label="Lista ${i+1}">`).join('')}</div></div><label class="fl">Aviso de stock bajo: alertar cuando el producto tenga ≤<input id="cMin" inputmode="numeric" value="${c.minimo}"></label><label class="swt"><input type="checkbox" id="cNegv" ${c.negativo?'checked':''}> Permitir vender sin stock (queda en negativo)</label><div class="fl">Depósitos (el primero es el principal)${chipsF('dep',c.depositos,'Ej: Depósito, y Enter…')}</div><div class="fl">Llevan solo cantidad por color, sin talles${chipsF('dsim',c.depSimple,'Ej: Local, y Enter…')}<span class="hint">Los demás depósitos llevan el stock talle por talle.</span></div>${c.depositos.length>1?`<label class="fl">Esta compu vende desde<select id="cDepV">${c.depositos.map(d=>`<option ${d===depVenta()?'selected':''}>${esc(d)}</option>`).join('')}</select></label>`:''}<label class="fl">Reposición: avisar cuando un talle/color tenga ≤<input id="cMinV" inputmode="numeric" value="${c.minVar}"></label><h3>Reglas de precios</h3><p class="mute small">Si un producto no tiene cargado un precio, se calcula solo con este % sobre ${esc(c.listas[0])}. Vacío = no calcular.</p>${[1,2,3].map(i=>`<label class="fl">${esc(c.listas[i])}: % sobre ${esc(c.listas[0])}<input id="cRg${i}" inputmode="decimal" value="${c.reglas[i]??''}" placeholder="Ej: 20"></label>`).join('')}</div>
 <div class="panel"><h3>Impuesto</h3><label class="swt"><input type="checkbox" id="cImpOn" ${c.impuesto.on?'checked':''}> Sumar impuesto en cada venta</label><label class="fl">Porcentaje<input id="cImpP" inputmode="decimal" value="${N(c.impuesto.pct)}"></label><h3>Talles rápidos</h3><p class="mute small">Aparecen como botones al cargar un producto.</p>${rowsF('pre',c.presets,['Nombre','Talles'])}<h3 style="margin-top:10px">Modelos y su código</h3><p class="mute small">El código arma el código del producto (BER1, BER2…).</p>${rowsF('mod',c.modelos,['Código','Nombre'])}</div></div><button class="btn p big" data-act="saveCfg" data-id="general" style="margin-top:14px">Guardar cambios</button>`;
 if(S.ctab==='cobros')body=`<h3 style="margin-bottom:8px">Métodos de pago: recargos o descuentos</h3><div class="cols2">${Object.entries(c.metodos).map(([k,m])=>`<div class="panel"><div class="mh"><b>${k}</b><label class="swt"><input type="checkbox" data-mon="${k}" ${m.on?'checked':''}> Activo</label></div><label class="fl">Ajuste de precio<select data-maj="${k}">${[['ninguno','Ninguno'],['recargo','Recargo'],['descuento','Descuento']].map(([v,t])=>`<option value="${v}" ${m.aj===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="fl">Porcentaje<input data-mpct="${k}" inputmode="decimal" value="${N(m.pct)}"></label></div>`).join('')}<div class="panel"><b>Cobro en dólares</b><label class="swt"><input type="checkbox" id="cUsd" ${c.usd.on?'checked':''}> Al cobrar en efectivo se puede recibir dólares (el vuelto se da en pesos)</label><label class="fl">Cotización: 1 USD =<input id="cUsdC" inputmode="numeric" value="${N(c.usd.cot)}"></label></div></div>
 <div class="panel" style="margin-top:14px"><div class="mh"><div><h3>Cuentas para transferencias</h3><p class="mute small">Al cobrar por transferencia elegís a cuál entró la plata, y el reporte la separa por cuenta.</p></div><button class="btn s" data-act="cuentaEdit">${ic('plus')} Nueva</button></div><div class="rows">${c.cuentas.map((q,i)=>`<div><span><b>${esc(q.nombre)}</b><br><span class="mute small">${esc([q.banco,q.titular,q.alias].filter(Boolean).join(' · '))}</span></span><span class="acts"><button class="sw ${q.activa!==false?'on':''}" data-act="cuentaToggle" data-id="${i}"><i></i>${q.activa!==false?'Activa':'Inactiva'}</button><button class="ib" data-act="cuentaEdit" data-id="${i}" aria-label="Editar">${ic('pencil')}</button><button class="ib" data-act="cuentaDel" data-id="${i}" aria-label="Borrar">${ic('trash')}</button></span></div>`).join('')||'<p class="mute">Todavía no cargaste cuentas.</p>'}</div></div>
 <div class="panel" style="margin-top:14px"><h3>Métodos de transporte</h3><p class="mute small">Costo fijo opcional, se suma al total de la venta.</p>${rowsF('tr',c.transportes,['Transporte','Costo'])}</div><button class="btn p big" data-act="saveCfg" data-id="cobros" style="margin-top:14px">Guardar cambios</button>`;
 if(S.ctab==='tickets')body=`<div class="cols2"><div class="panel"><h3>Ticket</h3><label class="fl">Papel<select id="tAn"><option value="58" ${T.ancho==='58'?'selected':''}>Ticketera 58 mm</option><option value="80" ${T.ancho==='80'?'selected':''}>Ticketera 80 mm</option><option value="A4" ${T.ancho==='A4'?'selected':''}>Hoja A4 / PDF</option></select></label><label class="fl">Agrupar renglones<select id="tAg"><option value="variante" ${T.agrupar==='variante'?'selected':''}>Sin agrupar (una fila por talle y color)</option><option value="modelo" ${T.agrupar==='modelo'?'selected':''}>Por modelo (talles debajo)</option><option value="resumen" ${T.agrupar==='resumen'?'selected':''}>Solo el modelo y la cantidad</option></select></label><label class="fl">Dirección / primera línea<input id="tEn" value="${esc(T.encabezado)}"></label><label class="fl">WhatsApp del local<input id="tTel" value="${esc(T.tel)}"></label><label class="fl">Instagram<input id="tIg" value="${esc(T.ig)}" placeholder="@nayesjeans"></label><label class="fl">Mensaje al final<input id="tPie" value="${esc(T.pie)}"></label><label class="swt"><input type="checkbox" id="tLogo" ${T.logo?'checked':''}> Mostrar el logo</label><label class="swt"><input type="checkbox" id="tPreg" ${T.preguntar?'checked':''}> Preguntar "¿Imprimir ticket?" al cobrar</label><label class="swt"><input type="checkbox" id="tAuto" ${T.auto?'checked':''}> Imprimir siempre sin preguntar</label><div class="acts"><button class="btn p" data-act="saveCfg" data-id="tickets">Guardar</button>${PRINT?`<button class="btn" data-act="testPrint">${ic('printer')} Ticket de prueba</button>`:''}</div></div>
 <div class="panel"><h3>Avisos por WhatsApp de pedidos</h3><p class="mute small">Mensaje que se arma al tocar "Avisar" en un pedido. Podés usar {cliente} {nro} {saldo} {total}. Dejalo vacío para no avisar en ese estado.</p>${ESTADOS.map(e=>`<label class="fl">${e}<input data-aviso="${esc(e)}" value="${esc(c.avisos[e]||'')}"></label>`).join('')}<label class="fl">Alias / CBU para mandar con el saldo de un pedido<input id="tAli" value="${esc(T.alias)}" placeholder="No se imprime en el ticket"></label><h3>Conectar la ticketera</h3><ol class="steps"><li>Enchufala por USB y prendela.</li><li>Instalá su programa (driver).</li><li>En Windows ponela como <b>impresora predeterminada</b>.</li><li>Elegí acá 58 u 80 mm y probá con "Ticket de prueba".</li></ol>${PRINT?'':'<p class="note">Para imprimir usá la versión instalada en la compu.</p>'}</div></div>`;
 if(S.ctab==='equipo')body=`<div class="panel"><h3>Usuarios</h3><p class="mute small">Cada venta queda con el nombre de quien la hizo. Un <b>vendedor</b> puede vender, cargar clientes y pedidos, pero no ve reportes, finanzas, compras, stock ni configuración, ni puede borrar o anular. El PIN se pide para entrar como ese usuario (evita errores; no es una clave bancaria).</p><div class="tw"><table class="t"><thead><tr><th>Nombre</th><th>Rol</th><th>PIN</th><th class="n">Comisión %</th></tr></thead><tbody id="usrRows">${(c.usuarios.length?c.usuarios:c.vendedores.map((v,i)=>({nombre:v,rol:'dueño'}))).concat([{},{}]).map(u=>`<tr><td><input data-u="nombre" value="${esc(u.nombre||'')}" placeholder="Nombre"></td><td><select data-u="rol"><option value="dueño" ${u.rol!=='vendedor'?'selected':''}>Dueño</option><option value="vendedor" ${u.rol==='vendedor'?'selected':''}>Vendedor</option></select></td><td><input data-u="pin" type="password" inputmode="numeric" value="${esc(u.pin||'')}" placeholder="Sin PIN" style="width:110px" autocomplete="off"></td><td class="n"><input data-u="comision" inputmode="decimal" value="${u.comision??''}" style="width:80px;text-align:right"></td></tr>`).join('')}</tbody></table></div><label class="fl">Quién está vendiendo en esta compu<select id="cVenAct">${c.vendedores.map(v=>`<option ${v===vendedor()?'selected':''}>${esc(v)}</option>`).join('')}</select></label><div class="fl">Categorías de gastos${chipsF('gc',c.gcats,'Ej: Publicidad, y Enter…')}</div><button class="btn p" data-act="saveCfg" data-id="equipo">Guardar</button></div>`;
 if(S.ctab==='datos')body=`<div class="cols2"><div class="panel"><h3>${NUBE?'Instalar en otro equipo':LOCAL?'Actualizaciones':'Programa para la compu'}</h3><p class="mute">Versión ${APP_VER}. ${NUBE?'Se actualiza sola cada vez que la abrís con internet.':LOCAL?'Si sale una nueva, aparece un aviso arriba.':'Bajá el instalador para usarla sin internet.'}</p><div class="acts"><button class="btn" data-act="updInfo">${ic('download')} ${NUBE?'Cómo instalar':LOCAL?'Ver actualizaciones':'Descargar para la compu'}</button></div></div><div class="panel"><h3>Bajar a Excel</h3><p class="mute">Los .csv se abren con Excel.</p><div class="acts"><button class="btn" data-act="exp" data-id="stock">Productos y stock</button><button class="btn" data-act="exp" data-id="ventas">Ventas</button><button class="btn" data-act="exp" data-id="clientes">Clientes</button><button class="btn" data-act="exp" data-id="gastos">Gastos</button></div></div><div class="panel"><h3>Copia de seguridad</h3><p class="mute">${NUBE?'Todo se guarda en la nube de Google. Igual conviene bajar una copia cada tanto.':LOCAL?'Todo se guarda en esta compu. Bajá una copia cada semana a un pendrive o a tu Drive.':'Una copia completa de todo, por las dudas.'}</p><div class="acts"><button class="btn p" data-act="exp" data-id="backup">${ic('download')} Bajar copia (.json)</button>${PRINT?`<label class="btn">${ic('upload')} Restaurar copia<input type="file" accept=".json,application/json" id="impJson" hidden></label>`:''}</div></div><div class="panel"><h3>Pasar productos desde Deam o Excel</h3><p class="mute small">Subí el .csv desde Productos › Importar CSV. Columnas: <code>codigo; nombre; precio; precio2; precio3; precio4; costo; talles; colores; linea</code>. Talles y colores separados por espacio o "/".</p><button class="btn" data-act="exp" data-id="plantilla">Bajar plantilla</button></div></div>`;
 if(S.ctab==='factura')body=`<div class="panel"><h3>Factura electrónica (ARCA)</h3><p>Esta app no puede emitir facturas electrónicas: necesita el certificado digital y una conexión con ARCA que acá no es posible. Los tickets dicen "Documento no válido como factura". Para facturar seguí usando el sistema de ARCA o el que uses hoy.</p></div>`;
 return `${backBtn()}<h1 class="hd1">Configuración</h1>${sub('ctab',S.ctab,tabs)}${body}`};

function parseCSV(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':(first.includes('\t')?'\t':',');const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
 if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

function presuView(){const l=D('presupuestos');return l.length?`<div class="list">${l.map(p=>`<div class="pcard"><div class="mh"><div><b class="pname">N° ${pad5(p.nro)} · ${esc(p.cliente||'Sin cliente')}</b><div class="mute small">${fdate(p.fecha)} · ${N(p.unidades)} prendas · ${esc(p.lista||'')}</div></div><b class="price">${money(p.total)}</b></div><div class="small">${grupoTxt(p.items)}</div><div class="acts"><button class="btn s p" data-act="presuAVenta" data-id="${esc(p.id)}">Pasar a venta</button><button class="btn s" data-act="copyPresu" data-id="${esc(p.id)}">Copiar</button>${PRINT?`<button class="btn s" data-act="printPresu" data-id="${esc(p.id)}">${ic('printer')}</button>`:''}<button class="ib" data-act="delPresu" data-id="${esc(p.id)}" aria-label="Borrar">${ic('trash')}</button></div></div>`).join('')}</div>`:'<div class="empty">No hay presupuestos. Armalos desde el carrito de Ventas con el botón "Presupuesto".</div>'}

/* ---- compras y proveedores ---- */
function saldoProv(nombre){const k=ckey(nombre);let s=0;D('compras').forEach(c=>{if(ckey(c.proveedor)!==k||c.anulada)return;s+=c.tipo==='Nota de crédito'?-N(c.total):N(c.total)});D('caja').forEach(c=>{if(c.tipo==='Pago proveedor'&&ckey(c.proveedor)===k&&!c.anulado)s-=N(c.monto)});return s}
V.compras=()=>{const t=S.ctab2||'comp';const head=`${backBtn()}<div class="mh hd1"><div><h1>Compras</h1><p class="mute">Taller, telas, avíos y proveedores</p></div><div class="acts"><button class="btn p" data-act="newCompra" data-id="Factura">${ic('plus')} Nueva compra</button><button class="btn" data-act="newPago">${ic('cash')} Nuevo pago</button><button class="btn s" data-act="newCompra" data-id="Nota de crédito">Nota de crédito</button><button class="btn s" data-act="newCompra" data-id="Nota de débito">Nota de débito</button></div></div>${sub('ctab2',t,[['comp','Comprobantes'],['prov','Proveedores'],['saldos','Saldos'],['pagos','Pagos']])}`;
 if(t==='prov'){const l=D('proveedores');return head+`<button class="btn p" data-act="editProv" style="margin-bottom:12px">${ic('plus')} Nuevo proveedor</button>`+(l.length?`<div class="list">${l.map(p=>`<div class="pcard"><div class="mh"><div><b class="pname">${esc(p.nombre)}</b><div class="mute small">${[p.rubro,p.cuit?'CUIT '+p.cuit:'',p.tel].filter(Boolean).map(esc).join(' · ')}</div></div><div class="acts"><span class="chip ${saldoProv(p.nombre)>0?'out':''}">Le debés ${money(Math.max(0,saldoProv(p.nombre)))}</span><button class="ib" data-act="editProv" data-id="${esc(p.id)}" aria-label="Editar">${ic('pencil')}</button></div></div></div>`).join('')}</div>`:'<div class="empty">Todavía no cargaste proveedores (talleres, telas, avíos…).</div>')}
 if(t==='saldos'){const l=D('proveedores').map(p=>({p,s:saldoProv(p.nombre)})).sort((a,b)=>b.s-a.s);return head+`<div class="k4"><div class="kpi"><small>Total que debés a proveedores</small><b class="r">${money(sum(l,x=>Math.max(0,x.s)))}</b></div></div><div class="tw"><table class="t"><thead><tr><th>Proveedor</th><th class="n">Saldo</th><th></th></tr></thead><tbody>${l.map(({p,s})=>`<tr><td><b>${esc(p.nombre)}</b></td><td class="n ${s>0?'neg':'okc'}"><b>${s>0?'Debés '+money(s):s<0?'A favor '+money(-s):money(0)}</b></td><td><button class="btn s" data-act="newPago" data-id="${esc(p.nombre)}">Pagar</button></td></tr>`).join('')||'<tr><td class="mute" colspan="3">Sin proveedores.</td></tr>'}</tbody></table></div>`}
 if(t==='pagos'){const l=D('caja').filter(c=>c.tipo==='Pago proveedor');return head+(l.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Proveedor</th><th>Cómo</th><th class="n">Monto</th><th></th></tr></thead><tbody>${l.map(c=>`<tr class="${c.anulado?'off':''}"><td>${fdate(c.fecha)}</td><td>${esc(c.proveedor)}</td><td>${esc(c.metodo)}${c.cuenta?' · '+esc(c.cuenta):''}${c.anulado?' · anulado':''}</td><td class="n"><b>${money(c.monto)}</b></td><td>${c.anulado?'':`<button class="ib" data-act="anularPago" data-id="${esc(c.id)}" aria-label="Anular">${ic('trash')}</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mute">No hay pagos.</p>')}
 const l=D('compras');return head+(l.length?`<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Proveedor</th><th>N°</th><th class="n">Prendas</th><th class="n">Total</th><th></th></tr></thead><tbody>${l.map(c=>`<tr class="${c.anulada?'off':''}"><td>${fday(c.fecha)}</td><td>${esc(c.tipo)}${c.anulada?'<div class="neg small">Anulada</div>':''}</td><td>${esc(c.proveedor)}</td><td>${esc(c.numero||pad5(c.nro))}</td><td class="n">${N(c.unidades)||''}</td><td class="n"><b>${c.tipo==='Nota de crédito'?'−':''}${money(c.total)}</b></td><td><div class="acts" style="flex-wrap:nowrap"><button class="ib" data-act="verCompra" data-id="${esc(c.id)}" title="Ver">${ic('receipt')}</button>${c.anulada?'':`<button class="ib" data-act="anularCompra" data-id="${esc(c.id)}" title="Anular">${ic('trash')}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${ic('truck')}<p>Todavía no cargaste compras. Cuando entra mercadería del taller, cargala acá: suma al stock y queda lo que le debés.</p></div>`)};
ACT.editProv=id=>{const p=D('proveedores').find(x=>x.id===id)||{};open(`<div class="mh"><h2>${id?'Editar proveedor':'Nuevo proveedor'}</h2>${xBtn}</div><div class="f2"><label class="fl full">Nombre *<input id="vN" value="${esc(p.nombre||'')}" autofocus></label><label class="fl">Rubro<input id="vR" value="${esc(p.rubro||'')}" placeholder="Taller, telas, avíos…"></label><label class="fl">WhatsApp<input id="vT" value="${esc(p.tel||'')}"></label><label class="fl">CUIT<input id="vC" value="${esc(p.cuit||'')}"></label><label class="fl">Alias / CBU<input id="vA" value="${esc(p.alias||'')}"></label><label class="fl full">Nota<input id="vO" value="${esc(p.nota||'')}"></label></div><div class="acts"><button class="btn p" data-act="saveProv" data-id="${esc(id)}" data-enter>Guardar</button>${id?`<button class="btn d" data-act="delProv" data-id="${esc(id)}">Borrar</button>`:''}</div>`)};
ACT.saveProv=async id=>{const g=s=>$(s).value.trim();const nombre=g('#vN');if(!nombre)return toast('Poné el nombre');if(await guard(()=>put('proveedores',id||uid(),{nombre,rubro:g('#vR'),tel:g('#vT'),cuit:g('#vC'),alias:g('#vA'),nota:g('#vO'),alta:new Date().toISOString()}))){close();toast('Proveedor guardado')}};
ACT.delProv=id=>ask('¿Borrar proveedor?','Sus compras quedan guardadas.','Borrar',async()=>{await guard(()=>rm('proveedores',id))});
let CMP=null;
ACT.newCompra=tipo=>{CMP={tipo,proveedor:'',numero:'',fecha:today(),items:[],monto:'',actCosto:true,nota:''};compraOpen()};
function compraOpen(){const tot=CMP.tipo==='Nota de débito'||(!CMP.items.length&&CMP.tipo==='Nota de crédito')?num(CMP.monto):sum(CMP.items,i=>N(i.costo)*N(i.cant));
 open(`<div class="mh"><h2>${esc(CMP.tipo==='Factura'?'Nueva compra':CMP.tipo)}</h2>${xBtn}</div><div class="f2"><label class="fl">Proveedor<input id="kP" list="dlprov" value="${esc(CMP.proveedor)}" autocomplete="off"><datalist id="dlprov">${D('proveedores').map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist></label><label class="fl">N° de comprobante / remito<input id="kNum" value="${esc(CMP.numero)}"></label><label class="fl">Fecha<input id="kF" type="date" value="${esc(CMP.fecha)}"></label>${depos().length>1?`<label class="fl">Depósito<select id="kDep">${depos().map(d=>`<option ${d===(CMP.dep||depos()[1])?'selected':''}>${esc(d)}</option>`).join('')}</select></label>`:''}<label class="fl">Nota<input id="kNo" value="${esc(CMP.nota)}"></label></div>
 ${CMP.tipo!=='Nota de débito'?`<div class="fl">${CMP.tipo==='Factura'?'Mercadería que entra':'Mercadería que devolvés (opcional)'}<div class="srch">${ic('search')}<input id="kq" placeholder="Buscar producto…" autocomplete="off"></div><div class="srchres" id="kres"></div></div>${CMP.items.length?`<div class="rows">${CMP.items.map((i,k)=>`<div><span><b>${esc(i.nombre)}</b> · ${esc(vname(i.t,i.c))} × ${i.cant} · costo ${money(i.costo)}</span><span>${money(i.cant*i.costo)} <button class="lnk" data-act="cmpDel" data-id="${k}">quitar</button></span></div>`).join('')}</div>`:''}`:''}
 ${CMP.tipo==='Nota de débito'||(CMP.tipo==='Nota de crédito'&&!CMP.items.length)?`<label class="fl">Monto<input id="kM" inputmode="numeric" value="${esc(CMP.monto)}"></label>`:''}
 ${CMP.tipo==='Factura'?`<label class="swt"><input type="checkbox" id="kAC" ${CMP.actCosto?'checked':''}> Actualizar el costo de los productos con este precio</label>`:''}
 <div class="rows"><div><b class="tt">Total</b><b class="bigt">${money(tot)}</b></div></div><div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn p big" data-act="saveCompra" style="flex:1">Guardar</button></div>`,true)}
const cmpRead=()=>{const g=s=>box.querySelector(s)?.value??'';CMP.proveedor=g('#kP').trim();CMP.numero=g('#kNum').trim();CMP.fecha=g('#kF')||today();CMP.nota=g('#kNo').trim();if(box.querySelector('#kDep'))CMP.dep=g('#kDep');if(box.querySelector('#kM'))CMP.monto=g('#kM');if(box.querySelector('#kAC'))CMP.actCosto=box.querySelector('#kAC').checked};
document.addEventListener('input',e=>{if(e.target.id==='kq'){const l=e.target.value.trim()?buscar(e.target.value,false).slice(0,8):[];$('#kres').innerHTML=l.map(a=>`<button data-act="cmpAdd" data-id="${esc(a.id)}"><div class="pth">${phIn(a.foto)}</div><span><b>${esc(a.nombre)}</b><br><span class="mute small">${esc(a.codigo||'')} · costo ${money(a.costo)}</span></span></button>`).join('')}});
ACT.cmpAdd=id=>{cmpRead();const a=art(id);const cdep=CMP.dep||depMain();open(`<div class="mh"><h2>${esc(a.nombre)}</h2><button class="x" data-act="cmpBack">×</button></div><label class="fl">Costo por unidad<input id="kCo" inputmode="numeric" value="${N(a.costo)||''}"></label>${vgrid(a,'in',null,cdep)}<div class="acts"><button class="btn" data-act="curva">+1 a cada uno</button><button class="btn p" data-act="cmpAddOk" data-id="${esc(id)}" data-enter>Agregar</button></div>`,true);setTimeout(()=>box.querySelector('.vg input')?.focus(),40)};
ACT.cmpBack=()=>compraOpen();
ACT.cmpAddOk=id=>{const a=art(id);const co=num($('#kCo').value);for(const {t,c,q} of Object.values(leerGrid()))if(q>0)CMP.items.push({art:id,codigo:a.codigo||'',nombre:a.nombre,t,c,cant:q,costo:co});compraOpen()};
ACT.cmpDel=k=>{cmpRead();CMP.items.splice(+k,1);compraOpen()};
ACT.saveCompra=async()=>{cmpRead();if(!CMP.proveedor)return toast('Elegí el proveedor');const conItems=CMP.items.length>0;const tot=conItems?sum(CMP.items,i=>i.costo*i.cant):num(CMP.monto);if(!tot&&!conItems)return toast(CMP.tipo==='Factura'?'Agregá la mercadería':'Poné el monto');
 const nro=nextNro('compras');const fecha=CMP.fecha===today()?new Date().toISOString():new Date(CMP.fecha+'T12:00').toISOString();const d={nro,fecha,tipo:CMP.tipo,proveedor:CMP.proveedor,numero:CMP.numero,items:CMP.items,total:tot,unidades:sum(CMP.items,i=>i.cant),nota:CMP.nota,dep:CMP.dep||depMain(),vendedor:vendedor(),anulada:false};
 if(!await guard(()=>put('compras',uid(),d)))return;if(conItems)await aplicarItems(CMP.items,CMP.tipo==='Nota de crédito'?-1:1,CMP.tipo==='Factura'?'Compra':'Devolución a proveedor',`${CMP.tipo} ${CMP.proveedor} ${CMP.numero}`,CMP.dep||depMain());
 if(CMP.tipo==='Factura'&&CMP.actCosto){const seen={};for(const i of CMP.items){if(seen[i.art])continue;seen[i.art]=1;if(i.costo)await guard(()=>upd('articulos',i.art,{costo:i.costo}))}}
 if(!D('proveedores').some(p=>ckey(p.nombre)===ckey(CMP.proveedor)))await guard(()=>put('proveedores',uid(),{nombre:CMP.proveedor,alta:fecha}));close();toast(CMP.tipo+' guardada')};
ACT.verCompra=id=>{const c=D('compras').find(x=>x.id===id);if(!c)return;open(`<div class="mh"><h2>${esc(c.tipo)} · ${esc(c.proveedor)}</h2>${xBtn}</div><p class="mute">${fdate(c.fecha)} · N° ${esc(c.numero||pad5(c.nro))}${c.nota?' · '+esc(c.nota):''}</p><div class="small">${grupoTxt(c.items)}</div><div class="rows"><div><b class="tt">Total</b><b class="bigt">${money(c.total)}</b></div></div>${PRINT?`<button class="btn" data-act="printCompra" data-id="${esc(c.id)}">${ic('printer')} Comprobante</button>`:''}`)};
ACT.printCompra=id=>{const c=D('compras').find(x=>x.id===id);if(c){close();printHtml(ticketHtml({...c,cliente:'Proveedor: '+c.proveedor,items:(c.items||[]).map(i=>({...i,precio:i.costo})),subtotal:c.total,pago:''},c.tipo).replace('Documento no válido como factura','Comprobante interno'))}};
ACT.anularCompra=id=>{const c=D('compras').find(x=>x.id===id);ask('¿Anular este comprobante?','El stock vuelve a como estaba y deja de contar en el saldo del proveedor.','Anular',async()=>{if(await guard(()=>upd('compras',id,{anulada:true}))){if(c.items?.length)await aplicarItems(c.items,c.tipo==='Nota de crédito'?1:-1,'Anulación',`${c.tipo} ${c.proveedor}`,c.dep&&depos().includes(c.dep)?c.dep:depMain());toast('Anulado')}})};
ACT.newPago=prov=>{const c=C();const cart=D('cheques').filter(q=>q.tipo==='tercero'&&q.estado==='En cartera');open(`<div class="mh"><h2>Pago a proveedor</h2>${xBtn}</div><div class="f2"><label class="fl">Proveedor<input id="gpP" list="dlprov2" value="${esc(prov||'')}" autocomplete="off"><datalist id="dlprov2">${D('proveedores').map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist></label><label class="fl">Cómo pagás<select id="gpM"><option>Efectivo</option><option>Transferencia</option><option value="Cheque de terceros">Cheques en cartera</option><option value="Cheque propio">Cheque propio</option></select></label><label class="fl">Monto<input id="gpMo" inputmode="numeric" placeholder="0"></label><label class="fl">Cuenta (si es transferencia)<select id="gpC"><option value="">—</option>${c.cuentas.map(q=>`<option>${esc(q.nombre)}</option>`).join('')}</select></label><label class="fl full">Nota<input id="gpN"></label></div>
 ${cart.length?`<div class="fl">Cheques en cartera para entregar<div class="rows">${cart.map(q=>`<div><label class="swt"><input type="checkbox" data-chq="${esc(q.id)}" data-imp="${N(q.importe)}"> ${esc(q.banco||'')} N° ${esc(q.numero||'')} · vence ${fday(q.vencimiento)}</label><b>${money(q.importe)}</b></div>`).join('')}</div></div>`:''}
 <div class="f2" id="gpProp" style="display:none"><label class="fl">Banco<input id="gqB"></label><label class="fl">N° cheque<input id="gqN"></label><label class="fl">Vencimiento<input id="gqV" type="date" value="${today()}"></label></div>
 <div class="acts"><button class="btn p" data-act="savePago" data-enter>Registrar pago</button></div>`)};
document.addEventListener('change',e=>{const t=e.target;if(t.id==='gpM'){const p=$('#gpProp');if(p)p.style.display=t.value==='Cheque propio'?'':'none'}if(t.matches?.('[data-chq]')){const s=sum([...box.querySelectorAll('[data-chq]:checked')],x=>x.dataset.imp);const m=$('#gpMo');if(m&&s)m.value=s}});
ACT.savePago=async()=>{const g=s=>($(s)?.value||'').trim();const prov=g('#gpP');const met=g('#gpM');const monto=num(g('#gpMo'));if(!prov||!monto)return toast('Poné proveedor y monto');const ids=[...box.querySelectorAll('[data-chq]:checked')].map(x=>x.dataset.chq);
 if(met==='Cheque de terceros'&&!ids.length)return toast('Marcá los cheques que entregás');
 if(!await guard(()=>put('caja',uid(),{fecha:new Date().toISOString(),tipo:'Pago proveedor',proveedor:prov,monto,metodo:met,cuenta:met==='Transferencia'?g('#gpC'):'',cheques:ids,nota:g('#gpN'),vendedor:vendedor()})))return;
 for(const id of ids)await guard(()=>upd('cheques',id,{estado:'Entregado',para:prov,fechaEntrega:new Date().toISOString()}));
 if(met==='Cheque propio')await guard(()=>put('cheques',uid(),{fecha:new Date().toISOString(),tipo:'propio',estado:'Entregado',banco:g('#gqB'),numero:g('#gqN'),vencimiento:g('#gqV'),importe:monto,para:prov,emisor:C().negocio}));
 close();toast('Pago registrado')};
ACT.anularPago=id=>ask('¿Anular el pago?','Vuelve a contar como deuda con el proveedor. Los cheques entregados vuelven a la cartera.','Anular',async()=>{const c=D('caja').find(x=>x.id===id);if(await guard(()=>upd('caja',id,{anulado:true}))){for(const q of (c.cheques||[]))await guard(()=>upd('cheques',q,{estado:'En cartera',para:''}));toast('Pago anulado')}});

/* ---- cheques ---- */
const CHQE=['En cartera','Depositado','Entregado','Cobrado','Rechazado'];
function chequesView(){const tp=S.chtipo||'tercero',es=S.chest||'';const l=D('cheques').filter(q=>q.tipo===tp&&(!es||q.estado===es)).sort((a,b)=>String(a.vencimiento).localeCompare(String(b.vencimiento)));const tot=sum(l,q=>q.importe);
 return `<div class="mh" style="margin-bottom:12px">${sub('chtipo',tp,[['tercero','De terceros'],['propio','Propios']])}<button class="btn p" data-act="newCheque">${ic('plus')} Nuevo cheque</button></div><div class="chipsrow"><button class="chipb ${!es?'on':''}" data-act="per" data-k="chest" data-id="">Todos</button>${CHQE.map(x=>`<button class="chipb ${es===x?'on':''}" data-act="per" data-k="chest" data-id="${x}">${x}</button>`).join('')}</div><div class="k4"><div class="kpi"><small>Cheques</small><b>${l.length}</b></div><div class="kpi"><small>Total</small><b>${money(tot)}</b></div></div>

/* ---- cuentas bancarias ---- */
function movsCuenta(nombre){const k=ckey(nombre);const out=[];const m=(f,d,v)=>out.push({f,d,m:v});
 D('ventas').forEach(v=>{if(!v.anulada&&v.pago==='Transferencia'&&ckey(v.cuenta)===k)m(v.fecha,'Venta N° '+pad5(v.nro),N(v.total))});
 D('caja').forEach(c=>{if(c.anulado)return;if(ckey(c.cuenta)!==k)return;if(c.tipo==='Cobro cuenta')m(c.fecha,'Pago de '+c.cliente,N(c.monto));if(c.tipo==='Pago proveedor')m(c.fecha,'Pago a '+c.proveedor,-N(c.monto));if(c.tipo==='Banco')m(c.fecha,c.nota||'Movimiento',N(c.monto))});
 D('gastos').forEach(g=>{if(g.metodo==='Transferencia'&&ckey(g.cuenta)===k)m(g.fecha,'Gasto: '+g.concepto,-N(g.monto))});
 D('cheques').forEach(q=>{if(q.estado==='Depositado'&&ckey(q.cuenta)===k)m(q.fechaEstado||q.fecha,'Cheque '+(q.banco||'')+' '+(q.numero||''),N(q.importe))});
 D('devoluciones').forEach(d=>{if(!d.anulada&&d.por==='Transferencia'&&ckey(d.cuenta)===k)m(d.fecha,'Devolución N° '+pad5(d.nro),-N(d.total))});
 return out.sort((a,b)=>String(b.f).localeCompare(String(a.f)))}
function bancosView(){const cs=C().cuentas;if(!cs.length)return `<div class="empty">${ic('bank')}<p>Cargá tus cuentas (Mercado Pago, bancos) en Configuración › Cobros y envíos.</p><button class="btn p" data-act="tab" data-id="config">Ir a Configuración</button></div>`;const sel=S.banco&&cs.some(c=>c.nombre===S.banco)?S.banco:cs[0].nombre;
 const sal=c=>N(c.inicial)+sum(movsCuenta(c.nombre),x=>x.m);const ms=movsCuenta(sel);
 return `<div class="k4">${cs.map(c=>`<button class="kpi" style="text-align:left;cursor:pointer;border:${c.nombre===sel?'2px solid var(--r)':'0'}" data-act="per" data-k="banco" data-id="${esc(c.nombre)}"><small>${esc(c.nombre)}</small><b>${money(sal(c))}</b></button>`).join('')}</div><div class="mh" style="margin-bottom:10px"><h3>Movimientos de ${esc(sel)}</h3><button class="btn s" data-act="bancoMov" data-id="${esc(sel)}">${ic('plus')} Movimiento manual</button></div>${ms.length?`<div class="panel rows">${ms.slice(0,200).map(x=>`<div><span>${fday(x.f)} · ${esc(x.d)}</span><b class="${x.m<0?'neg':'okc'}">${money(x.m)}</b></div>`).join('')}</div>`:'<p class="mute">Sin movimientos.</p>'}<p class="mute small">El saldo arranca en el "saldo inicial" de la cuenta (Configuración) y suma ventas por transferencia, pagos de clientes y cheques depositados; resta pagos a proveedores y gastos por transferencia.</p>`}

/* ---- caja: medios de pago y cierres ---- */
function medioTabla(day){const ms={};const add2=(m,k,v)=>{(ms[m]??={ing:0,egr:0});ms[m][k]+=v};
 D('ventas').forEach(v=>{if(!v.anulada&&dkey(v.fecha)===day)add2(v.pago||'—','ing',N(v.total))});D('caja').forEach(c=>{if(c.anulado||dkey(c.fecha)!==day)return;if(c.tipo==='Cobro cuenta')add2(c.metodo,'ing',N(c.monto));if(c.tipo==='Pago proveedor')add2(c.metodo,'egr',N(c.monto));if(c.tipo==='Ingreso')add2('Efectivo','ing',N(c.monto));if(c.tipo==='Retiro')add2('Efectivo','egr',N(c.monto))});
 D('gastos').forEach(g=>{if(dkey(g.fecha)===day)add2(g.metodo||'Efectivo','egr',N(g.monto))});D('devoluciones').forEach(d=>{if(!d.anulada&&dkey(d.fecha)===day&&!d.cambio)add2(d.por,'egr',N(d.total))});D('pedidos').forEach(p=>{if(N(p.sena)&&dkey(p.fecha)===day&&p.estado!=='Cancelado')add2(p.senaMet||'Efectivo','ing',N(p.sena))});
 const r=Object.entries(ms);if(!r.length)return '';return `<div class="tw" style="margin-top:14px"><table class="t"><thead><tr><th>Medio de pago</th><th class="n">Entró</th><th class="n">Salió</th><th class="n">Neto</th></tr></thead><tbody>${r.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="n okc">${money(v.ing)}</td><td class="n neg">${money(v.egr)}</td><td class="n"><b>${money(v.ing-v.egr)}</b></td></tr>`).join('')}</tbody></table></div>`}
ACT.cerrarCaja=()=>{const cj=cajaDia(today());open(`<div class="mh"><h2>Cerrar caja de hoy</h2>${xBtn}</div><p>Contá la plata que hay en el cajón y escribila. La app la compara con lo que debería haber.</p><div class="rows"><div><span>Debería haber en efectivo</span><b class="bigt">${money(cj.queda)}</b></div></div><div class="f2"><label class="fl">Lo que contaste<input id="ccC" inputmode="numeric" autofocus></label><label class="fl">Nota<input id="ccN" placeholder="Opcional"></label></div><div id="ccD"></div><div class="acts"><button class="btn p" data-act="cerrarOk" data-enter>Cerrar caja</button></div>`)};

 const por={};D('ventas').forEach(x=>{if(!x.anulada&&dkey(x.fecha)===today())por[x.pago]=(por[x.pago]||0)+N(x.total)});
 if(!await guard(()=>put('cierres',uid(),{fecha:new Date().toISOString(),esperado:cj.queda,contado:cont,diferencia:dif,nota:$('#ccN').value.trim(),vendedor:vendedor(),ventas:por})))return;
 if(dif)await guard(()=>put('caja',uid(),{fecha:new Date().toISOString(),tipo:'Ajuste arqueo',monto:dif,nota:'Diferencia al cerrar caja',vendedor:vendedor()}));close();toast(dif?`Caja cerrada con ${dif>0?'sobrante':'faltante'} de ${money(Math.abs(dif))}`:'Caja cerrada: coincide')};

const RT={};
RT.ganancia=()=>{const by={};ventasR().forEach(v=>{const f=N(v.subtotal)?(N(v.total)-N(v.envio)-N(v.impuesto))/N(v.subtotal):1;(v.items||[]).forEach(i=>{const o=by[i.nombre]??={u:0,v:0,c:0,sc:false};o.u+=N(i.cant);o.v+=N(i.precio)*N(i.cant)*f;o.c+=N(i.costo)*N(i.cant);if(!N(i.costo))o.sc=true})});const r=Object.entries(by).sort((a,b)=>(b[1].v-b[1].c)-(a[1].v-a[1].c));
 return `<div class="tw"><table class="t"><thead><tr><th>Producto</th><th class="n">Prendas</th><th class="n">Vendido</th><th class="n">Costo</th><th class="n">Ganancia</th><th class="n">Margen</th></tr></thead><tbody>${r.map(([k,o])=>`<tr><td><b>${esc(k)}</b>${o.sc?'<div class="lowc small">Falta cargar costo</div>':''}</td><td class="n">${o.u}</td><td class="n">${money(o.v)}</td><td class="n">${money(o.c)}</td><td class="n"><b class="${o.v-o.c<0?'neg':'okc'}">${money(o.v-o.c)}</b></td><td class="n">${o.v?Math.round((o.v-o.c)/o.v*100)+'%':'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="mute">Sin ventas.</td></tr>'}</tbody></table></div>`};
RT.comparar=()=>{const n=new Date();const ms=[];for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('es-AR',{month:'short'})+' '+String(d.getFullYear()).slice(2),t:0,u:0})}
 const dw=[0,0,0,0,0,0,0];D('ventas').forEach(v=>{if(v.anulada)return;const m=ms.find(x=>x.k===v.fecha.slice(0,7));if(m){m.t+=vtot(v);m.u+=N(v.unidades)}});ventasR().forEach(v=>dw[new Date(v.fecha).getDay()]+=vtot(v));const mx=Math.max(1,...ms.map(x=>x.t));
 const dn=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];return `<div class="panel" style="margin-bottom:14px"><h3>Vendido por mes (últimos 12 meses)</h3><div class="days" style="height:190px">${ms.map(m=>`<div class="day" title="${esc(m.l)}: ${money(m.t)} · ${m.u} prendas"><i style="height:${(m.t/mx*85).toFixed(1)}%"></i><small>${esc(m.l.split(' ')[0])}</small></div>`).join('')}</div></div><div class="cols2"><div class="panel"><h3>Mes a mes</h3><div class="rows">${ms.slice().reverse().map((m,i,a)=>{const p=a[i+1];const d=p&&p.t?Math.round((m.t-p.t)/p.t*100):null;return `<div><span>${esc(m.l)}</span><span><b>${money(m.t)}</b> ${d!=null?`<span class="${d<0?'neg':'okc'} small">${d>0?'+':''}${d}%</span>`:''}</span></div>`}).join('')}</div></div><div class="panel"><h3>Por día de la semana (período elegido)</h3>${bars(dw.map((t,i)=>[dn[i],t]).filter(x=>x[1]),money)}</div></div>`};
RT.clientes=()=>{const st={};D('ventas').forEach(v=>{if(v.anulada||!v.cliente)return;const o=st[ckey(v.cliente)]??={n:v.cliente,c:0,t:0,u:''};if(inR(v.fecha,rango(S.rper))){o.c++;o.t+=vtot(v)}if(!o.u||v.fecha>o.u)o.u=v.fecha});const dias=N(S.sinDias||60);const lim=new Date(Date.now()-dias*864e5).toISOString();
 const sin=D('clientes').filter(c=>{const o=st[ckey(c.nombre)];return !o||o.u<lim}).map(c=>({c,u:st[ckey(c.nombre)]?.u||''}));
 return `<div class="cols2"><div class="panel"><h3>Ranking de clientes (período elegido)</h3>${bars(Object.values(st).filter(o=>o.t).sort((a,b)=>b.t-a.t).slice(0,15).map(o=>[o.n+' ('+o.c+')',o.t]),money)}</div><div class="panel"><div class="mh"><h3>Clientes que no compran hace más de</h3><select id="sinDias" style="width:auto">${[30,60,90,180].map(d=>`<option ${d===dias?'selected':''} value="${d}">${d} días</option>`).join('')}</select></div><div class="rows">${sin.map(({c,u})=>{const wa=waLink(c.tel,`Hola ${c.nombre}! ¿Cómo estás? Te escribimos de ${C().negocio}: entraron modelos nuevos. ¿Te paso la lista?`);return `<div><span><b>${esc(c.nombre)}</b><br><span class="mute small">${u?'Última compra '+fday(u):'Nunca compró'}</span></span>${wa?`<a class="btn s" href="${esc(wa)}" target="_blank" rel="noopener">${ic('wa')} Escribirle</a>`:''}</div>`}).join('')||'<p class="mute">Todos compraron hace poco.</p>'}</div></div></div>`};
document.addEventListener('change',e=>{if(e.target.id==='sinDias'){S.sinDias=+e.target.value;render(true)}});
RT.comisiones=()=>{const c=C();const by={};ventasR().forEach(v=>{const k=v.vendedor||'—';const o=by[k]??={n:0,t:0,u:0};o.n++;o.t+=vtot(v);o.u+=N(v.unidades)});
 return `<div class="tw"><table class="t"><thead><tr><th>Vendedor</th><th class="n">Ventas</th><th class="n">Prendas</th><th class="n">Vendido</th><th class="n">Comisión %</th><th class="n">A pagar</th></tr></thead><tbody>${Object.entries(by).map(([k,o])=>{const p=N(c.comision[k]??c.usuarios.find(u=>u.nombre===k)?.comision);return `<tr><td><b>${esc(k)}</b></td><td class="n">${o.n}</td><td class="n">${o.u}</td><td class="n">${money(o.t)}</td><td class="n">${p}%</td><td class="n"><b>${money(o.t*p/100)}</b></td></tr>`}).join('')||'<tr><td colspan="6" class="mute">Sin ventas.</td></tr>'}</tbody></table></div><p class="mute small">El % de cada vendedor se pone en Configuración › Equipo.</p>`};
RT.ajustes=()=>{const vs=ventasR();const tr={};vs.forEach(v=>{if(N(v.envio))tr[v.transporte||'Envío']=(tr[v.transporte||'Envío']||0)+N(v.envio)});const pm={};vs.forEach(v=>{if(N(v.ajuste))pm[v.pago]=(pm[v.pago]||0)+N(v.ajuste)});
 return `<div class="k4"><div class="kpi"><small>Descuentos dados</small><b class="r">${money(sum(vs,v=>v.descuento))}</b><small>${vs.filter(v=>N(v.descuento)).length} ventas</small></div><div class="kpi"><small>Recargos cobrados</small><b class="g">${money(sum(vs.filter(v=>N(v.ajuste)>0),v=>v.ajuste))}</b></div><div class="kpi"><small>Descuentos por forma de pago</small><b class="r">${money(-sum(vs.filter(v=>N(v.ajuste)<0),v=>v.ajuste))}</b></div><div class="kpi"><small>Envíos cobrados</small><b>${money(sum(vs,v=>v.envio))}</b></div><div class="kpi"><small>Impuestos</small><b>${money(sum(vs,v=>v.impuesto))}</b></div></div><div class="cols2"><div class="panel"><h3>Envíos por transporte</h3>${bars(top(tr,10),money)}</div><div class="panel"><h3>Recargo / descuento por forma de pago</h3>${bars(Object.entries(pm),money)}</div></div>`};
RT.stockr=()=>{const by={};let tc=0,tv=0,tu=0;D('articulos').forEach(a=>{const u=Math.max(0,stockTot(a));const k=a.categoria||'Sin categoría';const o=by[k]??={u:0,c:0,v:0};o.u+=u;o.c+=u*N(a.costo);o.v+=u*precioBase(a,0);tu+=u;tc+=u*N(a.costo);tv+=u*precioBase(a,0)});const mv=C().minVar;
 const rep=D('articulos').filter(a=>a.activo!==false).flatMap(a=>variantes(a).filter(({t,c})=>svAll(a,t,c)<=mv).map(({t,c})=>({a,t,c,s:svAll(a,t,c)})));
 return `<div class="k4"><div class="kpi"><small>Prendas en stock</small><b>${tu.toLocaleString('es-AR')}</b></div>${depos().length>1?depos().map(d=>`<div class="kpi"><small>En ${esc(d)}</small><b>${sum(D('articulos'),a=>Math.max(0,stockDep(a,d))).toLocaleString('es-AR')} u.</b></div>`).join(''):''}<div class="kpi"><small>Valor al costo</small><b>${money(tc)}</b></div><div class="kpi"><small>Valor a ${esc(C().listas[0])}</small><b class="b">${money(tv)}</b></div></div><div class="tw" style="margin-bottom:14px"><table class="t"><thead><tr><th>Categoría</th><th class="n">Prendas</th><th class="n">Al costo</th><th class="n">A precio</th></tr></thead><tbody>${Object.entries(by).map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td class="n">${o.u}</td><td class="n">${money(o.c)}</td><td class="n">${money(o.v)}</td></tr>`).join('')}</tbody></table></div>
 <div class="panel"><div class="mh"><h3>Para reponer: talles y colores con ${mv} o menos</h3><button class="btn s" data-act="exp" data-id="reposicion">Bajar a Excel</button></div><div class="chips">${rep.slice(0,200).map(x=>`<span class="chip ${x.s>0?'low':'out'}">${esc(x.a.nombre)} ${esc(vname(x.t,x.c))}: ${x.s}</span>`).join('')||'<span class="mute">Nada para reponer.</span>'}</div></div>`};
const _exp=ACT.exp;ACT.exp=id=>{if(id==='reposicion'){const mv=C().minVar;return bajar(`nayes-reposicion-${today()}.csv`,csv([['producto','codigo','talle','color','stock'],...D('articulos').filter(a=>a.activo!==false).flatMap(a=>variantes(a).filter(({t,c})=>svAll(a,t,c)<=mv).map(({t,c})=>[a.nombre,a.codigo,t,c,svAll(a,t,c)]))]))}if(id==='compras')return bajar(`nayes-compras-${today()}.csv`,csv([['fecha','tipo','proveedor','numero','producto','talle','color','cantidad','costo','total comprobante'],...D('compras').flatMap(c=>(c.items?.length?c.items:[{}]).map(i=>[fday(c.fecha),c.tipo,c.proveedor,c.numero,i.nombre||'',i.t||'',i.c||'',i.cant||'',i.costo||'',c.total]))]));return _exp(id)};

/* ---- estilos extra para etiquetas y lista de precios ---- */
(()=>{const st=document.createElement('style');st.textContent=`.lbA4{display:none}.lbA4 .lb,.lbRollo .lb{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:10px/1.2 Arial,sans-serif;color:#000;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
@media print{.lbA4{display:grid!important;grid-template-columns:repeat(3,1fr);gap:2mm}.lbA4 .lb{height:30mm;border:1px dashed #bbb;padding:1.5mm}.lbRollo .lb{width:50mm;height:25mm;padding:1mm;page-break-after:always}.lb b{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.lb .bc{width:92%;height:11mm;margin:1mm 0 0}.lb small{font:9px monospace}#ticket.lpA4{display:block!important}.lp{font:12px/1.35 Arial,sans-serif;color:#000}.lp table{width:100%;border-collapse:collapse;margin-top:6mm}.lp th,.lp td{border-bottom:1px solid #ccc;padding:2mm;text-align:left;vertical-align:middle}.lp td.n{text-align:right;font-weight:700;white-space:nowrap}.lp td img{width:14mm;height:17mm;object-fit:cover}.lph{display:flex;gap:6mm;align-items:center}.lph img{height:16mm}.lp small{color:#555}}`;document.head.appendChild(st)})();

/* ---- depósitos: transferencias y vista por depósito ---- */
ACT.transfer=id=>{const a=art(id);if(!a)return;const from=depos().includes(S.trFrom)?S.trFrom:depos()[1]||depMain(),to=depos().includes(S.trTo)?S.trTo:depMain();if(from===to)return toast('Elegí dos depósitos distintos');S.cartOpen=false;const gd=esSimple(from)&&!esSimple(to)?to:from;
 open(`<div class="mh"><div><h2>Transferencia · ${esc(a.nombre)}</h2><span class="mute small">De <b>${esc(from)}</b> a <b>${esc(to)}</b> · ${gd===from?'debajo de cada casilla ves lo que hay en '+esc(from):'elegí los talles que entran a '+esc(to)+' (en '+esc(from)+' se descuenta por color)'}</span></div>${xBtn}</div>${vgrid(a,'in',null,gd)}<label class="fl">Nota (opcional)<input id="mNota"></label><div class="acts"><button class="btn" data-act="curva">+1 a cada uno</button>${gd===from?'<button class="btn" data-act="trTodo">Pasar todo lo que hay</button>':''}<button class="btn p" data-act="saveTr" data-id="${esc(id)}" data-enter>Transferir</button></div>`,true);setTimeout(()=>box.querySelector('.vg input')?.focus(),40)};
ACT.trTodo=()=>box.querySelectorAll('.vg input').forEach(i=>{const s=sint(i.nextElementSibling?.textContent);i.value=s>0?s:''});
ACT.saveTr=async id=>{const a=art(id);const from=depos().includes(S.trFrom)?S.trFrom:depos()[1]||depMain(),to=depos().includes(S.trTo)?S.trTo:depMain();const out={},inn={};let n=0;box.querySelectorAll('.vg input').forEach(i=>{const q=int(i.value);if(q){const k=vk(i.dataset.t,i.dataset.c);out[k]=-q;inn[k]=q;n+=q}});if(!n)return toast('Poné al menos una cantidad');
 const nota=($('#mNota')?.value||'').trim();if(await moverStock(a,out,'Transferencia',`${from} → ${to}`,nota,from)){await moverStock(art(id),inn,'Transferencia',`${from} → ${to}`,nota,to);close();S.sq='';render(true);toast(`Pasaste ${n} prendas de ${from} a ${to}`)}};
function stockDepView(){const ds=depos();const l=D('articulos').filter(a=>stockTot(a)!==0||a.activo!==false).sort((a,b)=>ncmp(a.nombre,b.nombre));
 return `<div class="k4">${ds.map(d=>`<div class="kpi"><small>${esc(d)}</small><b>${sum(l,a=>stockDep(a,d)).toLocaleString('es-AR')} u.</b></div>`).join('')}</div><div class="tw"><table class="t"><thead><tr><th>Producto</th>${ds.map(d=>`<th class="n">${esc(d)}</th>`).join('')}<th class="n">Total</th><th></th></tr></thead><tbody>${l.map(a=>`<tr><td><b>${esc(a.nombre)}</b> <span class="mute small">${esc(a.codigo||'')}</span></td>${ds.map(d=>{const s=stockDep(a,d);return `<td class="n ${s<0?'neg':''}">${s}</td>`}).join('')}<td class="n"><b>${stockTot(a)}</b></td><td><button class="btn s" data-act="verDep" data-id="${esc(a.id)}">Ver detalle</button></td></tr>`).join('')}</tbody></table></div>`}
ACT.verDep=id=>{const a=art(id);const ds=depos();const dt=ds.filter(d=>!esSimple(d));const cs=colores(a).length?colores(a):[''];
 const t1=dt.length?`<h3>Por talle${dt.length<ds.length?' · '+esc(dt.join(', ')):''}</h3><div class="tw"><table class="t"><thead><tr><th>Talle / color</th>${dt.map(d=>`<th class="n">${esc(d)}</th>`).join('')}</tr></thead><tbody>${variantes(a).map(({t,c})=>`<tr><td>${esc(vname(t,c))}</td>${dt.map(d=>{const v=sv(a,t,c,d);return `<td class="n ${v<0?'neg':''}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:'';
 const t2=`<h3 style="margin-top:12px">${cs[0]?'Por color':'Total'} en cada lugar</h3><div class="tw"><table class="t"><thead><tr><th>${cs[0]?'Color':''}</th>${ds.map(d=>`<th class="n">${esc(d)}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${c?dotHtml(c)+' '+esc(c):'Unidades'}</td>${ds.map(d=>{const v=totColor(a,c,d);return `<td class="n ${v<0?'neg':''}">${v}</td>`}).join('')}<td class="n"><b>${sum(ds,d=>totColor(a,c,d))}</b></td></tr>`).join('')}</tbody></table></div>`;
 open(`<div class="mh"><h2>${esc(a.nombre)}</h2>${xBtn}</div>${t1}${t2}<div class="acts"><button class="btn p" data-act="trDesde" data-id="${esc(id)}">Transferir</button></div>`,true)};
ACT.trDesde=id=>{close();ACT.transfer(id)};
document.addEventListener('change',e=>{const t=e.target;if(t.id==='depv'){DEPV=t.value;try{localStorage.setItem('nayes-dep',DEPV)}catch(er){}render(true);toast('Ahora vendés desde '+DEPV)}else if(t.id==='sdepSel'){S.sdep=t.value;render(true)}else if(t.id==='trFrom'){S.trFrom=t.value}else if(t.id==='trTo'){S.trTo=t.value}});

/* ---- campos de opciones (chips) y filas, en vez de comas/renglones ---- */
const chipEl=(v,dots)=>`<span class="chi" data-v="${esc(v)}">${dots?dotHtml(v):''}${esc(v)}<button data-act="chipX" aria-label="Quitar ${esc(v)}">×</button></span>`;
const chipsF=(id,list,ph)=>`<div class="chin" data-chipf="${esc(id)}">${(list||[]).map(v=>chipEl(v)).join('')}<input data-chipin="${esc(id)}" placeholder="${esc(ph||'Escribí y apretá Enter…')}" autocomplete="off"></div>`;
function readChips(id){const w=document.querySelector(`[data-chipf="${id}"]`);if(!w)return[];const l=[...w.querySelectorAll('.chi')].map(x=>x.dataset.v);const i=w.querySelector('input');if(i&&i.value.trim())l.push(i.value.trim());return [...new Set(l.filter(Boolean))]}
ACT.chipX=(x,b)=>b.closest('.chi')?.remove();
document.addEventListener('keydown',e=>{const t=e.target;if(!t.matches?.('[data-chipin]'))return;if(e.key==='Enter'||e.key===','){e.preventDefault();e.stopPropagation();const v=t.value.trim().replace(/,$/,'');if(v&&![...t.parentNode.querySelectorAll('.chi')].some(c=>c.dataset.v.toLowerCase()===v.toLowerCase()))t.insertAdjacentHTML('beforebegin',chipEl(v));t.value=''}else if(e.key==='Backspace'&&!t.value){const l=t.parentNode.querySelectorAll('.chi');if(l.length)l[l.length-1].remove()}},true);
let rowN=0;
const ROWT={
 mod:m=>`<tr><td><input data-r="p" value="${esc(m.p||'')}" placeholder="BER" style="width:100px;text-transform:uppercase"></td><td><input data-r="n" value="${esc(m.n||'')}" placeholder="Bermuda"></td><td><button class="ib" data-act="rowDel" aria-label="Quitar">${ic('trash')}</button></td></tr>`,
 pre:p=>`<tr><td><input data-r="n" value="${esc(p.n||'')}" placeholder="Kids" style="width:120px"></td><td>${chipsF('pre'+(++rowN),(p.t||[]).map(String),'Talle y Enter…')}</td><td><button class="ib" data-act="rowDel" aria-label="Quitar">${ic('trash')}</button></td></tr>`,
 tr:t=>`<tr><td><input data-r="n" value="${esc(t.n||'')}" placeholder="Ej: Vía Cargo"></td><td><input data-r="c" inputmode="numeric" value="${N(t.c)||''}" placeholder="0" style="width:110px;text-align:right"></td><td><button class="ib" data-act="rowDel" aria-label="Quitar">${ic('trash')}</button></td></tr>`};
const rowsF=(k,list,heads)=>`<div class="tw"><table class="t"><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}<th></th></tr></thead><tbody data-rows="${k}">${(list||[]).map(ROWT[k]).join('')}</tbody></table></div><button class="btn s" data-act="rowAdd" data-id="${k}" style="margin-top:6px">${ic('plus')} Agregar</button>`;
ACT.rowAdd=k=>{const tb=document.querySelector(`[data-rows="${k}"]`);if(tb){tb.insertAdjacentHTML('beforeend',ROWT[k]({}));tb.lastElementChild.querySelector('input')?.focus()}};
ACT.rowDel=(x,b)=>b.closest('tr')?.remove();
const readRows=k=>[...document.querySelectorAll(`[data-rows="${k}"] tr`)].map(tr=>{const o={};tr.querySelectorAll('[data-r]').forEach(i=>o[i.dataset.r]=i.value.trim());const cf=tr.querySelector('[data-chipf]');if(cf)o.t=readChips(cf.dataset.chipf);return o});
/* música */
const au=new Audio();let songs=[],cur=-1,shuf=false,curUrl='';
try{au.volume=+(localStorage.getItem('nayes-vol')??0.7)}catch(e){au.volume=.7}
const fmtT=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
async function loadSongs(){try{songs=(await IDB.run('songs','readonly',s=>s.getAll())||[]).map(x=>({id:x.id,name:x.name,orden:x.orden||0})).sort((a,b)=>a.orden-b.orden)}catch(e){songs=[]}playerUI()}
function playerUI(){const p=$('#player');p.hidden=!songs.length;document.body.classList.toggle('conplayer',!!songs.length);
 $('#mName').textContent=cur>=0&&songs[cur]?songs[cur].name:'Elegí una canción';$('#mPlay').textContent=au.paused?'▶':'❚❚';$('#mPlay').setAttribute('aria-label',au.paused?'Reproducir':'Pausar');
 $('#mShuf').setAttribute('aria-pressed',shuf);$('#mVol').value=au.volume;const l=$('#mlist');if(l)l.innerHTML=mlist()}
async function playAt(i){if(!songs.length)return;i=(i+songs.length)%songs.length;const rec=await IDB.run('songs','readonly',s=>s.get(songs[i].id));if(!rec)return;
 if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(rec.blob);au.src=curUrl;cur=i;try{await au.play()}catch(e){}playerUI()}
const nextI=()=>shuf&&songs.length>1?(cur+1+Math.floor(Math.random()*(songs.length-1)))%songs.length:cur+1;
au.addEventListener('ended',()=>playAt(nextI()));au.addEventListener('play',playerUI);au.addEventListener('pause',playerUI);
au.addEventListener('timeupdate',()=>{const s=$('#mSeek');if(!s.matches(':active'))s.value=au.duration?Math.round(au.currentTime/au.duration*1000):0;$('#mTime').textContent=fmtT(au.currentTime)+' / '+fmtT(au.duration)});
ACT.mPlay=()=>{if(cur<0)return playAt(0);au.paused?au.play().catch(()=>{}):au.pause()};
ACT.mNext=()=>playAt(nextI());ACT.mPrev=()=>au.currentTime>3?(au.currentTime=0):playAt(cur-1);
ACT.mShuf=()=>{shuf=!shuf;playerUI()};ACT.mSong=id=>playAt(+id);
ACT.mDel=async id=>{const s=songs[+id];if(!s)return;await IDB.run('songs','readwrite',st=>st.delete(s.id));if(+id===cur){au.pause();au.removeAttribute('src');cur=-1}else if(+id<cur)cur--;await loadSongs()};
$('#mSeek').addEventListener('input',e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration});
$('#mVol').addEventListener('input',e=>{au.volume=+e.target.value;try{localStorage.setItem('nayes-vol',au.volume)}catch(er){}});
const mlist=()=>songs.length?songs.map((s,i)=>`<div class="line"><button class="btn s ${i===cur?'p':''}" data-act="mSong" data-id="${i}" style="justify-content:flex-start;white-space:normal;text-align:left">${i===cur&&!au.paused?'❚❚ ':'▶ '}${esc(s.name)}</button><button class="btn s d" data-act="mDel" data-id="${i}" aria-label="Quitar canción">Quitar</button></div>`).join(''):'<p class="mute">Todavía no agregaste canciones.</p>';
V.musica=()=>`${backBtn()}<div class="mh hd1"><h1>Música para el local</h1><label class="btn p">${ic('plus')} Agregar canciones<input type="file" accept="audio/*" multiple id="mFiles" hidden></label></div><div class="panel"><p class="mute">Elegí archivos de música de la compu (mp3, m4a, wav). Quedan guardados en la app y se escuchan sin internet. El reproductor queda abajo mientras vendés.</p><div id="mlist">${mlist()}</div></div>`;
async function addSongs(files){let n=songs.length,k=0;for(const f of files){if(!f.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name))continue;try{await IDB.run('songs','readwrite',s=>s.put({id:uid(),name:f.name.replace(/\.[^.]+$/,''),blob:f,orden:Date.now()+n++}));k++}catch(e){toast('No entró: '+f.name)}}toast(k===1?'Agregaste 1 canción':`Agregaste ${k} canciones`);await loadSongs()}
document.addEventListener('change',e=>{if(e.target.id==='mFiles'&&e.target.files?.length){addSongs([...e.target.files]);e.target.value=''}});
/* restaurar copia */
document.addEventListener('change',async e=>{const t=e.target;if(t.id!=='impJson'||!t.files?.[0])return;const f=t.files[0];t.value='';let d;try{d=JSON.parse(await f.text())}catch(er){return toast('Ese archivo no es una copia válida')}
 let datos=null,cfg={};if(d&&d.datos&&typeof d.datos==='object'){datos=d.datos;cfg=d.config||{}}else if(d&&Array.isArray(d.articulos)){datos={articulos:d.articulos,ventas:d.ventas||[],clientes:d.clientes||[]};cfg=d.config||{}}
 if(!datos)return toast('Ese archivo no es una copia de Nayes');
 ask('¿Restaurar esta copia?',`${NUBE?'Se suben a la nube (lo que ya está con el mismo código se reemplaza)':'Se reemplaza todo lo de esta compu por la copia'}: ${(datos.articulos||[]).length} productos, ${(datos.ventas||[]).length} ventas y ${(datos.clientes||[]).length} clientes.`,'Restaurar',async()=>{await cargarTodo(datos,cfg);render(true);toast('Copia restaurada')})});

try{const t=localStorage.getItem('nayes-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
themeUI();fromHash();render(true);boot();

}
</script>
